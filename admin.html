<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>SkillSwap 管理后台</title>
  <style>
    :root{--ink:#171417;--muted:#746c72;--paper:#f7f3f4;--card:#fff;--line:#e8dde1;--rose:#be5a7a;--rose-soft:#f6dce5;--danger:#a92f44;--success:#287a58;--shadow:0 18px 60px rgba(58,31,43,.10)}
    *{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#fbf8f9,#f1e8eb);color:var(--ink);font:15px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.muted{color:var(--muted)}
    .login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(460px,100%);padding:38px;border:1px solid var(--line);border-radius:28px;background:rgba(255,255,255,.9);box-shadow:var(--shadow)}.brand{font-size:13px;font-weight:900;letter-spacing:.18em;color:var(--rose)}.login-card h1{font-size:38px;margin:10px 0 6px;letter-spacing:-.05em}.login-card form{display:grid;gap:16px;margin-top:28px}.field{display:grid;gap:7px;font-weight:700}.field input,.field select,.toolbar input,.toolbar select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px 13px;color:var(--ink);outline:none}.field input:focus,.field select:focus,.toolbar input:focus,.toolbar select:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(190,90,122,.14)}
    .btn{border:0;border-radius:13px;min-height:42px;padding:9px 16px;background:var(--ink);color:#fff;font-weight:800}.btn:hover{filter:brightness(1.08)}.btn:disabled{cursor:not-allowed;opacity:.55}.btn-light{background:#f3edef;color:var(--ink);border:1px solid var(--line)}.btn-rose{background:var(--rose)}.btn-danger{background:#fae5e9;color:var(--danger)}.btn-small{min-height:34px;padding:6px 10px;font-size:13px}
    .form-error{margin:0;color:var(--danger);font-weight:700}.login-note{margin-top:22px;padding:13px;border-radius:14px;background:var(--paper);color:var(--muted);font-size:13px}
    .app{min-height:100vh;display:grid;grid-template-columns:240px 1fr}.sidebar{position:sticky;top:0;height:100vh;padding:26px 18px;background:var(--ink);color:#fff;display:flex;flex-direction:column}.sidebar .brand{color:#f4b9ca;padding:0 10px}.sidebar h1{font-size:25px;margin:8px 10px 30px}.nav{display:grid;gap:7px}.nav button{border:0;border-radius:13px;padding:12px 14px;background:transparent;color:#cfc7cc;text-align:left;font-weight:800}.nav button.active,.nav button:hover{background:#312930;color:#fff}.admin-summary{margin-top:auto;padding:15px 10px 0;border-top:1px solid #3d343b}.admin-summary strong,.admin-summary small{display:block;overflow:hidden;text-overflow:ellipsis}.admin-summary small{color:#bdb3b9;margin:3px 0 12px}
    .content{min-width:0;padding:32px clamp(20px,4vw,56px) 60px}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:24px}.page-head h2{font-size:36px;letter-spacing:-.04em;margin:0}.page-head p{margin:5px 0 0}.panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 35px rgba(58,31,43,.06);overflow:hidden}.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}.stat{padding:22px}.stat strong{display:block;font-size:32px;letter-spacing:-.04em}.stat span{color:var(--muted);font-weight:700}.welcome{margin-top:18px;padding:26px}.welcome h3{margin:0 0 8px;font-size:22px}.welcome p{max-width:760px;margin:0;color:var(--muted)}
    .toolbar{padding:16px;display:grid;grid-template-columns:minmax(180px,1fr) repeat(2,minmax(130px,180px)) auto;gap:10px;border-bottom:1px solid var(--line)}.toolbar.audit-toolbar{grid-template-columns:1fr auto}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;white-space:nowrap}.table th,.table td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)}.table th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:#fbf8f9}.table tr:last-child td{border-bottom:0}.table-actions{display:flex;gap:6px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800;background:#eee8ea;color:#574f54}.badge.admin{background:var(--rose-soft);color:#8b3654}.badge.active{background:#ddf2e8;color:var(--success)}.badge.inactive,.badge.expired{background:#f5e2e5;color:var(--danger)}.badge.user{background:#e8edf7;color:#405479}.empty{padding:44px;text-align:center;color:var(--muted)}.pagination{padding:14px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.pagination-actions{display:flex;gap:8px}
    .modal-backdrop{position:fixed;inset:0;z-index:80;background:rgba(20,15,19,.52);display:grid;place-items:center;padding:20px}.modal{width:min(520px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:26px;box-shadow:var(--shadow)}.modal h3{font-size:25px;margin:0 0 20px}.modal form{display:grid;gap:15px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:8px}
    .toast{position:fixed;z-index:100;right:22px;bottom:22px;max-width:420px;padding:13px 17px;border-radius:13px;background:var(--ink);color:#fff;box-shadow:var(--shadow);font-weight:700}.toast.error{background:var(--danger)}.loading{padding:45px;text-align:center;color:var(--muted)}.details{max-width:380px;white-space:normal;word-break:break-word;color:var(--muted);font-size:13px}
    @media(max-width:1050px){.stats{grid-template-columns:repeat(3,1fr)}.toolbar{grid-template-columns:1fr 1fr}.toolbar .btn{grid-column:2}.app{grid-template-columns:200px 1fr}}
    @media(max-width:760px){.app{display:block}.sidebar{position:static;height:auto;padding:18px}.sidebar h1{margin-bottom:16px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{text-align:center;padding:9px 4px;font-size:12px}.admin-summary{display:none}.content{padding:22px 14px 50px}.page-head{align-items:flex-start}.page-head h2{font-size:30px}.stats{grid-template-columns:1fr 1fr}.toolbar,.toolbar.audit-toolbar{grid-template-columns:1fr}.toolbar .btn{grid-column:auto}.form-row{grid-template-columns:1fr}.table th,.table td{padding:11px}.modal{padding:21px}}
  </style>
</head>
<body>
  <main id="login-view" class="login-shell">
    <section class="login-card" aria-labelledby="login-title">
      <div class="brand">SKILLSWAP · ADMIN</div>
      <h1 id="login-title">管理员登录</h1>
      <p class="muted">管理本机 SQLite 中的账号和登录会话。</p>
      <form id="login-form">
        <label class="field"><span>管理员邮箱</span><input id="login-email" type="email" autocomplete="username" required /></label>
        <label class="field"><span>密码</span><input id="login-password" type="password" autocomplete="current-password" required /></label>
        <p id="login-error" class="form-error hidden" role="alert"></p>
        <button id="login-submit" class="btn btn-rose" type="submit">登录后台</button>
      </form>
      <div class="login-note">管理员账号通过服务器环境变量创建。后台和管理 API 仅允许从服务器本机访问。</div>
    </section>
  </main>

  <div id="app-view" class="app hidden">
    <aside class="sidebar">
      <div class="brand">SKILLSWAP</div><h1>管理后台</h1>
      <nav class="nav" aria-label="后台导航">
        <button data-view="overview" class="active">概览</button>
        <button data-view="users">用户</button>
        <button data-view="sessions">会话</button>
        <button data-view="audit">审计</button>
      </nav>
      <div class="admin-summary"><strong id="admin-name"></strong><small id="admin-email"></small><button id="logout-button" class="btn btn-light btn-small">退出登录</button></div>
    </aside>
    <main class="content">
      <header class="page-head"><div><h2 id="page-title">概览</h2><p id="page-subtitle" class="muted">本机账号与会话状态</p></div><button id="mobile-logout" class="btn btn-light btn-small">退出</button></header>
      <div id="page-content"></div>
    </main>
  </div>

  <div id="modal-root"></div><div id="toast" class="toast hidden" role="status"></div>

  <script>
    "use strict";
    const state={admin:null,view:"overview",users:{page:1,pageSize:25,query:"",role:"",status:""},sessions:{page:1,pageSize:25,purpose:"",status:""},audit:{page:1,pageSize:25,query:""}};
    const titles={overview:["概览","本机账号与会话状态"],users:["用户管理","创建、编辑、重置密码或删除账号"],sessions:["会话管理","查看并撤销登录会话"],audit:["审计日志","查看超级管理员操作记录"]};
    const $=selector=>document.querySelector(selector);
    const escapeHtml=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const csrfToken=()=>{const match=document.cookie.split("; ").find(item=>item.startsWith("skillswap_admin_csrf="));return match?decodeURIComponent(match.split("=").slice(1).join("=")):"";};
    async function api(path,options={}){const method=options.method||"GET";const headers={Accept:"application/json",...(options.headers||{})};if(method!=="GET"&&method!=="HEAD"){headers["Content-Type"]="application/json";headers["X-CSRF-Token"]=csrfToken();}const response=await fetch(path,{...options,method,headers,credentials:"same-origin"});let payload={};try{payload=await response.json();}catch(error){}if(response.status===401&&path!=="/api/admin/auth/login"){showLogin("管理员会话已失效，请重新登录。");throw new Error("会话已失效");}if(!response.ok){const error=new Error(payload.message||`请求失败（${response.status}）`);error.code=payload.error;error.status=response.status;throw error;}return payload;}
    function showToast(message,error=false){const toast=$("#toast");toast.textContent=message;toast.className=`toast${error?" error":""}`;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.add("hidden"),3200);}
    function showLogin(message=""){$("#app-view").classList.add("hidden");$("#login-view").classList.remove("hidden");state.admin=null;const error=$("#login-error");error.textContent=message;error.classList.toggle("hidden",!message);$("#login-password").value="";}
    function showApp(admin){state.admin=admin;$("#login-view").classList.add("hidden");$("#app-view").classList.remove("hidden");$("#admin-name").textContent=admin.displayName;$("#admin-email").textContent=admin.email;openView(state.view);}
    async function checkSession(){try{const payload=await api("/api/admin/auth/me");showApp(payload.admin);}catch(error){if(!state.admin)showLogin();}}
    $("#login-form").addEventListener("submit",async event=>{event.preventDefault();const button=$("#login-submit");const error=$("#login-error");button.disabled=true;button.textContent="正在登录…";error.classList.add("hidden");try{const payload=await api("/api/admin/auth/login",{method:"POST",body:JSON.stringify({email:$("#login-email").value,password:$("#login-password").value})});showApp(payload.admin);}catch(failure){error.textContent=failure.message;error.classList.remove("hidden");}finally{button.disabled=false;button.textContent="登录后台";}});
    async function logout(){try{await api("/api/admin/auth/logout",{method:"POST",body:"{}"});}catch(error){}showLogin();}
    $("#logout-button").addEventListener("click",logout);$("#mobile-logout").addEventListener("click",logout);
    document.querySelectorAll("[data-view]").forEach(button=>button.addEventListener("click",()=>openView(button.dataset.view)));
    function openView(view){state.view=view;document.querySelectorAll("[data-view]").forEach(button=>button.classList.toggle("active",button.dataset.view===view));$("#page-title").textContent=titles[view][0];$("#page-subtitle").textContent=titles[view][1];$("#page-content").innerHTML='<div class="panel loading">正在载入…</div>';({overview:loadOverview,users:loadUsers,sessions:loadSessions,audit:loadAudit}[view])().catch(error=>{$("#page-content").innerHTML=`<div class="panel empty">${escapeHtml(error.message)}</div>`;});}
    async function loadOverview(){const {overview}=await api("/api/admin/overview");const cards=[["账号总数",overview.totalUsers],["有效账号",overview.activeUsers],["有效管理员",overview.activeAdmins],["活跃会话",overview.activeSessions],["审计事件",overview.auditEvents]];$("#page-content").innerHTML=`<section class="stats">${cards.map(([label,value])=>`<article class="panel stat"><strong>${escapeHtml(value)}</strong><span>${label}</span></article>`).join("")}</section><section class="panel welcome"><h3>本地数据库管理</h3><p>这里仅展示 SQLite 中的认证数据。密码哈希、密码盐、会话令牌哈希和 CSRF 哈希永远不会通过管理 API 返回。</p></section>`;}
    const queryString=params=>new URLSearchParams(Object.entries(params).filter(([,value])=>value!==""&&value!==undefined)).toString();
    function paginationHtml(data,kind){return `<div class="pagination"><span>共 ${data.total} 条 · 第 ${data.page}/${data.totalPages} 页</span><div class="pagination-actions"><button class="btn btn-light btn-small" data-page-kind="${kind}" data-page="${data.page-1}" ${data.page<=1?"disabled":""}>上一页</button><button class="btn btn-light btn-small" data-page-kind="${kind}" data-page="${data.page+1}" ${data.page>=data.totalPages?"disabled":""}>下一页</button></div></div>`;}
    async function loadUsers(){const filters=state.users;const data=await api(`/api/admin/users?${queryString(filters)}`);$("#page-content").innerHTML=`<section class="panel"><form id="user-filters" class="toolbar"><input name="query" value="${escapeHtml(filters.query)}" placeholder="搜索邮箱或名称"/><select name="role"><option value="">全部角色</option><option value="user" ${filters.role==="user"?"selected":""}>普通用户</option><option value="superadmin" ${filters.role==="superadmin"?"selected":""}>超级管理员</option></select><select name="status"><option value="">全部状态</option><option value="active" ${filters.status==="active"?"selected":""}>有效</option><option value="inactive" ${filters.status==="inactive"?"selected":""}>停用</option></select><button type="button" id="add-user" class="btn btn-rose">新增用户</button></form>${data.items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>账号</th><th>角色</th><th>状态</th><th>活跃会话</th><th>创建时间</th><th>操作</th></tr></thead><tbody>${data.items.map(user=>`<tr><td><strong>${escapeHtml(user.displayName)}</strong><br><span class="muted">${escapeHtml(user.email)}</span></td><td><span class="badge ${user.role==="superadmin"?"admin":"user"}">${user.role==="superadmin"?"超级管理员":"普通用户"}</span></td><td><span class="badge ${user.isActive?"active":"inactive"}">${user.isActive?"有效":"停用"}</span></td><td>${user.activeSessionCount}</td><td>${formatDate(user.createdAt)}</td><td><div class="table-actions"><button class="btn btn-light btn-small" data-edit-user="${user.id}">编辑</button><button class="btn btn-light btn-small" data-reset-user="${user.id}">重置密码</button><button class="btn btn-danger btn-small" data-delete-user="${user.id}" ${user.id===state.admin.id?"disabled":""}>删除</button></div></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">没有符合条件的用户</div>'}${paginationHtml(data,"users")}</section>`;bindUserEvents(data.items);}
    function bindUserEvents(users){const form=$("#user-filters");form.addEventListener("submit",event=>event.preventDefault());form.querySelectorAll("input,select").forEach(input=>input.addEventListener("change",()=>{state.users={...state.users,page:1,query:form.query.value,role:form.role.value,status:form.status.value};loadUsers();}));let searchTimer;form.query.addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{state.users={...state.users,page:1,query:form.query.value};loadUsers();},300);});$("#add-user").addEventListener("click",()=>openUserModal());document.querySelectorAll("[data-edit-user]").forEach(button=>button.addEventListener("click",()=>openUserModal(users.find(user=>user.id===Number(button.dataset.editUser)))));document.querySelectorAll("[data-reset-user]").forEach(button=>button.addEventListener("click",()=>openPasswordModal(users.find(user=>user.id===Number(button.dataset.resetUser)))));document.querySelectorAll("[data-delete-user]").forEach(button=>button.addEventListener("click",()=>deleteUser(users.find(user=>user.id===Number(button.dataset.deleteUser)))));bindPagination();}
    function openUserModal(user=null){const editing=Boolean(user);$("#modal-root").innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><h3>${editing?"编辑用户":"新增用户"}</h3><form id="user-form"><label class="field"><span>邮箱</span><input name="email" type="email" value="${escapeHtml(user?.email||"")}" required></label><label class="field"><span>显示名称</span><input name="displayName" value="${escapeHtml(user?.displayName||"")}" maxlength="80" required></label>${editing?"":'<label class="field"><span>初始密码</span><input name="password" type="password" minlength="8" maxlength="128" required><small class="muted">普通用户至少 8 位，超级管理员至少 12 位。</small></label>'}<div class="form-row"><label class="field"><span>角色</span><select name="role"><option value="user" ${user?.role!=="superadmin"?"selected":""}>普通用户</option><option value="superadmin" ${user?.role==="superadmin"?"selected":""}>超级管理员</option></select></label><label class="field"><span>状态</span><select name="isActive"><option value="true" ${user?.isActive!==false?"selected":""}>有效</option><option value="false" ${user?.isActive===false?"selected":""}>停用</option></select></label></div><p class="form-error hidden" id="modal-error"></p><div class="modal-actions"><button type="button" class="btn btn-light" data-close-modal>取消</button><button class="btn btn-rose" type="submit">保存</button></div></form></section></div>`;bindModalClose();$("#user-form").addEventListener("submit",async event=>{event.preventDefault();const form=event.currentTarget;const body={email:form.email.value,displayName:form.displayName.value,role:form.role.value,isActive:form.isActive.value==="true"};if(!editing)body.password=form.password.value;try{await api(editing?`/api/admin/users/${user.id}`:"/api/admin/users",{method:editing?"PATCH":"POST",body:JSON.stringify(body)});closeModal();showToast(editing?"用户已更新":"用户已创建");loadUsers();}catch(error){const target=$("#modal-error");target.textContent=error.message;target.classList.remove("hidden");}});}
    function openPasswordModal(user){$("#modal-root").innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><h3>重置密码</h3><p>为 <strong>${escapeHtml(user.email)}</strong> 设置新密码。成功后该账号全部会话会被撤销。</p><form id="password-form"><label class="field"><span>新密码</span><input name="password" type="password" minlength="${user.role==="superadmin"?12:8}" maxlength="128" required></label><p class="form-error hidden" id="modal-error"></p><div class="modal-actions"><button type="button" class="btn btn-light" data-close-modal>取消</button><button class="btn btn-rose" type="submit">确认重置</button></div></form></section></div>`;bindModalClose();$("#password-form").addEventListener("submit",async event=>{event.preventDefault();try{await api(`/api/admin/users/${user.id}/password`,{method:"POST",body:JSON.stringify({password:event.currentTarget.password.value})});closeModal();if(user.id===state.admin.id){showLogin("密码已更新，请使用新密码重新登录。");}else{showToast("密码已重置，会话已撤销");loadUsers();}}catch(error){const target=$("#modal-error");target.textContent=error.message;target.classList.remove("hidden");}});}
    async function deleteUser(user){if(!confirm(`确认永久删除 ${user.email}？该账号的所有会话也会被删除。`))return;try{await api(`/api/admin/users/${user.id}`,{method:"DELETE"});showToast("用户已删除");loadUsers();}catch(error){showToast(error.message,true);}}
    async function loadSessions(){const filters=state.sessions;const data=await api(`/api/admin/sessions?${queryString(filters)}`);$("#page-content").innerHTML=`<section class="panel"><form id="session-filters" class="toolbar"><select name="purpose"><option value="">全部用途</option><option value="user" ${filters.purpose==="user"?"selected":""}>普通登录</option><option value="admin" ${filters.purpose==="admin"?"selected":""}>管理员登录</option></select><select name="status"><option value="">全部状态</option><option value="active" ${filters.status==="active"?"selected":""}>活跃</option><option value="expired" ${filters.status==="expired"?"selected":""}>已过期</option></select><span></span><button type="button" id="refresh-sessions" class="btn btn-light">刷新</button></form>${data.items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>账号</th><th>用途</th><th>状态</th><th>创建时间</th><th>过期时间</th><th>操作</th></tr></thead><tbody>${data.items.map(session=>`<tr><td>${escapeHtml(session.displayName)}<br><span class="muted">${escapeHtml(session.email)}</span></td><td><span class="badge ${session.purpose==="admin"?"admin":"user"}">${session.purpose==="admin"?"管理员":"普通登录"}</span></td><td><span class="badge ${session.status}">${session.status==="active"?"活跃":"已过期"}</span></td><td>${formatEpoch(session.createdAt)}</td><td>${formatEpoch(session.expiresAt)}</td><td><button class="btn btn-danger btn-small" data-revoke-session="${escapeHtml(session.publicId)}" ${session.isCurrent?"disabled title=\"请使用退出登录\"":""}>${session.isCurrent?"当前会话":"强制结束"}</button></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">没有会话记录</div>'}${paginationHtml(data,"sessions")}</section>`;const form=$("#session-filters");form.querySelectorAll("select").forEach(input=>input.addEventListener("change",()=>{state.sessions={...state.sessions,page:1,purpose:form.purpose.value,status:form.status.value};loadSessions();}));$("#refresh-sessions").addEventListener("click",loadSessions);document.querySelectorAll("[data-revoke-session]").forEach(button=>button.addEventListener("click",()=>revokeSession(button.dataset.revokeSession)));bindPagination();}
    async function revokeSession(publicId){if(!confirm("确认强制结束这个登录会话？"))return;try{await api(`/api/admin/sessions/${encodeURIComponent(publicId)}`,{method:"DELETE"});showToast("会话已结束");loadSessions();}catch(error){showToast(error.message,true);}}
    async function loadAudit(){const filters=state.audit;const data=await api(`/api/admin/audit-logs?${queryString(filters)}`);$("#page-content").innerHTML=`<section class="panel"><form id="audit-filters" class="toolbar audit-toolbar"><input name="query" value="${escapeHtml(filters.query)}" placeholder="搜索管理员、操作或目标 ID"/><button type="button" id="refresh-audit" class="btn btn-light">刷新</button></form>${data.items.length?`<div class="table-wrap"><table class="table"><thead><tr><th>时间</th><th>管理员</th><th>操作</th><th>目标</th><th>详情</th></tr></thead><tbody>${data.items.map(item=>`<tr><td>${formatDate(item.createdAt)}</td><td>${escapeHtml(item.actorEmail)}</td><td><span class="badge">${escapeHtml(item.action)}</span></td><td>${escapeHtml(item.targetType)} #${escapeHtml(item.targetId)}</td><td class="details">${escapeHtml(JSON.stringify(item.details))}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">没有审计记录</div>'}${paginationHtml(data,"audit")}</section>`;const form=$("#audit-filters");let timer;form.query.addEventListener("input",()=>{clearTimeout(timer);timer=setTimeout(()=>{state.audit={...state.audit,page:1,query:form.query.value};loadAudit();},300);});$("#refresh-audit").addEventListener("click",loadAudit);bindPagination();}
    function bindPagination(){document.querySelectorAll("[data-page-kind]").forEach(button=>button.addEventListener("click",()=>{const kind=button.dataset.pageKind;state[kind].page=Number(button.dataset.page);({users:loadUsers,sessions:loadSessions,audit:loadAudit}[kind])();}));}
    function bindModalClose(){document.querySelectorAll("[data-close-modal]").forEach(button=>button.addEventListener("click",closeModal));$("#modal-root .modal-backdrop").addEventListener("click",event=>{if(event.target.classList.contains("modal-backdrop"))closeModal();});}
    function closeModal(){$("#modal-root").innerHTML="";}
    function formatDate(value){if(!value)return"—";const date=new Date(value);return Number.isNaN(date.getTime())?escapeHtml(value):new Intl.DateTimeFormat("zh-CN",{dateStyle:"medium",timeStyle:"short"}).format(date);}
    function formatEpoch(value){return formatDate(new Date(Number(value)*1000).toISOString());}
    checkSession();
  </script>
</body>
