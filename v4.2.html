<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e89bb1">
  <meta name="description" content="SkillSwap v5.0 — 学你所爱，分享你所会。">
  <meta name="application-version" content="v5.0">
  <title>SkillSwap v5.0</title>
  <style>
    /* 1. Design tokens */
    :root {
      --ink: #181818; --paper: #fff9fa; --deep-rose: #b85f7d; --rose: #d97091;
      --soft-rose: #eba0b5; --blush: #f7dce3; --tag-cream: #f5dfe5; --glass: rgba(255,255,255,.58);
      --line: rgba(255,255,255,.66); --muted: rgba(24,24,24,.64); --focus: #6f2243;
      --danger: #7e1838; --success: #17633c; --shadow: 0 26px 80px rgba(77,28,48,.16);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* 2. Reset / base */
    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: light; scroll-behavior: smooth; }
    body {
      margin: 0; min-width: 320px; min-height: 100vh; overflow-x: hidden; color: var(--ink); font-family: var(--font);
      background:
        radial-gradient(circle at 8% 12%, rgba(255,249,250,.76), transparent 22%),
        radial-gradient(circle at 88% 18%, rgba(255,255,255,.48), transparent 28%),
        linear-gradient(145deg, #b75f7d 0%, #e99bb1 42%, #f5cbd5 72%, #d67e9a 100%);
      background-attachment: fixed;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .17;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    h1, h2, h3, p { margin-top: 0; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--focus); outline-offset: 3px;
    }
    #root { min-height: 100vh; position: relative; isolation: isolate; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* 3. Failure-safe / generic */
    .static-fallback, .boot-shell, .recovery, .self-tests { width: min(680px, calc(100% - 32px)); margin: 0 auto; padding: 15vh 28px 36px; }
    .fallback-kicker, .eyebrow { margin: 0 0 12px; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .static-fallback h1, .boot-shell h1, .recovery h1 { margin: 0 0 16px; font-size: clamp(42px, 9vw, 76px); line-height: .94; letter-spacing: -.06em; font-weight: 500; }
    .panel, .glass { border: 1px solid var(--line); background: var(--glass); box-shadow: var(--shadow); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .panel { padding: 24px; border-radius: 28px; }
    .test-list { display: grid; gap: 10px; padding: 0; list-style: none; }
    .test-item { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.7); }
    .test-item.pass { border-left: 5px solid var(--success); } .test-item.fail { border-left: 5px solid var(--danger); }
    .test-error { display: block; margin-top: 4px; font-size: 13px; }

    /* 4. App chrome */
    .app-shell { min-height: 100vh; padding: 18px 24px 56px; }
    .site-header {
      position: sticky; top: 14px; z-index: 30; width: min(1180px, 100%); min-height: 52px; margin: 0 auto 30px;
      display: flex; align-items: center; gap: 8px;
    }
    .brand { border: 0; background: transparent; font-weight: 850; font-size: 21px; letter-spacing: -.04em; }
    .brand-dot { color: var(--deep-rose); }
    .pill-logo {
      width: 52px; height: 52px; flex: 0 0 52px; padding: 0; display: grid; place-items: center; overflow: hidden;
      border: 0; border-radius: 50%; background: var(--deep-rose); color: white; box-shadow: 0 14px 34px rgba(111,34,67,.2);
      animation: pill-logo-enter .52s cubic-bezier(.22,1,.36,1) both;
    }
    .pill-logo-mark { display: block; font-size: 18px; font-weight: 900; letter-spacing: 0; transition: transform .52s cubic-bezier(.22,1,.36,1); }
    .pill-logo .brand-dot { color: var(--blush); }
    .pill-logo:hover .pill-logo-mark, .pill-logo:focus-visible .pill-logo-mark { transform: rotate(360deg); }
    .top-nav {
      height: 54px; margin-left: auto; padding: 5px; display: flex; align-items: stretch; gap: 8px; overflow: hidden;
      border: 1px solid rgba(255,255,255,.74); border-radius: 999px; background: rgba(255,249,250,.62);
      box-shadow: 0 14px 34px rgba(111,34,67,.14); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      animation: pill-nav-enter .58s .05s cubic-bezier(.22,1,.36,1) both;
    }
    .nav-link {
      position: relative; isolation: isolate; min-width: 0; height: 42px; padding: 0 20px; overflow: hidden;
      border: 0; border-radius: 999px; background: rgba(255,255,255,.82); color: var(--ink); font-weight: 800; line-height: 1;
    }
    .nav-hover-circle {
      position: absolute; z-index: 1; left: 50%; bottom: -46px; width: max(130%, 92px); aspect-ratio: 1;
      border-radius: 50%; background: var(--deep-rose); pointer-events: none;
      transform: translateX(-50%) scale(0); transform-origin: 50% 100%;
      transition: transform .38s cubic-bezier(.22,1,.36,1); will-change: transform;
    }
    .nav-label-stack { position: relative; z-index: 2; display: grid; place-items: center; overflow: hidden; }
    .nav-label, .nav-label-hover { grid-area: 1 / 1; display: block; transition: transform .32s cubic-bezier(.22,1,.36,1), opacity .2s ease; }
    .nav-label-hover { color: white; opacity: 0; transform: translateY(140%); }
    .nav-link:hover .nav-hover-circle, .nav-link:focus-visible .nav-hover-circle { transform: translateX(-50%) scale(1.35); }
    .nav-link:hover .nav-label, .nav-link:focus-visible .nav-label { opacity: 0; transform: translateY(-140%); }
    .nav-link:hover .nav-label-hover, .nav-link:focus-visible .nav-label-hover { opacity: 1; transform: translateY(0); }
    .nav-link.active { background: var(--deep-rose); color: white; }
    .nav-link.active::after {
      content: ""; position: absolute; z-index: 3; left: 50%; bottom: 4px; width: 5px; height: 5px;
      border-radius: 50%; background: white; transform: translateX(-50%);
    }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .lang-toggle, .icon-btn { min-width: 44px; min-height: 44px; border: 1px solid rgba(24,24,24,.12); border-radius: 999px; background: rgba(255,255,255,.74); color: var(--ink); font-weight: 800; }
    .site-header .lang-toggle { width: 52px; height: 52px; border: 0; background: rgba(255,255,255,.9); box-shadow: 0 14px 34px rgba(77,28,48,.14); }
    @keyframes pill-logo-enter { from { opacity: 0; transform: scale(.55) rotate(-18deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes pill-nav-enter { from { opacity: 0; clip-path: inset(0 100% 0 0 round 999px); } to { opacity: 1; clip-path: inset(0 0 0 0 round 999px); } }
    .page { width: min(1180px, 100%); margin: 0 auto; }
    .page-head { margin: 0 0 30px; display: flex; align-items: end; justify-content: space-between; gap: 20px; }
    .page-title { margin: 0; max-width: 780px; font-size: clamp(42px, 7vw, 82px); font-weight: 500; line-height: .93; letter-spacing: -.065em; }
    .page-subtitle { max-width: 620px; margin: 14px 0 0; color: var(--muted); font-size: 17px; line-height: 1.65; }
    .section { margin-top: 60px; }
    .section-head { margin-bottom: 20px; display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    .section-title { margin: 0; font-size: clamp(28px, 4vw, 44px); font-weight: 570; letter-spacing: -.045em; }
    .section-note { margin: 0; color: var(--muted); }

    /* 5. Buttons / form controls */
    .btn { min-height: 46px; padding: 11px 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 999px; font-weight: 800; text-decoration: none; transition: transform .22s ease, box-shadow .22s ease, background .22s ease; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--ink); color: white; box-shadow: 0 12px 28px rgba(24,24,24,.18); }
    .btn-light { background: rgba(255,255,255,.82); color: var(--ink); border-color: rgba(24,24,24,.08); }
    .btn-rose { background: var(--deep-rose); color: white; }
    .btn-ghost { background: transparent; color: var(--ink); border-color: rgba(24,24,24,.14); }
    .btn-small { min-height: 40px; padding: 8px 15px; font-size: 13px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .field { display: grid; gap: 7px; }
    .field label, .field-label { font-size: 13px; font-weight: 800; }
    .input, .select, .textarea { width: 100%; min-height: 50px; padding: 13px 15px; border: 1px solid rgba(24,24,24,.12); border-radius: 17px; background: rgba(255,255,255,.82); color: var(--ink); }
    .textarea { min-height: 110px; resize: vertical; }
    .field-error, .form-error { margin: 0; color: var(--danger); font-size: 13px; font-weight: 700; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .span-2 { grid-column: 1 / -1; }
    .auth-form { display: grid; gap: 15px; }
    .select-menu { position: relative; min-width: 0; }
    .select-trigger {
      width: 100%; min-height: 58px; padding: 9px 13px; display: grid; grid-template-columns: 1fr auto;
      align-items: center; gap: 10px; border: 1px solid rgba(24,24,24,.12); border-radius: 17px;
      background: rgba(255,255,255,.84); color: var(--ink); text-align: left; box-shadow: 0 10px 28px rgba(77,28,48,.08);
    }
    .select-trigger:hover { border-color: rgba(24,24,24,.24); background: rgba(255,255,255,.94); }
    .select-trigger[aria-expanded="true"] { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(111,34,67,.12); }
    .select-trigger:disabled { opacity: .52; cursor: not-allowed; box-shadow: none; }
    .select-trigger-copy { min-width: 0; display: grid; gap: 2px; }
    .select-trigger-label { color: var(--muted); font-size: 10px; font-weight: 850; text-transform: uppercase; }
    .select-trigger-value { overflow: hidden; font-size: 14px; font-weight: 800; text-overflow: ellipsis; white-space: nowrap; }
    .select-chevron { font-size: 13px; transition: transform .18s ease; }
    .select-trigger[aria-expanded="true"] .select-chevron { transform: rotate(180deg); }
    .select-popover {
      position: absolute; z-index: 42; inset: calc(100% + 8px) auto auto 0; width: max(100%, 220px); max-width: min(320px, calc(100vw - 28px));
      padding: 8px; border: 1px solid rgba(24,24,24,.12); border-radius: 18px; background: var(--paper);
      box-shadow: 0 24px 70px rgba(45,20,31,.24);
    }
    .select-menu.align-end .select-popover { inset-inline: auto 0; }
    .select-search { min-height: 42px; margin-bottom: 7px; border-radius: 12px; }
    .select-options { max-height: 250px; overflow: auto; display: grid; gap: 3px; }
    .select-option {
      width: 100%; min-height: 42px; padding: 9px 10px; display: grid; grid-template-columns: 1fr auto; align-items: center;
      gap: 12px; border: 0; border-radius: 11px; background: transparent; color: var(--ink); text-align: left;
    }
    .select-option:hover, .select-option:focus-visible { background: var(--blush); }
    .select-option[aria-selected="true"] { background: var(--ink); color: white; font-weight: 800; }
    .select-empty { margin: 0; padding: 12px; color: var(--muted); font-size: 13px; }

    /* 6. Landing */
    .landing-shell { min-height: 100vh; padding: 18px 24px 48px; overflow: hidden; }
    .landing-nav { width: min(1180px,100%); min-height: 60px; margin: 0 auto 26px; display: flex; align-items: center; }
    .landing-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .hero-grid { width: min(1180px,100%); margin: 0 auto; display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; align-items: stretch; }
    .hero-copy { min-height: 530px; padding: clamp(28px,5vw,68px); border-radius: 32px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
    .hero-copy::after { content: ""; position: absolute; width: 300px; height: 300px; right: -100px; bottom: -110px; border-radius: 50%; background: linear-gradient(145deg, rgba(255,255,255,.62), rgba(217,112,145,.52)); }
    .hero-title { position: relative; z-index: 1; margin: 0; max-width: 780px; font-size: clamp(58px,8.2vw,112px); line-height: .82; letter-spacing: -.085em; font-weight: 500; white-space: nowrap; }
    .hero-title span { display: block; margin-left: 15%; color: var(--deep-rose); }
    .hero-bottom { position: relative; z-index: 1; max-width: 600px; }
    .hero-lead { font-size: clamp(18px,2vw,23px); line-height: 1.45; }
    .hero-side { display: grid; grid-template-rows: 1fr auto; gap: 18px; }
    .gallery-card { min-height: 390px; padding: 22px; border-radius: 32px; background: var(--paper); overflow: hidden; position: relative; }
    .gallery-date { margin: 0; font-size: clamp(56px,7vw,92px); font-weight: 500; line-height: .78; letter-spacing: -.07em; }
    .gallery-date span { display: block; color: #aaa; font-weight: 350; }
    .gallery-orbit { position: absolute; width: 230px; height: 230px; right: -55px; bottom: 58px; border-radius: 50%; background: linear-gradient(140deg,#f6a0b5,#df6c91); }
    .avatar-stack { position: absolute; left: 24px; bottom: 24px; display: flex; }
    .avatar-stack .avatar { margin-left: -12px; border: 4px solid var(--paper); }
    .avatar-stack .avatar:first-child { margin-left: 0; }
    .black-card { min-height: 122px; padding: 22px; border-radius: 28px; background: var(--ink); color: white; display: flex; align-items: end; justify-content: space-between; }
    .black-card h2 { margin: 0; font-size: 30px; font-weight: 500; letter-spacing: -.04em; }
    .black-card p { margin: 4px 0 0; color: rgba(255,255,255,.55); }
    .community-stats { align-items: center; gap: 20px; }
    .stat-row { display: flex; align-items: end; gap: 14px; text-align: right; }
    .stat-item { display: grid; gap: 3px; }
    .stat-item strong { font-size: 22px; }
    .stat-item span { color: rgba(255,255,255,.62); font-size: 11px; white-space: nowrap; }
    .marquee-zone { width: min(1180px,100%); margin: 22px auto 0; display: grid; gap: 10px; }
    .marquee { overflow: hidden; border-radius: 999px; }
    .marquee-track { width: max-content; display: flex; gap: 10px; padding: 3px 0; animation: marquee 33s linear infinite; }
    .marquee.reverse .marquee-track { animation-duration: 40s; animation-direction: reverse; }
    .marquee-zone:hover .marquee-track, .marquee-zone:focus-within .marquee-track { animation-play-state: paused; }
    @keyframes marquee { to { transform: translateX(-50%); } }
    .skill-tag { min-height: 42px; padding: 10px 17px; border: 1px solid rgba(255,255,255,.82); border-radius: 999px; background: var(--tag-cream); color: #241d20; font-size: 13px; font-weight: 800; white-space: nowrap; }
    .skill-tag[data-tone="1"] { background: #f8e9ed; } .skill-tag[data-tone="2"] { background: #e9c1ce; }
    .skill-tag[data-tone="3"] { background: #fff7f2; } .skill-tag[data-tone="4"] { background: #d7a0b5; }
    button.skill-tag:hover { background: var(--ink); color: white; }

    /* 7. Auth / onboarding */
    .auth-layout { width: min(1040px,100%); min-height: calc(100vh - 150px); margin: 0 auto; display: grid; grid-template-columns: .92fr 1.08fr; gap: 18px; }
    .auth-art { padding: 36px; border-radius: 32px; background: var(--ink); color: white; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
    .auth-art::after { content:""; width: 300px; height: 300px; position: absolute; right: -90px; bottom: 38px; border-radius: 50%; background: linear-gradient(150deg,#f3cbd6,#c96888); }
    .auth-art h1 { position: relative; z-index: 1; margin: 0; font-size: clamp(48px,7vw,84px); line-height: .9; letter-spacing: -.07em; font-weight: 500; }
    .auth-card { padding: clamp(26px,5vw,54px); border-radius: 32px; display: flex; flex-direction: column; justify-content: center; }
    .auth-card h1 { margin-bottom: 8px; font-size: clamp(40px,5vw,62px); letter-spacing: -.06em; font-weight: 500; }
    .muted { color: var(--muted); }
    .divider { margin: 20px 0; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content:""; height: 1px; flex: 1; background: rgba(24,24,24,.13); }
    .progress-wrap { margin-bottom: 28px; }
    .progress-meta { display:flex; justify-content:space-between; gap:12px; margin-bottom:8px; font-size:12px; font-weight:800; }
    .progress-bar { height: 8px; overflow: hidden; border-radius:999px; background:rgba(255,255,255,.48); }
    .progress-fill { height:100%; border-radius:inherit; background:var(--ink); transition:width .25s ease; }
    .onboarding-card { width:min(860px,100%); margin:0 auto; padding:clamp(24px,5vw,52px); border-radius:32px; }
    .skill-editor-list { display:grid; gap:14px; margin:20px 0; }
    .skill-editor { padding:16px; border-radius:22px; background:rgba(255,255,255,.58); border:1px solid rgba(24,24,24,.08); }
    .skill-editor-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .skill-editor .remove { margin-top:10px; }

    /* 8. Cards / discover */
    .search-hero { padding: 18px; border-radius: 25px; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .search-input { width:100%; min-height:54px; padding:14px 18px; border:0; border-radius:18px; background:rgba(255,255,255,.84); font-size:17px; }
    .goal-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .card-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .user-card { min-width:0; min-height:410px; padding:18px; border-radius:26px; background:rgba(255,249,250,.88); display:flex; flex-direction:column; box-shadow:0 18px 55px rgba(77,28,48,.13); }
    .card-top { display:flex; align-items:center; gap:13px; }
    .avatar { width:60px; height:60px; flex:0 0 auto; border-radius:50%; overflow:hidden; background:linear-gradient(145deg,#f4c6d2,#b85f7d); color:white; display:grid; place-items:center; font-weight:850; }
    .avatar.large { width:112px; height:112px; font-size:30px; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .user-name { margin:0 0 2px; font-size:21px; letter-spacing:-.03em; }
    .user-meta { margin:0; color:var(--muted); font-size:13px; }
    .user-bio { margin:16px 0; color:var(--muted); line-height:1.5; }
    .mini-heading { margin:0 0 7px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .skill-pills { display:flex; flex-wrap:wrap; gap:6px; }
    .mini-pill { padding:7px 10px; border-radius:999px; background:var(--blush); font-size:12px; font-weight:750; }
    .match-line { margin-top:auto; padding-top:16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .match-badge { display:inline-flex; align-items:center; gap:7px; min-height:34px; padding:7px 11px; border-radius:999px; background:var(--ink); color:white; font-size:12px; font-weight:850; }
    .card-actions { margin-top:13px; display:grid; grid-template-columns:auto 1fr; gap:8px; }
    .peer-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .peer-card { padding:18px; border-radius:24px; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:center; }
    .peer-card p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .demo-chip { padding:8px 12px; border:1px solid rgba(255,255,255,.26); border-radius:999px; font-size:11px; font-weight:800; }
    .trending-card { padding:22px; border-radius:28px; background:var(--ink); color:white; }
    .trending-card .section-head { align-items:center; }
    .trend-list { display:grid; gap:5px; margin-top:14px; }
    .trend-row { position:relative; width:100%; overflow:hidden; display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border:0; border-radius:12px; background:rgba(255,255,255,.1); color:inherit; text-align:left; cursor:pointer; }
    .trend-row span { position:relative; z-index:1; font-size:13px; }
    .trend-row span:last-of-type { color:rgba(255,255,255,.72); }
    .trend-row i { position:absolute; inset:0 auto 0 0; background:rgba(242,166,186,.28); }

    /* 9. Search / profile / matches */
    .search-query-form { margin-bottom:18px; display:grid; grid-template-columns:minmax(0,1fr) auto; gap:12px; align-items:stretch; }
    .search-query-input { min-height:58px; border-radius:18px; background:rgba(255,255,255,.9); box-shadow:0 14px 36px rgba(77,28,48,.11); }
    .search-query-form .btn { min-width:132px; }
    .filter-panel { margin-bottom:22px; display:flex; align-items:end; gap:10px; }
    .filter-grid { min-width:0; flex:1; display:grid; grid-template-columns:repeat(5,minmax(140px,1fr)); gap:10px; }
    .filter-reset { flex:0 0 auto; min-height:58px; }
    .result-count { margin:20px 0 12px; font-weight:800; }
    .skill-search-results { margin:0 0 22px; padding:20px; border-radius:24px; }
    .skill-search-results h2 { margin:0 0 12px; font-size:22px; }
    .skill-result-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }

    /* 1. Constants */
    const STORAGE_KEY = "skillswap-mvp-v1";
    const STATE_VERSION = 2;
    const DEFAULT_LANGUAGE = "zh";
    const USER_TAB_HEADER = "X-SkillSwap-Tab-Id";
    const USER_TAB_STORAGE_KEY = "skillswap-user-tab-id";

    function createUserTabId() {
      if (window.crypto?.randomUUID) return window.crypto.randomUUID().replaceAll("-", "");
      const bytes = new Uint8Array(16);
      window.crypto.getRandomValues(bytes);
      return Array.from(bytes, value => value.toString(16).padStart(2, "0")).join("");
    }

    let userTabId = window.sessionStorage.getItem(USER_TAB_STORAGE_KEY) || createUserTabId();
    window.sessionStorage.setItem(USER_TAB_STORAGE_KEY, userTabId);
    const userTabNonce = createUserTabId();
    let resolveUserTabReady;
    const userTabReady = new Promise(resolve => { resolveUserTabReady = resolve; });

    if (window.BroadcastChannel) {
      let duplicateTabId = false;
      const userTabChannel = new BroadcastChannel("skillswap-user-tabs");
      userTabChannel.addEventListener("message", event => {
        const message = event.data || {};
        if (message.type === "probe" && message.tabId === userTabId && message.nonce !== userTabNonce) {
          userTabChannel.postMessage({type:"occupied",tabId:userTabId,target:message.nonce});
        } else if (message.type === "occupied" && message.tabId === userTabId && message.target === userTabNonce) {
          duplicateTabId = true;
        }
      });
      userTabChannel.postMessage({type:"probe",tabId:userTabId,nonce:userTabNonce});
      window.setTimeout(() => {
        if (duplicateTabId) {
          userTabId = createUserTabId();
          window.sessionStorage.setItem(USER_TAB_STORAGE_KEY, userTabId);
        }
        resolveUserTabReady();
      }, 60);
    } else {
      resolveUserTabReady();
    }

    async function userSessionHeaders(headers = {}) {
      await userTabReady;
      return {...headers,[USER_TAB_HEADER]:userTabId};
    }

    function pickQuestion(skillId, level, usedIds) {
      const pool = QUESTION_BANK[skillId]?.[level] || [];
      const fresh = pool.filter(item => !usedIds.includes(`${skillId}:${item.q.en}`));
      const source = fresh.length ? fresh : pool;
      const chosen = source[Math.floor(Math.random() * source.length)];
      if (!chosen) return null;
      /* ── runtime answer shuffle: randomize correct option position ── */
      const indices = [0, 1, 2, 3];
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
      }
      const shuffledOptions = indices.map(i => chosen.options[i]);
      const newAnswer = indices.indexOf(chosen.answer);
      return { q: chosen.q, options: shuffledOptions, answer: newAnswer, id: `${skillId}:${chosen.q.en}` };
    }

    async function loginWithEmail(email,password){
      let response;
      try{
        response=await fetch("/api/auth/login",{
          method:"POST",
          credentials:"same-origin",
          headers:await userSessionHeaders({"Content-Type":"application/json"}),
          body:JSON.stringify({email,password})
        });
      }catch(error){
        const unavailable=new Error("Login service unavailable"); unavailable.code="unavailable"; throw unavailable;
      }
      let payload={};
      try{payload=await response.json();}catch(error){/* A non-JSON error is treated as an unavailable backend. */}
      if(!response.ok){
        const failure=new Error(payload.message||"Login failed");
        failure.code=response.status===401?"invalid_credentials":"unavailable";
        throw failure;
      }
      if(!payload.user){const failure=new Error("Invalid login response");failure.code="unavailable";throw failure;}
      return payload.user;
    }

      let response;
      try{response=await fetch(path,{credentials:"same-origin",...options,headers:await userSessionHeaders({...(options.body?{"Content-Type":"application/json"}:{}),...(options.headers||{})})});}
      catch(error){const failure=new Error("Backend unavailable");failure.code="unavailable";throw failure;}
      let payload=null;
      if(response.status!==204){try{payload=await response.json();}catch(error){payload=null;}}
      if(!response.ok){const failure=new Error(payload?.message||"Request failed");failure.code=payload?.error||"request_failed";failure.status=response.status;throw failure;}
      return payload;

    function normalizeState(value){
      const base=createInitialState(); if(!value||typeof value!=="object")return base;
      const loggedIn=value.session?.loggedIn===true||value.isAuthenticated===true;

    function resizeAvatar(file,documentRef=document){
      return new Promise((resolve,reject)=>{
        let reader; try{reader=new FileReader();}catch(error){reject(error);return;}
        reader.onerror=()=>reject(new Error("read"));
        reader.onload=()=>{
          let image; try{image=new Image();}catch(error){reject(error);return;}
          image.onerror=()=>reject(new Error("decode"));
          image.onload=()=>{
            try{const canvas=documentRef.createElement("canvas"); canvas.width=256; canvas.height=256;
            const context=canvas.getContext("2d"); const side=Math.min(image.width,image.height); if(!context||!side)throw new Error("canvas");
            context.drawImage(image,(image.width-side)/2,(image.height-side)/2,side,side,0,0,256,256);
            resolve(canvas.toDataURL("image/jpeg",.86));}catch(error){reject(error);}
          };
          try{image.src=reader.result;}catch(error){reject(error);}
        };
        try{reader.readAsDataURL(file);}catch(error){reject(error);}
      });
    }

    function parseHash(hash = window.location.hash || "#/") {
      const raw = hash.startsWith("#") ? hash : `#${hash}`;
      const [pathPart, queryPart = ""] = raw.split("?");
      const path = pathPart || "#/";
      const query = Object.fromEntries(new URLSearchParams(queryPart).entries());
      const personMatch = path.match(/^#\/people\/([^/?#]+)$/);
      if (personMatch) {
        return {
          name: "person",
          path,
          params: { id: decodeURIComponent(personMatch[1]) },
          query,
          isKnown: true
        };
      }
      const settingsMatch = path.match(/^#\/settings\/([^/?#]+)$/);
      if (settingsMatch) return { name:"settings-section", path, params:{section:decodeURIComponent(settingsMatch[1])}, query, isKnown:true };
      const chatMatch = path.match(/^#\/chat\/([^/?#]+)$/);
      if (chatMatch) return { name:"chat-room", path, params:{userId:decodeURIComponent(chatMatch[1])}, query, isKnown:true };
      const skillTestMatch = path.match(/^#\/skill-test\/([^/?#]+)$/);
      if (skillTestMatch) return { name:"skill-test-skill", path, params:{skillId:decodeURIComponent(skillTestMatch[1])}, query, isKnown:true };
      const name = ROUTES[path] || "not-found";
      return { name, path, params: {}, query, isKnown: name !== "not-found" };
    }

    function buildHash(path, query = {}) {
      const normalized = path.startsWith("#")
        ? path
        : `#${path.startsWith("/") ? path : `/${path}`}`;
      const params = new URLSearchParams();
      Object.entries(query).forEach(([key, value]) => {
        if (value !== "" && value != null) params.set(key, String(value));
      });
      const queryString = params.toString();
      return queryString ? `${normalized}?${queryString}` : normalized;
    }

    function navigate(path, query = {}) {

    }

    function guardRoute(route, state) {
      const publicRoutes = new Set(["landing", "login", "signup"]);
      const onboardingRoutes = new Set([
        "onboarding-profile", "onboarding-share", "onboarding-learn", "onboarding-complete"
      ]);
      const appRoutes = new Set(["discover", "search", "matches", "chat", "chat-room", "skill-test", "skill-test-skill", "settings", "settings-section", "legacy-profile", "person"]);

      if (publicRoutes.has(route.name)) {
        if (state.isAuthenticated && state.onboardingCompleted && ["login", "signup"].includes(route.name)) {
          return "#/discover";
        }
        return null;
      }
      if (onboardingRoutes.has(route.name)) {
        if (!state.isAuthenticated) return "#/signup";
        if (state.onboardingCompleted) return "#/discover";
        return null;
      }
      if (appRoutes.has(route.name)) {
        if (!state.isAuthenticated) return "#/login";
        if (!state.onboardingCompleted) {
          const step = ["profile", "share", "learn"].includes(state.onboardingStep)
            ? state.onboardingStep
            : "profile";
          return `#/onboarding/${step}`;
        }
      }
      return null;
    }

    function useHashRoute() {
      const [route, setRoute] = React.useState(() => parseHash());
      React.useEffect(() => {
        const handleChange = () => setRoute(parseHash());
        window.addEventListener("hashchange", handleChange);
        return () => window.removeEventListener("hashchange", handleChange);
      }, []);
      return route;
    }

    /* 6. Matching logic */
    function getSkillById(skillId) {
      return SKILLS.find(skill => skill.id === skillId) || null;
    }

    function getUserById(userId, currentUser = null) {
      if (currentUser?.id === userId) return currentUser;
      if (BACKEND_USERS.has(String(userId))) return BACKEND_USERS.get(String(userId));
      return null;
    }

    function getSkillName(skillId, language = DEFAULT_LANGUAGE) {
      const skill = getSkillById(skillId);
      return skill ? (skill[language] || skill.en) : skillId;
    }

    function getInitials(name = "") {
      return name.trim().split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join("").toUpperCase();
    }

    function getLevelRank(level) {
      const rank = SKILL_LEVELS.indexOf(level);
      return rank < 0 ? 0 : rank;
    }

    function scoreComplementaryMatch(currentUser, candidate) {
      const teachable = candidate.skillsOffered.filter(offered =>
        currentUser.skillsWanted.some(wanted => wanted.skillId === offered.skillId)
      );
      if (!teachable.length) {
        return { user: candidate, score: 0, reciprocal: false, reasons: [] };
      }

      const reciprocalPairs = [];
      candidate.skillsWanted.forEach(wanted => {
        const offered = currentUser.skillsOffered.find(item => item.skillId === wanted.skillId);
        if (offered) reciprocalPairs.push({ offered, wanted });
      });
      const reciprocal = reciprocalPairs.length > 0;
      const sharedLanguage = candidate.languages.some(language => currentUser.languages.includes(language));
      const sameCity = Boolean(candidate.cityId&&candidate.cityId===currentUser.cityId&&candidate.countryId===currentUser.countryId);
      const levelFit = teachable.some(offered => {
        const wanted = currentUser.skillsWanted.find(item => item.skillId === offered.skillId);
        return wanted && getLevelRank(offered.level) >= getLevelRank(wanted.level);
      });
      const categoryFit = teachable.some(offered => {
        const skill = getSkillById(offered.skillId);
        return skill && currentUser.skillsOffered.some(item => getSkillById(item.skillId)?.category === skill.category);
      });

      const reasons = teachable.map(offered => ({ type: "can-teach", skillId: offered.skillId }));
      reciprocalPairs.forEach(pair => reasons.push({
        type: "reciprocal",
        skillId: pair.wanted.skillId,
        reciprocalSkillId: teachable[0].skillId
      }));

      const score = Math.min(99,
        55 +
        (reciprocal ? 25 : 0) +
        (sharedLanguage ? 7 : 0) +
        (levelFit ? 7 : 0) +
        (sameCity ? 4 : 0) +
        (categoryFit ? 1 : 0)
      );
      return { user: candidate, score, reciprocal, reasons };
    }

    function findComplementaryMatches(currentUser, users = []) {
      return users
        .map(user => scoreComplementaryMatch(currentUser, user))
        .filter(match => match.score > 0)
        .sort((a, b) => b.score - a.score || a.user.id.localeCompare(b.user.id));
    }

    function findPeerBuddies(currentUser, users = []) {
      const currentSkills = [...currentUser.skillsOffered, ...currentUser.skillsWanted];
      return users
        .map(user => {
          const shared = [...user.skillsOffered, ...user.skillsWanted].filter(candidateSkill =>
            currentSkills.some(currentSkill =>
              currentSkill.skillId === candidateSkill.skillId && currentSkill.level === candidateSkill.level
            )
          );
          const sharedLanguage = user.languages.some(language => currentUser.languages.includes(language));
          return {
            user,
            score: shared.length && sharedLanguage ? 80 : 0,
            sharedSkillIds: [...new Set(shared.map(item => item.skillId))]
          };
        })
        .filter(match => match.score > 0)
        .sort((a, b) => b.score - a.score || a.user.id.localeCompare(b.user.id));
    }

    function locationLabel(user, language) {
      const country=getCountryById(user?.countryId);
      const city=country?.cities.find(item=>item.id===user?.cityId);
      return [country?.[language],city?.[language]].filter(Boolean).join(" · ");
    }

    function sortUsers(users, sort="newest") {
      return [...users].sort((a,b) => sort==="liked"
        ? (b.likes-a.likes)||Date.parse(b.publishedAt)-Date.parse(a.publishedAt)||a.id.localeCompare(b.id)
        : Date.parse(b.publishedAt)-Date.parse(a.publishedAt)||a.id.localeCompare(b.id));
    }

    function formatPublishedAt(iso, language, now=new Date("2026-08-16T12:00:00.000Z")) {
      const days=Math.max(0,Math.floor((now-Date.parse(iso))/86400000));
      if(days===0)return language==="zh"?"今天":"Today";
      if(days<7)return language==="zh"?`${days} 天前`:`${days} days ago`;
      return new Intl.DateTimeFormat(language==="zh"?"zh-CN":"en-US",{year:"numeric",month:"short",day:"numeric"}).format(new Date(iso));
    }

    function hasActiveSearchFilters(filters={}) {
      return [filters.q,filters.level,filters.country,filters.city,filters.lang].some(value=>String(value||"").trim());
    }

    function normalizeSearchFilters(query={}) {
      const country=getCountryById(query.country)?.id || "";
      const requestedCity=country ? String(query.city||"") : "";
      const city=getCitiesForCountry(country).some(item=>item.id===requestedCity) ? requestedCity : "";
      const level=SKILL_LEVELS.includes(query.level) ? query.level : "";
      const lang=["zh","en"].includes(query.lang) ? query.lang : "";
      return {q:query.q||"",level,country,city,lang,sort:["newest","liked"].includes(query.sort)?query.sort:"newest"};
    }

    function updateSearchFilter(filters,key,value){
      return key==="country" ? {...filters,country:value,city:""} : {...filters,[key]:value};
    }

    function rememberSearch(list,value){
      const clean=String(value||"").trim();
      if(!clean)return list.slice(0,5);
      return [clean,...list.filter(item=>item.toLocaleLowerCase()!==clean.toLocaleLowerCase())].slice(0,5);
    }

    function relationshipSummary(currentUser,user,language){
      const match=scoreComplementaryMatch(currentUser,user);
      if(match.reciprocal)return {type:"reciprocal",label:`${t(language,"twoWay")} · ${match.score}%`};
      const offered=user.skillsOffered.find(item=>currentUser.skillsWanted.some(wanted=>wanted.skillId===item.skillId));
      if(offered)return {type:"teaches",label:t(language,"canTeachSkill",{skill:getSkillName(offered.skillId,language)})};
      return {type:"filtered",label:t(language,"matchesFilters")};
    }

    function uniqueUsers(users){return [...new Map(users.filter(Boolean).map(user=>[user.id,user])).values()];}
    const MATCH_TAB_IDS=Object.freeze(["complementary","favorites","requests"]);
    function normalizeMatchTab(value){return MATCH_TAB_IDS.includes(value)?value:"complementary";}
    function buildMatchGroups(state,users=[]){
      const selfId=state.currentUser?.id;
      return {
        complementary:uniqueUsers(findComplementaryMatches(state.currentUser,users).map(match=>match.user)).filter(user=>user.id!==selfId),
        favorites:uniqueUsers(state.favorites.map(id=>getUserById(id,state.currentUser))).filter(user=>user.id!==selfId)
      };
    }

    function filterUsers(users, filters = {}, language = DEFAULT_LANGUAGE) {
      const query = (filters.q || "").trim().toLocaleLowerCase();
      const matchingSkillIds = query ? SKILLS.filter(skill =>
        [skill.id, skill.zh, skill.en].some(value => value.toLocaleLowerCase().includes(query))
      ).map(skill => skill.id) : [];
      return users.filter(user => {
        const searchableSkills = user.skillsOffered
          .flatMap(item => {
            const skill = getSkillById(item.skillId);
            return skill ? [skill.id, skill.zh, skill.en] : [item.skillId];
          });
        const haystack = [
          user.name,
          user.city,
          locationLabel(user,language),
          user.bio?.[language],
          user.bio?.zh,
          user.bio?.en,
          ...(user.interests||[]).map(interest=>profileLabel("interests",interest,language)),
          ...searchableSkills
        ].filter(Boolean).join(" ").toLocaleLowerCase();
        const allSkills = [...user.skillsOffered, ...user.skillsWanted];
        const queryMatches = !query || (matchingSkillIds.length
          ? user.skillsOffered.some(item => matchingSkillIds.includes(item.skillId))
          : haystack.includes(query));
        const levelMatches = !filters.level || allSkills.some(item => item.level === filters.level);
        const countryMatches = !filters.country || user.countryId === filters.country;
        const cityMatches = !filters.city || user.cityId === filters.city;
        const languageMatches = !filters.lang || user.languages.includes(filters.lang);
        return queryMatches && levelMatches && countryMatches && cityMatches && languageMatches;
      });
    }

    /* 7. Utilities */
    function validateSignup(email, password, confirmation) {
      const errors = [];
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email || "")) errors.push("email");
      if ((password || "").length < 8) errors.push("password");
      if (password !== confirmation) errors.push("confirmation");
      return errors;
    }

    function validateProfile(profile) {
      const errors = [];
      if (!(profile?.name || "").trim()) errors.push("name");
      if (!(profile?.city || "").trim()) errors.push("city");
      return errors;
    }

    function validateSkillList(items) {
      const errors = [];
      if (!Array.isArray(items) || items.length === 0) return ["required"];
      const ids = items.map(item => item?.skillId).filter(Boolean);
      if (ids.length !== items.length) errors.push("skill");
      if (new Set(ids).size !== ids.length) errors.push("duplicate");
      return errors;
    }

    function SelectMenu({label,value,options,onChange,placeholder,disabled=false,searchable=false,searchPlaceholder,noOptionsLabel,align="start"}){
      const listId=React.useId();
      const rootRef=React.useRef(null); const triggerRef=React.useRef(null); const searchRef=React.useRef(null); const optionRefs=React.useRef([]);
      const [open,setOpen]=React.useState(false); const [query,setQuery]=React.useState(""); const [activeIndex,setActiveIndex]=React.useState(0);
      const selected=options.find(option=>option.value===value);
      const normalizedQuery=query.trim().toLocaleLowerCase();
      const visibleOptions=normalizedQuery?options.filter(option=>option.label.toLocaleLowerCase().includes(normalizedQuery)):options;
      const focusOption=index=>requestAnimationFrame(()=>optionRefs.current[index]?.focus());
      const openMenu=direction=>{
        if(disabled)return;
        setQuery("");
        const selectedIndex=options.findIndex(option=>option.value===value);
        setActiveIndex(direction<0?Math.max(0,options.length-1):Math.max(0,selectedIndex));
        setOpen(true);
      };
      const closeMenu=(restore=true)=>{setOpen(false);setQuery("");if(restore)requestAnimationFrame(()=>triggerRef.current?.focus());};
      const choose=option=>{onChange(option.value);closeMenu();};
      const move=(index,delta)=>{const next=(index+delta+visibleOptions.length)%visibleOptions.length;setActiveIndex(next);focusOption(next);};
      const optionKey=(event,index,option)=>{
        if(event.key==="ArrowDown"&&visibleOptions.length){event.preventDefault();move(index,1);}
        else if(event.key==="ArrowUp"&&visibleOptions.length){event.preventDefault();move(index,-1);}
        else if(event.key==="Home"&&visibleOptions.length){event.preventDefault();setActiveIndex(0);focusOption(0);}
        else if(event.key==="End"&&visibleOptions.length){event.preventDefault();const last=visibleOptions.length-1;setActiveIndex(last);focusOption(last);}
        else if(event.key==="Enter"||event.key===" "){event.preventDefault();choose(option);}
        else if(event.key==="Escape"){event.preventDefault();closeMenu();}
        else if(event.key==="Tab"){setOpen(false);setQuery("");}
      };
      React.useEffect(()=>{
        if(!open)return;
        const handlePointer=event=>{if(!rootRef.current?.contains(event.target))closeMenu(false);};
        document.addEventListener("pointerdown",handlePointer);
        return ()=>document.removeEventListener("pointerdown",handlePointer);
      },[open]);
      React.useEffect(()=>{
        if(!open)return;
        const timer=setTimeout(()=>searchable?searchRef.current?.focus():focusOption(activeIndex),0);
        return ()=>clearTimeout(timer);
      },[open,searchable]);
      React.useEffect(()=>{if(open&&activeIndex>=visibleOptions.length)setActiveIndex(0);},[query,open,visibleOptions.length,activeIndex]);
      return <div className={`select-menu ${align==="end"?"align-end":""}`} ref={rootRef}>
        <button ref={triggerRef} type="button" className="select-trigger" disabled={disabled} aria-haspopup="listbox" aria-expanded={open} aria-controls={open?listId:undefined} aria-label={`${label}: ${selected?.label||placeholder}`} onClick={()=>open?closeMenu(false):openMenu(1)} onKeyDown={event=>{
          if(event.key==="ArrowDown"||event.key==="ArrowUp"){event.preventDefault();openMenu(event.key==="ArrowUp"?-1:1);}
          else if(event.key==="Home"||event.key==="End"){event.preventDefault();openMenu(event.key==="End"?-1:1);}
        }}>
          <span className="select-trigger-copy"><span className="select-trigger-label">{label}</span><span className="select-trigger-value">{selected?.label||placeholder}</span></span><span className="select-chevron" aria-hidden="true">⌄</span>
        </button>
        {open&&<div className="select-popover">
          {searchable&&<input ref={searchRef} className="input select-search" value={query} onChange={event=>{setQuery(event.target.value);setActiveIndex(0);}} onKeyDown={event=>{
            if(event.key==="ArrowDown"&&visibleOptions.length){event.preventDefault();setActiveIndex(0);focusOption(0);}
            else if(event.key==="Escape"){event.preventDefault();closeMenu();}
          }} placeholder={searchPlaceholder} aria-label={searchPlaceholder}/>}
          <div id={listId} className="select-options" role="listbox" aria-label={label}>{visibleOptions.length?visibleOptions.map((option,index)=><button ref={node=>optionRefs.current[index]=node} type="button" role="option" className="select-option" aria-selected={option.value===value} tabIndex="-1" key={option.value||"all"} onClick={()=>choose(option)} onKeyDown={event=>optionKey(event,index,option)}><span>{option.label}</span><span aria-hidden="true">{option.value===value?"✓":""}</span></button>):<p className="select-empty">{noOptionsLabel}</p>}</div>
        </div>}
      </div>;
    }

    function AvatarPicker({user,language,onSave}){

    function Modal({ title, children, onClose, language=DEFAULT_LANGUAGE }) {
      const dialogRef = React.useRef(null);
      const previousFocus = React.useRef(document.activeElement);
      React.useEffect(() => {
        const dialog = dialogRef.current;
        dialog?.focus();
        const handleKey = event => {
          if (event.key === "Escape") onClose();
          if (event.key === "Tab" && dialog) {
            const focusable = [...dialog.querySelectorAll("button,input,select,textarea,[tabindex]:not([tabindex='-1'])")].filter(item=>!item.disabled);
            if (!focusable.length) return;
            const first = focusable[0], last = focusable[focusable.length-1];
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
          }
        };
        document.addEventListener("keydown",handleKey);
        return () => { document.removeEventListener("keydown",handleKey); previousFocus.current?.focus?.(); };
      }, [onClose]);
      return <div className="modal-backdrop" onMouseDown={event=>{if(event.target===event.currentTarget)onClose();}}><section className="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabIndex="-1" ref={dialogRef}><div className="modal-head"><h2 id="modal-title">{title}</h2><button type="button" className="icon-btn" onClick={onClose} aria-label={t(language,"closeDialog")}>×</button></div>{children}</section></div>;

    function formatRequestTime(iso,language,now=new Date()){
      const value=new Date(iso);if(Number.isNaN(value.getTime()))return "—";const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());const yesterday=new Date(today);yesterday.setDate(today.getDate()-1);const clock=new Intl.DateTimeFormat(language==="zh"?"zh-CN":"en-US",{hour:"2-digit",minute:"2-digit",hour12:false}).format(value);
      if(value>=today)return clock;if(value>=yesterday)return language==="zh"?`昨天 ${clock}`:`Yesterday ${clock}`;return new Intl.DateTimeFormat(language==="zh"?"zh-CN":"en-US",{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}).format(value);

    const SCHEDULE_HOURS=Object.freeze(Array.from({length:14},(_,index)=>index+8));
    function scheduleDateId(date){const year=date.getFullYear();const month=String(date.getMonth()+1).padStart(2,"0");const day=String(date.getDate()).padStart(2,"0");return `${year}-${month}-${day}`;}

    function AvailabilitySettings({state,language,updateState,back,onSaved}){

    /* 14. Chat feature */
    const EMOJI_SET = Object.freeze(["😀","😂","😊","😍","🤔","👍","👏","🙏","💪","🎉","❤️","✨","🔥","✅","🤝","📚","🎵","📸","💻","🎨","🍳","🏸","⭐","🥳","😅","🤗","👀","💯","🎯","☕"]);
    function mergeChatMessages(current=[],incoming=[]) {
      const byId=new Map(current.map(message=>[String(message.id),message]));
      incoming.forEach(message=>{if(message&&message.id!==undefined)byId.set(String(message.id),message);});
      return [...byId.values()].sort((a,b)=>Number(a.id)-Number(b.id));
    }
    function createClientMessageId(){return window.crypto?.randomUUID?.()||`msg_${Date.now()}_${Math.random().toString(36).slice(2,14)}`;}
    function formatChatTime(iso, language) {
      if (!iso) return "";
      const date = new Date(iso);
      const now = new Date();
      const sameDay = date.toDateString() === now.toDateString();
      const time = date.toLocaleTimeString(language === "zh" ? "zh-CN" : "en-US", { hour: "2-digit", minute: "2-digit" });
      return sameDay ? time : date.toLocaleDateString(language === "zh" ? "zh-CN" : "en-US", { month: "short", day: "numeric" });
    }
    function chatConnectionText(status,language){

      if(status==="auth-error")return language==="zh"?"登录会话已失效，请重新登录":"Your session expired. Please sign in again.";

      const [error,setError]=React.useState("");

      const pendingIdRef=React.useRef("");

        const clientMessageId=pendingIdRef.current||createClientMessageId();pendingIdRef.current=clientMessageId;
        try{await onSend(peerId,trimmed,clientMessageId);setText("");setShowEmoji(false);pendingIdRef.current="";}

        finally{setBusy(false);}
      };

        {toast&&<p className="notice" role="status" style={{marginTop:10}}>{t(language,"comingSoon")}: {toast}</p>}
        {error&&<p className="form-error" role="alert" style={{marginTop:10}}>{error}</p>}
        {showEmoji&&<div className="emoji-picker">{EMOJI_SET.map(emoji=><button type="button" className="emoji-btn" key={emoji} onClick={()=>setText(current=>current+emoji)}>{emoji}</button>)}</div>}
        <div className="chat-input-area glass">
          <button type="button" className="chat-action-btn" aria-label={t(language,"videoCall")} title={t(language,"videoCall")} onClick={()=>showToast(t(language,"videoCall"))}>📹</button>
          <button type="button" className="chat-action-btn" aria-label={t(language,"takePhoto")} title={t(language,"takePhoto")} onClick={()=>showToast(t(language,"takePhoto"))}>📷</button>
          <button type="button" className="chat-action-btn" aria-label={t(language,"sendImage")} title={t(language,"sendImage")} onClick={()=>showToast(t(language,"sendImage"))}>🖼️</button>
          <button type="button" className="chat-action-btn" aria-label={t(language,"emoji")} title={t(language,"emoji")} onClick={()=>setShowEmoji(current=>!current)}>😊</button>
          <input className="chat-text-input" maxLength="2000" value={text} placeholder={t(language,"chatPlaceholder")} onChange={event=>{setText(event.target.value);pendingIdRef.current="";setError("");}} onKeyDown={event=>{if(event.key==="Enter"){event.preventDefault();void send();}}} aria-label={t(language,"chatPlaceholder")}/>
          <button type="button" className="chat-send-btn" onClick={()=>void send()} disabled={!text.trim()||busy} aria-label={t(language,"sendMessage")}>{busy?"…":"➤"}</button>

    const TEST_QUESTION_COUNT = 10;
    function SkillTestSelectPage({ state, language }) {
      const testableSkills = [...new Set([...state.currentUser.skillsOffered.map(item=>item.skillId), ...state.currentUser.skillsWanted.map(item=>item.skillId)])].filter(id => SKILL_TEST_COVERED.includes(id));

    function SkillTestRunPage({ route, state, language, updateState }) {
      const skillId = route.params.skillId;
      const [history, setHistory] = React.useState([]);
      const [levelIndex, setLevelIndex] = React.useState(1);
      const [current, setCurrent] = React.useState(null);
      const [selected, setSelected] = React.useState(null);
      const [phase, setPhase] = React.useState("quiz");
      const usedRef = React.useRef([]);
      const askedRef = React.useRef(0);
      const startLevel = state.currentUser.skillsOffered.find(item=>item.skillId===skillId)?.level || "beginner";
      const startLevelIndex = React.useMemo(()=>Math.max(0, SKILL_LEVELS.indexOf(startLevel) - 1), []);

      const loadQuestion = nextIndex => {
        const question = pickQuestion(skillId, SKILL_LEVELS[nextIndex], usedRef.current);
        if (question) usedRef.current = [...usedRef.current, question.id];
        setCurrent(question);
        setSelected(null);
      };
      React.useEffect(()=>{ setLevelIndex(startLevelIndex); loadQuestion(startLevelIndex); }, [skillId]);

      if (!SKILL_TEST_COVERED.includes(skillId)) return <main className="page"><div className="test-container"><EmptyState title={t(language,"selectSkillToTest")} body={t(language,"skillTestSelectSkill")} actionLabel={t(language,"skillTestBack")} onAction={()=>navigate("#/skill-test")}/></div></main>;

      const answered = history.length;
      const choose = optionIndex => {
        if (selected !== null || !current) return;
        const isCorrect = optionIndex === current.answer;
        setSelected(optionIndex);
        setHistory(historyItems => [...historyItems, { correct: isCorrect, level: SKILL_LEVELS[levelIndex] }]);
        askedRef.current += 1;
      };
      const next = () => {
        if (askedRef.current >= TEST_QUESTION_COUNT) {
          const correctCount = history.filter(item=>item.correct).length;
          const finalIndex = correctCount === 0 ? 0 : Math.max(...history.filter(item=>item.correct).map(item=>SKILL_LEVELS.indexOf(item.level)));
          const assessment = { level: SKILL_LEVELS[finalIndex], score: Math.round(correctCount/TEST_QUESTION_COUNT*100), testedAt: new Date().toISOString(), questionCount: TEST_QUESTION_COUNT };
          updateState(currentState => ({ ...currentState, skillAssessments: { ...(currentState.skillAssessments||{}), [skillId]: assessment } }));
          setPhase("result");
          return;
        }
        const lastCorrect = history[history.length-1]?.correct;
        const nextIndex = lastCorrect ? Math.min(levelIndex+1, SKILL_LEVELS.length-1) : Math.max(levelIndex-1, 0);
        setLevelIndex(nextIndex);
        loadQuestion(nextIndex);
      };

      if (phase === "result") {
        const correctCount = history.filter(item=>item.correct).length;
        const finalIndex = correctCount === 0 ? 0 : Math.max(...history.filter(item=>item.correct).map(item=>SKILL_LEVELS.indexOf(item.level)));
        return <main className="page"><div className="test-container"><section className="test-result glass"><span className="test-result-badge">✓ {getSkillName(skillId,language)} · {levelLabel(SKILL_LEVELS[finalIndex],language)}</span><h2>{t(language,"skillTestResult")}</h2><p>{t(language,"skillTestResultScore",{score:Math.round(correctCount/TEST_QUESTION_COUNT*100)})}</p><p>{t(language,"skillTestResultDesc")}</p><div className="button-row" style={{justifyContent:"center"}}><Button onClick={()=>{setHistory([]);usedRef.current=[];askedRef.current=0;setPhase("quiz");setLevelIndex(startLevelIndex);loadQuestion(startLevelIndex);}}>{t(language,"skillTestRetake")}</Button><Button variant="light" onClick={()=>{navigate("#/skill-test");}}>{t(language,"skillTestBack")}</Button></div></section></div></main>;
      }

      return <main className="page"><div className="test-container"><div className="button-row" style={{marginBottom:14}}><Button variant="light" small onClick={()=>navigate("#/skill-test")}>← {t(language,"skillTestBack")}</Button></div>
        <div className="test-progress-bar" aria-label={`${answered}/${TEST_QUESTION_COUNT}`}><div className="test-progress-fill" style={{width:`${answered/TEST_QUESTION_COUNT*100}%`}}/></div>
        {current ? <section className="test-question-card glass"><p className="test-question-meta">{t(language,"skillTestQuestion",{current:answered+1,total:TEST_QUESTION_COUNT})} · {t(language,"skillTestLevel",{level:levelLabel(SKILL_LEVELS[levelIndex],language)})} · {getSkillName(skillId,language)}</p><h2>{localized(current.q,language)}</h2><div className="test-options">{current.options.map((option,index)=><button type="button" key={index} className={`test-option ${selected===null?"":index===current.answer?"correct":selected===index?"wrong":""}`} onClick={()=>choose(index)} disabled={selected!==null}>{localized(option,language)}</button>)}</div>{selected!==null&&<div className="button-row" style={{marginTop:20}}><Button onClick={next}>{answered+1>=TEST_QUESTION_COUNT?t(language,"skillTestSubmit"):t(language,"skillTestNext")}</Button></div>}</section> : <section className="test-question-card glass"><p>{t(language,"selectSkillToTest")}</p></section>}
      </div></main>;
    }

    /* 16. ErrorBoundary */
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error("SkillSwap render error", error, info); }
      render() {
        return this.state.error
          ? <RecoveryScreen onReload={() => window.location.reload()} onReset={resetDemo} />
          : this.props.children;
      }
    }

      const refreshChatConversations=React.useCallback(async()=>{const payload=await loadChatConversations();const conversations=(payload.conversations||[]).map(item=>{const peer=normalizeUser(item.peer);BACKEND_USERS.set(String(peer.id),peer);return {...item,peer};});setChatConversations(conversations);return conversations;},[]);
      const applyChatMessages=React.useCallback(messages=>{if(!messages?.length||!state.currentUser?.id)return;const currentUserId=String(state.currentUser.id);setChatMessagesByPeer(current=>{const next={...current};messages.forEach(message=>{const peerId=String(message.senderId)===currentUserId?String(message.recipientId):String(message.senderId);next[peerId]=mergeChatMessages(next[peerId]||[],[message]);});return next;});setChatConversations(current=>{const next=current.map(item=>({...item}));messages.forEach(message=>{const peerId=String(message.senderId)===currentUserId?String(message.recipientId):String(message.senderId);const index=next.findIndex(item=>String(item.peer?.id)===peerId);if(index>=0&&(!next[index].lastMessage||Number(message.id)>=Number(next[index].lastMessage.id)))next[index]={...next[index],lastMessage:message};});return next.sort((a,b)=>Number(b.lastMessage?.id||0)-Number(a.lastMessage?.id||0));});},[state.currentUser?.id]);
      const loadChatHistory=React.useCallback(async(peerId,beforeId=null)=>{setChatHistoryMeta(current=>({...current,[peerId]:{...(current[peerId]||{}),loading:true}}));try{const payload=await loadChatMessages(peerId,beforeId,50);if(payload.peer){const peer=normalizeUser(payload.peer);BACKEND_USERS.set(String(peer.id),peer);setChatConversations(current=>current.some(item=>String(item.peer?.id)===String(peerId))?current:[...current,{peer,lastMessage:null}]);}setChatMessagesByPeer(current=>({...current,[peerId]:mergeChatMessages(current[peerId]||[],payload.messages||[])}));setChatHistoryMeta(current=>({...current,[peerId]:{loading:false,hasMore:Boolean(payload.hasMore),nextBeforeId:payload.nextBeforeId||null}}));return payload;}catch(error){setChatHistoryMeta(current=>({...current,[peerId]:{...(current[peerId]||{}),loading:false}}));throw error;}},[]);
      const sendChat=React.useCallback(async(peerId,text,clientMessageId)=>{const payload=await sendBackendChatMessage(peerId,text,clientMessageId);applyChatMessages([payload.message]);return payload.message;},[applyChatMessages]);

      React.useEffect(()=>{if(state.isAuthenticated&&state.onboardingCompleted&&state.session?.mode==="backend"){void refreshCommunityUsers().catch(()=>{});void refreshSwapRequests().catch(()=>{});}else{BACKEND_USERS.clear();setCommunityUsers([]);setSwapRequests({received:[],sent:[]});setDirectoryStatus("idle");setRequestsStatus("idle");}},[state.isAuthenticated,state.onboardingCompleted,state.currentUser?.id,refreshCommunityUsers,refreshSwapRequests]);

      React.useEffect(()=>{if(state.isAuthenticated&&state.onboardingCompleted&&state.session?.mode==="backend")void refreshChatConversations().then(()=>setChatStatus("ready")).catch(error=>setChatStatus(error.status===404?"unsupported":error.status===401?"auth-error":"reconnecting"));},[state.connections.join("|"),state.isAuthenticated,state.onboardingCompleted,refreshChatConversations]);

        if(!state.isAuthenticated||!state.onboardingCompleted||state.session?.mode!=="backend"){setChatConversations([]);setChatMessagesByPeer({});setChatHistoryMeta({});setChatStatus("idle");chatCursorRef.current=0;return;}
        let stopped=false;const controller=new AbortController();chatCursorRef.current=0;
        const run=async()=>{setChatStatus("loading");try{await refreshChatConversations();setChatStatus("ready");}catch(error){if(stopped)return;if(error.status===404){setChatStatus("unsupported");return;}if(error.status===401){setChatStatus("auth-error");return;}setChatStatus("reconnecting");}
          while(!stopped){try{const payload=await pollChatEvents(chatCursorRef.current,controller.signal);if(stopped)return;chatCursorRef.current=Math.max(chatCursorRef.current,Number(payload.cursor||0));applyChatMessages(payload.messages||[]);setChatStatus("ready");}catch(error){if(stopped||controller.signal.aborted)return;if(error.status===404){setChatStatus("unsupported");return;}if(error.status===401){setChatStatus("auth-error");return;}setChatStatus("reconnecting");await new Promise(resolve=>window.setTimeout(resolve,1500));}}
        };void run();return()=>{stopped=true;controller.abort();};
      },[state.isAuthenticated,state.onboardingCompleted,state.currentUser?.id,refreshChatConversations,applyChatMessages]);

      React.useEffect(() => {
        saveState(state);
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
      }, [state, language]);

      React.useEffect(() => {
        if (route.name === "legacy-profile") { window.location.hash = "#/settings"; return; }
        const redirect = guardRoute(route, state);
        if (redirect && window.location.hash !== redirect) window.location.hash = redirect;
      }, [route, state]);

      React.useEffect(() => { window.scrollTo({ top: 0, left: 0 }); }, [route.path]);

      const redirect = guardRoute(route, state);
      if (redirect) return null;

      const toggleLanguage = () => setState(current => ({ ...current, language: current.language === "zh" ? "en" : "zh" }));
      const emailLogin = async (email,password) => { const account=await loginWithEmail(email,password);const backendUser=await loadBackendUser();setState(current=>normalizeState({...current,isAuthenticated:true,currentUser:backendUser,onboardingCompleted:backendUser.onboardingCompleted,onboardingStep:backendUser.onboardingCompleted?"complete":"profile",privacySettings:{...current.privacySettings,profileVisibility:backendUser.profileVisibility||"community"},session:{loggedIn:true,mode:"backend"}}));navigate(backendUser.onboardingCompleted?"#/discover":"#/onboarding/profile");return account; };
      const signup = async (email,password) => {
        const account=await registerWithEmail(email,password);await loadSkillCatalog();
        const newUser = {
          id: account.id, email:account.email, isAdmin:false, name: "", age: 18, city: "", countryId:"cn",cityId:"tianjin",languages: ["zh"], avatar: "",
          bio: { zh: "", en: "" }, skillsOffered: [], skillsWanted: [],onboardingCompleted:false
        };
        setState(current => normalizeState({ ...current, isAuthenticated: true, currentUser: newUser, onboardingCompleted: false, onboardingStep: "profile",session:{loggedIn:true,mode:"backend"} }));
        navigate("#/onboarding/profile");
        return account;
      };

      if (route.name === "landing") return <LandingPage language={language} onLanguage={toggleLanguage}/>;

      let page;
      if (route.name === "login") page = <LoginPage language={language} onLogin={emailLogin}/>;
      else if (route.name === "signup") page = <SignupPage language={language} onSignup={signup}/>;
      else if (route.name === "onboarding-profile") page = <ProfileOnboardingPage state={state} language={language} updateState={updateState}/>;
      else if (route.name === "onboarding-share") page = <SkillOnboardingPage key="share-skills" state={state} language={language} updateState={updateState}/>;
      else if (route.name === "onboarding-learn") page = <SkillOnboardingPage key="learn-skills" state={state} language={language} updateState={updateState} wanted/>;
      else if (route.name === "onboarding-complete") page = <OnboardingCompletePage state={state} language={language} updateState={updateState}/>;
      else if (route.name === "discover") page = <DiscoverPage state={state} language={language} updateState={updateState} communityUsers={communityUsers} directoryStatus={directoryStatus}/>;
      else if (route.name === "search") page = <SearchPage route={route} state={state} language={language} updateState={updateState}/>;
      else if (route.name === "matches") page = <MatchesPage route={route} state={state} language={language} updateState={updateState} communityUsers={communityUsers} swapRequests={swapRequests} requestsStatus={requestsStatus} refreshSwapRequests={refreshSwapRequests}/>;
      else if (route.name === "chat") page = <ChatListPage language={language} conversations={chatConversations} chatStatus={chatStatus}/>;
      else if (route.name === "chat-room") page = <ChatRoomPage route={route} state={state} language={language} conversations={chatConversations} messagesByPeer={chatMessagesByPeer} historyMeta={chatHistoryMeta} chatStatus={chatStatus} onLoadHistory={loadChatHistory} onSend={sendChat}/>;
      else if (route.name === "skill-test") page = <SkillTestSelectPage state={state} language={language}/>;
      else if (route.name === "skill-test-skill") page = <SkillTestRunPage route={route} state={state} language={language} updateState={updateState}/>;
      else if (route.name === "settings") page = <SettingsHome route={route} state={state} language={language} updateState={updateState}/>;
      else if (route.name === "settings-section") page = <SettingsSectionPage route={route} state={state} language={language} updateState={updateState}/>;
      else if (route.name === "person") page = <PersonProfilePage route={route} state={state} language={language} updateState={updateState} refreshSwapRequests={refreshSwapRequests}/>;
      else page = <NotFoundPage language={language}/>;

      const publicOrOnboarding = ["login","signup"].includes(route.name) || route.name.startsWith("onboarding-");
      return <AppShell language={language} routeName={route.name} onLanguage={toggleLanguage} showNavigation={state.isAuthenticated && state.onboardingCompleted && !publicOrOnboarding}>{page}</AppShell>;
    }

    /* 13. React createRoot entry point */
    if (window.React && window.ReactDOM && window.Babel) {
      ReactDOM.createRoot(document.getElementById("root")).render(
        <ErrorBoundary>{SELF_TEST_MODE ? <SelfTestReport /> : <App />}</ErrorBoundary>
      );
    }
  </script>
</body>
</html>
