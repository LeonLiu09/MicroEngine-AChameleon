<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e89bb1">
  <meta name="description" content="SkillSwap — 学你所爱，分享你所会。">
  <title>SkillSwap</title>
  <style>
    /* 1. Design tokens */
    :root {
      --ink: #181818; --paper: #fff9fa; --deep-rose: #b85f7d; --rose: #d97091;
      --soft-rose: #eba0b5; --blush: #f7dce3; --glass: rgba(255,255,255,.58);
      --line: rgba(255,255,255,.66); --muted: rgba(24,24,24,.64); --focus: #6f2243;
      --danger: #7e1838; --success: #17633c; --shadow: 0 26px 80px rgba(77,28,48,.16);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* 2. Reset / base */
    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: light; scroll-behavior: smooth; }
    body {
      margin: 0; min-width: 320px; min-height: 100vh; overflow-x: hidden; color: var(--ink); font-family: var(--font);
      background:
        radial-gradient(circle at 8% 12%, rgba(255,249,250,.76), transparent 22%),
        radial-gradient(circle at 88% 18%, rgba(255,255,255,.48), transparent 28%),
        linear-gradient(145deg, #b75f7d 0%, #e99bb1 42%, #f5cbd5 72%, #d67e9a 100%);
      background-attachment: fixed;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .17;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    h1, h2, h3, p { margin-top: 0; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--focus); outline-offset: 3px;
    }
    #root { min-height: 100vh; position: relative; isolation: isolate; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* 3. Failure-safe / generic */
    .static-fallback, .boot-shell, .recovery, .self-tests { width: min(680px, calc(100% - 32px)); margin: 0 auto; padding: 15vh 28px 36px; }
    .fallback-kicker, .eyebrow { margin: 0 0 12px; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .static-fallback h1, .boot-shell h1, .recovery h1 { margin: 0 0 16px; font-size: clamp(42px, 9vw, 76px); line-height: .94; letter-spacing: -.06em; font-weight: 500; }
    .panel, .glass { border: 1px solid var(--line); background: var(--glass); box-shadow: var(--shadow); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .panel { padding: 24px; border-radius: 28px; }
    .test-list { display: grid; gap: 10px; padding: 0; list-style: none; }
    .test-item { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.7); }
    .test-item.pass { border-left: 5px solid var(--success); } .test-item.fail { border-left: 5px solid var(--danger); }
    .test-error { display: block; margin-top: 4px; font-size: 13px; }

    /* 4. App chrome */
    .app-shell { min-height: 100vh; padding: 18px 24px 56px; }
    .site-header {
      position: sticky; top: 14px; z-index: 30; width: min(1180px, 100%); min-height: 64px; margin: 0 auto 30px;
      padding: 10px 12px 10px 18px; display: flex; align-items: center; gap: 22px; border-radius: 22px;
    }
    .brand { border: 0; background: transparent; font-weight: 850; font-size: 21px; letter-spacing: -.04em; }
    .brand-dot { color: var(--deep-rose); }
    .top-nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .nav-link { min-height: 42px; padding: 10px 15px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-weight: 700; }
    .nav-link.active { color: white; background: var(--ink); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .lang-toggle, .icon-btn { min-width: 44px; min-height: 44px; border: 1px solid rgba(24,24,24,.12); border-radius: 999px; background: rgba(255,255,255,.74); color: var(--ink); font-weight: 800; }
    .page { width: min(1180px, 100%); margin: 0 auto; }
    .page-head { margin: 0 0 30px; display: flex; align-items: end; justify-content: space-between; gap: 20px; }
    .page-title { margin: 0; max-width: 780px; font-size: clamp(42px, 7vw, 82px); font-weight: 500; line-height: .93; letter-spacing: -.065em; }
    .page-subtitle { max-width: 620px; margin: 14px 0 0; color: var(--muted); font-size: 17px; line-height: 1.65; }
    .section { margin-top: 60px; }
    .section-head { margin-bottom: 20px; display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    .section-title { margin: 0; font-size: clamp(28px, 4vw, 44px); font-weight: 570; letter-spacing: -.045em; }
    .section-note { margin: 0; color: var(--muted); }

    /* 5. Buttons / form controls */
    .btn { min-height: 46px; padding: 11px 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 999px; font-weight: 800; text-decoration: none; transition: transform .22s ease, box-shadow .22s ease, background .22s ease; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--ink); color: white; box-shadow: 0 12px 28px rgba(24,24,24,.18); }
    .btn-light { background: rgba(255,255,255,.82); color: var(--ink); border-color: rgba(24,24,24,.08); }
    .btn-rose { background: var(--deep-rose); color: white; }
    .btn-ghost { background: transparent; color: var(--ink); border-color: rgba(24,24,24,.14); }
    .btn-small { min-height: 40px; padding: 8px 15px; font-size: 13px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .field { display: grid; gap: 7px; }
    .field label, .field-label { font-size: 13px; font-weight: 800; }
    .input, .select, .textarea { width: 100%; min-height: 50px; padding: 13px 15px; border: 1px solid rgba(24,24,24,.12); border-radius: 17px; background: rgba(255,255,255,.82); color: var(--ink); }
    .textarea { min-height: 110px; resize: vertical; }
    .field-error, .form-error { margin: 0; color: var(--danger); font-size: 13px; font-weight: 700; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .span-2 { grid-column: 1 / -1; }
    .auth-form { display: grid; gap: 15px; }

    /* 6. Landing */
    .landing-shell { min-height: 100vh; padding: 18px 24px 48px; overflow: hidden; }
    .landing-nav { width: min(1180px,100%); min-height: 60px; margin: 0 auto 26px; display: flex; align-items: center; }
    .landing-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .hero-grid { width: min(1180px,100%); margin: 0 auto; display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; align-items: stretch; }
    .hero-copy { min-height: 530px; padding: clamp(28px,5vw,68px); border-radius: 32px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
    .hero-copy::after { content: ""; position: absolute; width: 300px; height: 300px; right: -100px; bottom: -110px; border-radius: 50%; background: linear-gradient(145deg, rgba(255,255,255,.62), rgba(217,112,145,.52)); }
    .hero-title { position: relative; z-index: 1; margin: 0; max-width: 780px; font-size: clamp(58px,8.2vw,112px); line-height: .82; letter-spacing: -.085em; font-weight: 500; white-space: nowrap; }
    .hero-title span { display: block; margin-left: 15%; color: var(--deep-rose); }
    .hero-bottom { position: relative; z-index: 1; max-width: 600px; }
    .hero-lead { font-size: clamp(18px,2vw,23px); line-height: 1.45; }
    .hero-side { display: grid; grid-template-rows: 1fr auto; gap: 18px; }
    .gallery-card { min-height: 390px; padding: 22px; border-radius: 32px; background: var(--paper); overflow: hidden; position: relative; }
    .gallery-date { margin: 0; font-size: clamp(56px,7vw,92px); font-weight: 500; line-height: .78; letter-spacing: -.07em; }
    .gallery-date span { display: block; color: #aaa; font-weight: 350; }
    .gallery-orbit { position: absolute; width: 230px; height: 230px; right: -55px; bottom: 58px; border-radius: 50%; background: linear-gradient(140deg,#f6a0b5,#df6c91); }
    .avatar-stack { position: absolute; left: 24px; bottom: 24px; display: flex; }
    .avatar-stack .avatar { margin-left: -12px; border: 4px solid var(--paper); }
    .avatar-stack .avatar:first-child { margin-left: 0; }
    .black-card { min-height: 122px; padding: 22px; border-radius: 28px; background: var(--ink); color: white; display: flex; align-items: end; justify-content: space-between; }
    .black-card h2 { margin: 0; font-size: 30px; font-weight: 500; letter-spacing: -.04em; }
    .black-card p { margin: 4px 0 0; color: rgba(255,255,255,.55); }
    .marquee-zone { width: min(1180px,100%); margin: 22px auto 0; display: grid; gap: 10px; }
    .marquee { overflow: hidden; border-radius: 999px; }
    .marquee-track { width: max-content; display: flex; gap: 10px; padding: 3px 0; animation: flow-left 26s linear infinite; }
    .marquee.reverse .marquee-track { animation: flow-right 32s linear infinite; }
    .marquee:hover .marquee-track, .marquee:focus-within .marquee-track { animation-play-state: paused; }
    @keyframes flow-left { to { transform: translateX(-50%); } }
    @keyframes flow-right { from { transform: translateX(-50%); } to { transform: translateX(0); } }
    .skill-tag { min-height: 42px; padding: 10px 17px; border: 1px solid rgba(255,255,255,.6); border-radius: 999px; background: rgba(255,255,255,.7); color: var(--ink); font-size: 13px; font-weight: 800; white-space: nowrap; }
    button.skill-tag:hover { background: var(--ink); color: white; }
    .skill-tag.tech { background: rgba(222,211,242,.88); } .skill-tag.creative { background: rgba(255,220,204,.88); }
    .skill-tag.sports { background: rgba(250,183,178,.88); } .skill-tag.lifestyle { background: rgba(241,224,190,.9); }

    /* 7. Auth / onboarding */
    .auth-layout { width: min(1040px,100%); min-height: calc(100vh - 150px); margin: 0 auto; display: grid; grid-template-columns: .92fr 1.08fr; gap: 18px; }
    .auth-art { padding: 36px; border-radius: 32px; background: var(--ink); color: white; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
    .auth-art::after { content:""; width: 300px; height: 300px; position: absolute; right: -90px; bottom: 38px; border-radius: 50%; background: linear-gradient(150deg,#f3cbd6,#c96888); }
    .auth-art h1 { position: relative; z-index: 1; margin: 0; font-size: clamp(48px,7vw,84px); line-height: .9; letter-spacing: -.07em; font-weight: 500; }
    .auth-card { padding: clamp(26px,5vw,54px); border-radius: 32px; display: flex; flex-direction: column; justify-content: center; }
    .auth-card h1 { margin-bottom: 8px; font-size: clamp(40px,5vw,62px); letter-spacing: -.06em; font-weight: 500; }
    .muted { color: var(--muted); }
    .divider { margin: 20px 0; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content:""; height: 1px; flex: 1; background: rgba(24,24,24,.13); }
    .progress-wrap { margin-bottom: 28px; }
    .progress-meta { display:flex; justify-content:space-between; gap:12px; margin-bottom:8px; font-size:12px; font-weight:800; }
    .progress-bar { height: 8px; overflow: hidden; border-radius:999px; background:rgba(255,255,255,.48); }
    .progress-fill { height:100%; border-radius:inherit; background:var(--ink); transition:width .25s ease; }
    .onboarding-card { width:min(860px,100%); margin:0 auto; padding:clamp(24px,5vw,52px); border-radius:32px; }
    .skill-editor-list { display:grid; gap:14px; margin:20px 0; }
    .skill-editor { padding:16px; border-radius:22px; background:rgba(255,255,255,.58); border:1px solid rgba(24,24,24,.08); }
    .skill-editor-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .skill-editor .remove { margin-top:10px; }

    /* 8. Cards / discover */
    .search-hero { padding: 18px; border-radius: 25px; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .search-input { width:100%; min-height:54px; padding:14px 18px; border:0; border-radius:18px; background:rgba(255,255,255,.84); font-size:17px; }
    .goal-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .card-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .user-card { min-width:0; min-height:410px; padding:18px; border-radius:26px; background:rgba(255,249,250,.88); display:flex; flex-direction:column; box-shadow:0 18px 55px rgba(77,28,48,.13); }
    .card-top { display:flex; align-items:center; gap:13px; }
    .avatar { width:60px; height:60px; flex:0 0 auto; border-radius:50%; overflow:hidden; background:linear-gradient(145deg,#f4c6d2,#b85f7d); color:white; display:grid; place-items:center; font-weight:850; }
    .avatar.large { width:112px; height:112px; font-size:30px; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .user-name { margin:0 0 2px; font-size:21px; letter-spacing:-.03em; }
    .user-meta { margin:0; color:var(--muted); font-size:13px; }
    .user-bio { margin:16px 0; color:var(--muted); line-height:1.5; }
    .mini-heading { margin:0 0 7px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .skill-pills { display:flex; flex-wrap:wrap; gap:6px; }
    .mini-pill { padding:7px 10px; border-radius:999px; background:var(--blush); font-size:12px; font-weight:750; }
    .match-line { margin-top:auto; padding-top:16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .match-badge { display:inline-flex; align-items:center; gap:7px; min-height:34px; padding:7px 11px; border-radius:999px; background:var(--ink); color:white; font-size:12px; font-weight:850; }
    .card-actions { margin-top:13px; display:grid; grid-template-columns:auto 1fr; gap:8px; }
    .peer-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .peer-card { padding:18px; border-radius:24px; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:center; }
    .peer-card p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .loop-card { padding:clamp(22px,4vw,42px); border-radius:32px; background:var(--ink); color:white; }
    .loop-head { display:flex; align-items:start; justify-content:space-between; gap:14px; }
    .demo-chip { padding:8px 12px; border:1px solid rgba(255,255,255,.26); border-radius:999px; font-size:11px; font-weight:800; }
    .loop-flow { margin:30px 0; display:grid; grid-template-columns:1fr auto 1fr auto 1fr; gap:13px; align-items:center; }
    .loop-person { min-width:0; padding:18px; border-radius:23px; background:rgba(255,255,255,.1); text-align:center; }
    .loop-person .avatar { margin:0 auto 10px; }
    .loop-arrow { color:#f2a6ba; font-weight:850; text-align:center; }
    .loop-arrow small { display:block; max-width:90px; color:rgba(255,255,255,.6); font-weight:600; }
    .loop-return { margin:0 0 22px; padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.1); text-align:center; }

    /* 9. Search / profile / matches */
    .filter-bar { padding:16px; border-radius:24px; display:grid; grid-template-columns:2fr repeat(4,1fr) auto; gap:10px; }
    .filter-bar .input, .filter-bar .select { min-height:46px; }
    .result-count { margin:20px 0 12px; font-weight:800; }
    .profile-hero { padding:clamp(24px,5vw,48px); border-radius:32px; display:grid; grid-template-columns:auto 1fr auto; gap:24px; align-items:center; }
    .profile-hero h1 { margin:0 0 6px; font-size:clamp(38px,6vw,66px); font-weight:500; letter-spacing:-.06em; }
    .profile-columns { margin-top:18px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .profile-section { padding:24px; border-radius:26px; }
    .profile-skill { padding:14px 0; border-top:1px solid rgba(24,24,24,.1); }
    .profile-skill:first-of-type { border-top:0; }
    .profile-skill h3 { margin:0 0 4px; }
    .why-card { margin-top:18px; padding:24px; border-radius:26px; background:var(--ink); color:white; }
    .why-list { display:grid; gap:10px; padding:0; list-style:none; }
    .why-list li { padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.1); }
    .tabs { display:flex; gap:7px; margin-bottom:18px; overflow:auto; }
    .tab { min-height:44px; padding:10px 17px; border:1px solid rgba(24,24,24,.1); border-radius:999px; background:rgba(255,255,255,.55); font-weight:800; white-space:nowrap; }
    .tab.active { background:var(--ink); color:white; }
    .request-list { display:grid; gap:12px; }
    .request-row { padding:17px; border-radius:22px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .empty { padding:44px 24px; border-radius:28px; text-align:center; }
    .empty-icon { width:58px; height:58px; margin:0 auto 14px; border-radius:50%; display:grid; place-items:center; background:var(--blush); font-size:24px; }

    /* 10. Modal / toasts */
    .modal-backdrop { position:fixed; inset:0; z-index:60; padding:22px; display:grid; place-items:center; background:rgba(24,15,19,.44); backdrop-filter:blur(8px); }
    .modal { width:min(580px,100%); max-height:calc(100vh - 44px); overflow:auto; padding:26px; border-radius:28px; background:var(--paper); box-shadow:0 35px 100px rgba(24,15,19,.35); }
    .modal-head { display:flex; align-items:start; justify-content:space-between; gap:14px; }
    .modal-head h2 { margin:0; font-size:31px; letter-spacing:-.04em; }
    .modal-form { display:grid; gap:14px; margin-top:20px; }
    .notice { padding:12px 14px; border-radius:15px; background:#e0f2e7; color:#124d30; font-size:13px; font-weight:750; }
    .bottom-nav { display:none; }

    /* 11. Responsive */
    @media (max-width: 1024px) {
      .card-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .filter-bar { grid-template-columns:2fr repeat(2,1fr); }
      .filter-bar > :nth-child(n+4) { grid-row:2; }
      .hero-title { font-size:clamp(62px,10vw,102px); }
    }
    @media (max-width: 767px) {
      body { background-attachment:scroll; }
      .app-shell, .landing-shell { padding:12px 14px calc(92px + env(safe-area-inset-bottom)); }
      .site-header { position:relative; top:0; margin-bottom:22px; min-height:56px; padding:8px 10px 8px 14px; }
      .top-nav { display:none; } .header-actions { margin-left:auto; }
      .hero-grid, .auth-layout { grid-template-columns:1fr; }
      .hero-copy { min-height:520px; padding:28px 22px; }
      .hero-title { white-space: normal; font-size: clamp(54px,15vw,78px); }
      .hero-title span { margin-left:0; }
      .hero-side { grid-template-columns:1fr 1fr; grid-template-rows:auto; }
      .gallery-card { min-height:310px; } .black-card { min-height:310px; align-items:flex-end; }
      .landing-actions .desktop-only { display:none; }
      .page-head, .section-head { align-items:start; flex-direction:column; }
      .page-title { font-size:clamp(46px,16vw,72px); }
      .section { margin-top:46px; }
      .card-grid, .peer-grid, .profile-columns { grid-template-columns:1fr; }
      .user-card { min-height:0; }
      .filter-bar, .form-grid, .skill-editor-grid { grid-template-columns:1fr; }
      .filter-bar > :nth-child(n), .span-2 { grid-column:auto; grid-row:auto; }
      .profile-hero { grid-template-columns:auto 1fr; }
      .profile-hero > .button-row { grid-column:1/-1; }
      .loop-flow { grid-template-columns:1fr; }
      .loop-arrow { transform:rotate(90deg); min-height:56px; }
      .loop-arrow small { display:none; }
      .auth-art { min-height:230px; } .auth-art::after { width:190px; height:190px; }
      .auth-card { min-height:500px; }
      .search-hero { grid-template-columns:1fr; }
      .bottom-nav { position:fixed; z-index:45; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); padding:7px; display:grid; grid-template-columns:repeat(4,1fr); border-radius:22px; }
      .bottom-link { min-height:54px; padding:6px 3px; border:0; border-radius:16px; background:transparent; color:var(--muted); display:grid; place-items:center; gap:1px; font-size:10px; font-weight:800; }
      .bottom-link span:first-child { font-size:18px; }
      .bottom-link.active { background:var(--ink); color:white; }
      .marquee-track { animation-duration:38s; } .marquee.reverse .marquee-track { animation-duration:44s; }
      .modal-backdrop { padding:10px; align-items:end; }
      .modal { width:100%; max-height:88vh; border-radius:26px 26px 14px 14px; }
    }
    @media (max-width: 520px) {
      .hero-side { grid-template-columns:1fr; }
      .gallery-card { min-height:350px; } .black-card { min-height:130px; }
      .landing-nav { margin-bottom:14px; }
      .hero-title span { margin-left:7%; }
      .button-row .btn { flex:1; }
      .profile-hero { grid-template-columns:1fr; text-align:center; }
      .profile-hero .avatar { margin:auto; }
      .profile-hero .button-row { justify-content:center; }
      .request-row { align-items:start; flex-direction:column; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior:auto; }

    /* 4. State and helper functions */
    function cloneData(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function createInitialState() {
      return {
        version: STATE_VERSION,
        language: DEFAULT_LANGUAGE,
        isAuthenticated: false,
        currentUser: null,
        onboardingCompleted: false,
        onboardingStep: "profile",
        favorites: [],
        sentRequests: [],
        connections: [],
        editedSkills: []
      };
    }

    function normalizeState(value) {
      const base = createInitialState();
      if (!value || typeof value !== "object") return base;
      return {
        ...base,
        version: STATE_VERSION,
        language: ["zh", "en"].includes(value.language) ? value.language : base.language,
        isAuthenticated: value.isAuthenticated === true,
        currentUser: value.currentUser && typeof value.currentUser === "object" ? cloneData(value.currentUser) : null,
        onboardingCompleted: value.onboardingCompleted === true,
        onboardingStep: ["profile", "share", "learn", "complete"].includes(value.onboardingStep) ? value.onboardingStep : base.onboardingStep,
        favorites: Array.isArray(value.favorites) ? value.favorites.filter(item => typeof item === "string") : [],
        sentRequests: Array.isArray(value.sentRequests) ? value.sentRequests.filter(item => item && typeof item === "object") : [],
        connections: Array.isArray(value.connections) ? value.connections.filter(item => typeof item === "string") : [],
        editedSkills: Array.isArray(value.editedSkills) ? cloneData(value.editedSkills) : []
      };
    }

    function loadState(storage = window.localStorage) {
      try {
        const raw = storage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        const parsed = JSON.parse(raw);
        if (parsed.version !== STATE_VERSION) return createInitialState();
        return normalizeState(parsed);
      } catch (error) {
        console.warn("SkillSwap state recovery", error);
        return createInitialState();
      }
    }

    function saveState(state, storage = window.localStorage) {
      try {
        storage.setItem(STORAGE_KEY, JSON.stringify(normalizeState(state)));
        return true;
      } catch (error) {
        console.warn("SkillSwap state save failed", error);
        return false;
      }
    }

    function loginAsDemoUser(baseState = createInitialState()) {
      return normalizeState({
        ...baseState,
        version: STATE_VERSION,
        isAuthenticated: true,
        currentUser: cloneData(DEMO_USER),

        onboardingStep: "complete",

        sentRequests: cloneData(SEEDED_REQUESTS),
        connections: [...SEEDED_CONNECTIONS],
        editedSkills: cloneData(DEMO_USER.skillsOffered)
      });

    function clearDemoStorage(storage = window.localStorage) {
      try {
        storage.removeItem(STORAGE_KEY);
        return true;
      } catch (error) {
        console.warn("SkillSwap reset failed", error);

    /* 5. Router */
    const ROUTES = Object.freeze({
      "#/": "landing",
      "#/login": "login",
      "#/signup": "signup",
      "#/onboarding/profile": "onboarding-profile",
      "#/onboarding/share": "onboarding-share",
      "#/onboarding/learn": "onboarding-learn",
      "#/onboarding/complete": "onboarding-complete",
      "#/discover": "discover",
      "#/search": "search",
      "#/matches": "matches",
      "#/profile": "profile"
    });

    function parseHash(hash = window.location.hash || "#/") {
      const raw = hash.startsWith("#") ? hash : `#${hash}`;
      const [pathPart, queryPart = ""] = raw.split("?");
      const path = pathPart || "#/";
      const query = Object.fromEntries(new URLSearchParams(queryPart).entries());
      const personMatch = path.match(/^#\/people\/([^/?#]+)$/);
      if (personMatch) {
        return {
          name: "person",
          path,
          params: { id: decodeURIComponent(personMatch[1]) },
          query,
          isKnown: true
        };
      }
      const name = ROUTES[path] || "not-found";
      return { name, path, params: {}, query, isKnown: name !== "not-found" };
    }

    function buildHash(path, query = {}) {
      const normalized = path.startsWith("#")
        ? path
        : `#${path.startsWith("/") ? path : `/${path}`}`;
      const params = new URLSearchParams();
      Object.entries(query).forEach(([key, value]) => {
        if (value !== "" && value != null) params.set(key, String(value));
      });
      const queryString = params.toString();
      return queryString ? `${normalized}?${queryString}` : normalized;
    }

    function navigate(path, query = {}) {
      window.location.hash = buildHash(path, query);
    }

    function guardRoute(route, state) {
      const publicRoutes = new Set(["landing", "login", "signup"]);
      const onboardingRoutes = new Set([
        "onboarding-profile", "onboarding-share", "onboarding-learn", "onboarding-complete"
      ]);
      const appRoutes = new Set(["discover", "search", "matches", "profile", "person"]);

      if (publicRoutes.has(route.name)) {
        if (state.isAuthenticated && state.onboardingCompleted && ["login", "signup"].includes(route.name)) {
          return "#/discover";
        }
        return null;
      }
      if (onboardingRoutes.has(route.name)) {
        if (!state.isAuthenticated) return "#/signup";
        if (state.onboardingCompleted) return "#/discover";
        return null;
      }
      if (appRoutes.has(route.name)) {
        if (!state.isAuthenticated) return "#/login";
        if (!state.onboardingCompleted) {
          const step = ["profile", "share", "learn"].includes(state.onboardingStep)
            ? state.onboardingStep
            : "profile";
          return `#/onboarding/${step}`;
        }
      }
      return null;
    }

    function useHashRoute() {
      const [route, setRoute] = React.useState(() => parseHash());
      React.useEffect(() => {
        const handleChange = () => setRoute(parseHash());
        window.addEventListener("hashchange", handleChange);
        return () => window.removeEventListener("hashchange", handleChange);
      }, []);
      return route;
    }

    /* 6. Matching logic */
    function getSkillById(skillId) {
      return SKILLS.find(skill => skill.id === skillId) || null;
    }

    function getUserById(userId) {
      if (userId === DEMO_USER.id) return DEMO_USER;
      return MOCK_USERS.find(user => user.id === userId) || null;
    }

    function getSkillName(skillId, language = DEFAULT_LANGUAGE) {
      const skill = getSkillById(skillId);
      return skill ? (skill[language] || skill.en) : skillId;
    }

    function getInitials(name = "") {
      return name.trim().split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join("").toUpperCase();
    }

    function getLevelRank(level) {
      const rank = SKILL_LEVELS.indexOf(level);
      return rank < 0 ? 0 : rank;
    }

    function scoreComplementaryMatch(currentUser, candidate) {
      const teachable = candidate.skillsOffered.filter(offered =>
        currentUser.skillsWanted.some(wanted => wanted.skillId === offered.skillId)
      );
      if (!teachable.length) {
        return { user: candidate, score: 0, reciprocal: false, reasons: [] };
      }

      const reciprocalPairs = [];
      candidate.skillsWanted.forEach(wanted => {
        const offered = currentUser.skillsOffered.find(item => item.skillId === wanted.skillId);
        if (offered) reciprocalPairs.push({ offered, wanted });
      });
      const reciprocal = reciprocalPairs.length > 0;
      const sharedLanguage = candidate.languages.some(language => currentUser.languages.includes(language));
      const sameCity = candidate.city.toLowerCase() === currentUser.city.toLowerCase();
      const levelFit = teachable.some(offered => {
        const wanted = currentUser.skillsWanted.find(item => item.skillId === offered.skillId);
        return wanted && getLevelRank(offered.level) >= getLevelRank(wanted.level);
      });
      const categoryFit = teachable.some(offered => {
        const skill = getSkillById(offered.skillId);
        return skill && currentUser.skillsOffered.some(item => getSkillById(item.skillId)?.category === skill.category);
      });

      const reasons = teachable.map(offered => ({ type: "can-teach", skillId: offered.skillId }));
      reciprocalPairs.forEach(pair => reasons.push({
        type: "reciprocal",
        skillId: pair.wanted.skillId,
        reciprocalSkillId: teachable[0].skillId
      }));

      const score = Math.min(99,
        55 +
        (reciprocal ? 25 : 0) +
        (sharedLanguage ? 7 : 0) +
        (levelFit ? 7 : 0) +
        (sameCity ? 4 : 0) +
        (categoryFit ? 1 : 0)
      );
      return { user: candidate, score, reciprocal, reasons };
    }

    function findComplementaryMatches(currentUser, users = MOCK_USERS) {
      return users
        .map(user => scoreComplementaryMatch(currentUser, user))
        .filter(match => match.score > 0)
        .sort((a, b) => b.score - a.score || a.user.id.localeCompare(b.user.id));
    }

    function findPeerBuddies(currentUser, users = MOCK_USERS) {
      const currentSkills = [...currentUser.skillsOffered, ...currentUser.skillsWanted];
      return users
        .map(user => {
          const shared = [...user.skillsOffered, ...user.skillsWanted].filter(candidateSkill =>
            currentSkills.some(currentSkill =>
              currentSkill.skillId === candidateSkill.skillId && currentSkill.level === candidateSkill.level
            )
          );
          const sharedLanguage = user.languages.some(language => currentUser.languages.includes(language));
          return {
            user,
            score: shared.length && sharedLanguage ? 80 : 0,
            sharedSkillIds: [...new Set(shared.map(item => item.skillId))]
          };
        })
        .filter(match => match.score > 0)
        .sort((a, b) => b.score - a.score || a.user.id.localeCompare(b.user.id));
    }

    function filterUsers(users, filters = {}, language = DEFAULT_LANGUAGE) {
      const query = (filters.q || "").trim().toLocaleLowerCase();
      const matchingSkillIds = query ? SKILLS.filter(skill =>
        [skill.id, skill.zh, skill.en].some(value => value.toLocaleLowerCase().includes(query))
      ).map(skill => skill.id) : [];
      return users.filter(user => {
        const searchableSkills = user.skillsOffered
          .flatMap(item => {
            const skill = getSkillById(item.skillId);
            return skill ? [skill.id, skill.zh, skill.en] : [item.skillId];
          });
        const haystack = [
          user.name,
          user.city,
          user.bio?.[language],
          user.bio?.zh,
          user.bio?.en,
          ...searchableSkills
        ].filter(Boolean).join(" ").toLocaleLowerCase();
        const allSkills = [...user.skillsOffered, ...user.skillsWanted];
        const queryMatches = !query || (matchingSkillIds.length
          ? user.skillsOffered.some(item => matchingSkillIds.includes(item.skillId))
          : haystack.includes(query));
        const levelMatches = !filters.level || allSkills.some(item => item.level === filters.level);
        const cityMatches = !filters.city || user.city.toLocaleLowerCase() === filters.city.toLocaleLowerCase();
        const languageMatches = !filters.lang || user.languages.includes(filters.lang);
        return queryMatches && levelMatches && cityMatches && languageMatches;
      }).sort((a, b) => a.name.localeCompare(b.name));
    }

    /* 7. Utilities */
    function validateSignup(email, password, confirmation) {
      const errors = [];
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email || "")) errors.push("email");
      if ((password || "").length < 8) errors.push("password");
      if (password !== confirmation) errors.push("confirmation");
      return errors;
    }

    function validateProfile(profile) {
      const errors = [];
      if (!(profile?.name || "").trim()) errors.push("name");
      if (!(profile?.city || "").trim()) errors.push("city");
      return errors;
    }

    function validateSkillList(items) {
      const errors = [];
      if (!Array.isArray(items) || items.length === 0) return ["required"];
      const ids = items.map(item => item?.skillId).filter(Boolean);
      if (ids.length !== items.length) errors.push("skill");
      if (new Set(ids).size !== ids.length) errors.push("duplicate");
      return errors;
    }

    function toggleFavorite(favorites, userId) {
      return favorites.includes(userId)
        ? favorites.filter(id => id !== userId)
        : [...favorites, userId];
    }

    function createSwapRequest(requests, targetUserId, offeredSkillId, requestedSkillId, now = new Date()) {
      const duplicate = requests.find(request =>
        request.targetUserId === targetUserId &&
        request.offeredSkillId === offeredSkillId &&
        request.requestedSkillId === requestedSkillId &&
        request.status === "pending"
      );
      if (duplicate) return { requests: [...requests], request: duplicate, created: false };
      const request = {
        id: `request-${targetUserId}-${offeredSkillId}-${requestedSkillId}`,
        targetUserId,
        offeredSkillId,
        requestedSkillId,
        status: "pending",
        createdAt: now.toISOString()
      };
      return { requests: [...requests, request], request, created: true };
    }

    function localized(value, language) {
      return typeof value === "string" ? value : (value?.[language] || value?.en || "");
    }

    /* 9. Reusable UI components */
    function Button({ children, variant = "primary", small = false, className = "", ...props }) {
      return <button className={`btn btn-${variant} ${small ? "btn-small" : ""} ${className}`} {...props}>{children}</button>;
    }

    function Avatar({ user, size = "normal" }) {
      const [failed, setFailed] = React.useState(false);
      const label = user?.name || "SkillSwap";
      return (
        <div className={`avatar ${size === "large" ? "large" : ""}`} aria-label={label}>
          {!failed && user?.avatar
            ? <img src={user.avatar} alt="" onError={() => setFailed(true)} />
            : <span aria-hidden="true">{getInitials(label) || "SS"}</span>}
        </div>
      );
    }

    function SkillTag({ skillId, language, onClick, duplicate = false }) {
      const skill = getSkillById(skillId);
      const className = `skill-tag ${skill?.category === "technology" ? "tech" : skill?.category || ""}`;
      const content = getSkillName(skillId, language);
      return onClick
        ? <button type="button" className={className} onClick={onClick} data-duplicate={duplicate || undefined} tabIndex={duplicate ? -1 : 0} aria-hidden={duplicate || undefined}>{content}</button>
        : <span className={className} data-duplicate={duplicate || undefined} aria-hidden={duplicate || undefined}>{content}</span>;
    }

    function SkillMarquee({ language, interactive = false }) {

    function Modal({ title, children, onClose }) {
      const dialogRef = React.useRef(null);
      const previousFocus = React.useRef(document.activeElement);
      React.useEffect(() => {
        const dialog = dialogRef.current;
        dialog?.focus();
        const handleKey = event => {
          if (event.key === "Escape") onClose();
          if (event.key === "Tab" && dialog) {
            const focusable = [...dialog.querySelectorAll("button,input,select,textarea,[tabindex]:not([tabindex='-1'])")].filter(item=>!item.disabled);
            if (!focusable.length) return;
            const first = focusable[0], last = focusable[focusable.length-1];
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
          }
        };
        document.addEventListener("keydown",handleKey);
        return () => { document.removeEventListener("keydown",handleKey); previousFocus.current?.focus?.(); };
      }, [onClose]);
      return <div className="modal-backdrop" onMouseDown={event=>{if(event.target===event.currentTarget)onClose();}}><section className="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabIndex="-1" ref={dialogRef}><div className="modal-head"><h2 id="modal-title">{title}</h2><button type="button" className="icon-btn" onClick={onClose} aria-label="Close">×</button></div>{children}</section></div>;
    }

      const setFilter=(key,value)=>navigate("#/search",{...filters,[key]:value}); const save=id=>updateState({...state,favorites:toggleFavorite(state.favorites,id)});
      return <main className="page"><header className="page-head"><div><p className="eyebrow">SKILLSWAP SEARCH</p><h1 className="page-title">{t(language,"searchPeople")}</h1></div></header><section className="filter-bar glass"><label className="field"><span className="sr-only">{t(language,"search")}</span><input className="input" value={filters.q} onChange={event=>setFilter("q",event.target.value)} placeholder={t(language,"searchPlaceholder")}/></label><select className="select" aria-label={t(language,"filterLevel")} value={filters.level} onChange={event=>setFilter("level",event.target.value)}><option value="">{t(language,"filterLevel")}</option>{SKILL_LEVELS.map(level=><option value={level} key={level}>{levelLabel(level,language)}</option>)}</select><select className="select" aria-label={t(language,"filterCity")} value={filters.city} onChange={event=>setFilter("city",event.target.value)}><option value="">{t(language,"filterCity")}</option>{[...new Set(MOCK_USERS.map(user=>user.city))].map(city=><option key={city}>{city}</option>)}</select><select className="select" aria-label={t(language,"filterLanguage")} value={filters.lang} onChange={event=>setFilter("lang",event.target.value)}><option value="">{t(language,"filterLanguage")}</option><option value="zh">中文</option><option value="en">English</option></select><select className="select" aria-label={t(language,"sortBest")} value={filters.sort} onChange={event=>setFilter("sort",event.target.value)}><option value="best">{t(language,"sortBest")}</option><option value="name">{t(language,"sortName")}</option></select><Button small variant="light" onClick={()=>navigate("#/search")}>{t(language,"resetFilters")}</Button></section><p className="result-count" aria-live="polite">{t(language,"results",{count:users.length})}</p>{users.length?<div className="card-grid">{users.map(user=>{const match=scoreComplementaryMatch(state.currentUser,user);return <UserCard key={user.id} user={user} match={match.score?match:null} language={language} saved={state.favorites.includes(user.id)} onSave={save} fromHash={window.location.hash}/>})}</div>:<EmptyState title={t(language,"noResults")} body={t(language,"notFoundBody")} actionLabel={t(language,"clearFilters")} onAction={()=>navigate("#/search")}/>}</main>;
    }

    function SwapRequestModal({ target, state, language, updateState, onClose }) {
      const compatibleWanted=target.skillsOffered.find(item=>state.currentUser.skillsWanted.some(wanted=>wanted.skillId===item.skillId))||target.skillsOffered[0];
      const compatibleOffer=state.currentUser.skillsOffered.find(item=>target.skillsWanted.some(wanted=>wanted.skillId===item.skillId))||state.currentUser.skillsOffered[0];
      const [offered,setOffered]=React.useState(compatibleOffer?.skillId||""); const [wanted,setWanted]=React.useState(compatibleWanted?.skillId||""); const [message,setMessage]=React.useState(""); const [result,setResult]=React.useState(null);
      const submit=event=>{event.preventDefault();const next=createSwapRequest(state.sentRequests,target.id,offered,wanted);updateState({...state,sentRequests:next.requests});setResult(next.created?"success":"exists");};
      return <Modal title={t(language,"requestTitle")} onClose={onClose}>{result&&<div className="notice" role="status">{t(language,result==="success"?"requestSuccess":"requestExists")}</div>}<form className="modal-form" onSubmit={submit}><label className="field"><span>{t(language,"iCanOffer")}</span><select className="select" value={offered} onChange={event=>setOffered(event.target.value)}>{state.currentUser.skillsOffered.map(item=><option key={item.id} value={item.skillId}>{getSkillName(item.skillId,language)}</option>)}</select></label><label className="field"><span>{t(language,"iWantLearn")}</span><select className="select" value={wanted} onChange={event=>setWanted(event.target.value)}>{target.skillsOffered.map(item=><option key={item.id} value={item.skillId}>{getSkillName(item.skillId,language)}</option>)}</select></label><label className="field"><span>{t(language,"optionalMessage")}</span><textarea className="textarea" value={message} onChange={event=>setMessage(event.target.value)}/></label><div className="button-row"><Button type="button" variant="ghost" onClick={onClose}>{t(language,"cancel")}</Button><Button type="submit">{t(language,"send")}</Button>{result&&<Button type="button" variant="light" onClick={()=>{onClose();navigate("#/matches")}}>{t(language,"viewMatches")}</Button>}</div></form></Modal>;
    }

    function PersonProfilePage({ route, state, language, updateState }) {
      const user=getUserById(route.params.id); const [open,setOpen]=React.useState(false); if(!user)return <EmptyState title={t(language,"userNotFound")} body={t(language,"userNotFoundBody")} actionLabel={t(language,"backDiscover")} onAction={()=>navigate("#/discover")}/>;
      const match=scoreComplementaryMatch(state.currentUser,user); const backHash=route.query.from||"#/discover"; const save=()=>updateState({...state,favorites:toggleFavorite(state.favorites,user.id)});
      return <main className="page"><div className="button-row" style={{marginBottom:16}}><Button variant="light" small onClick={()=>window.location.hash=backHash}>← {t(language,"back")}</Button></div><section className="profile-hero glass"><Avatar user={user} size="large"/><div><p className="eyebrow">{t(language,"memberSince")}</p><h1>{user.name}</h1><p className="muted">{t(language,"ageCity",{age:user.age,city:user.city})} · {user.languages.join(" / ").toUpperCase()}</p><p>{localized(user.bio,language)}</p></div><div className="button-row"><Button variant="light" onClick={save}>{state.favorites.includes(user.id)?"♥":"♡"} {t(language,state.favorites.includes(user.id)?"saved":"save")}</Button><Button onClick={()=>setOpen(true)}>{t(language,"sendRequest")}</Button></div></section><div className="profile-columns"><ProfileSkillSection title={t(language,"teachSection")} items={user.skillsOffered} language={language}/><ProfileSkillSection title={t(language,"learnSection")} items={user.skillsWanted} language={language}/></div><section className="why-card"><p className="eyebrow">MATCH LOGIC</p><h2>{t(language,"whyMatch")}</h2><ul className="why-list">{match.reasons.length?match.reasons.map((reason,index)=><li key={index}>{reason.type==="reciprocal"?t(language,"reciprocalReason",{offer:getSkillName(reason.skillId,language),learn:getSkillName(reason.reciprocalSkillId,language)}):t(language,"teachesWanted",{name:user.name,skill:getSkillName(reason.skillId,language)})}</li>):<li>{t(language,"oneWay")}</li>}</ul></section>{open&&<SwapRequestModal target={user} state={state} language={language} updateState={updateState} onClose={()=>setOpen(false)}/>}</main>;
    }

    function MatchesPage({ state, language, updateState }) {
      const [tab,setTab]=React.useState("suggested"); const matches=findComplementaryMatches(state.currentUser); const save=id=>updateState({...state,favorites:toggleFavorite(state.favorites,id)});
      return <main className="page"><header className="page-head"><div><p className="eyebrow">SKILLSWAP MATCHES</p><h1 className="page-title">{t(language,"matchCenter")}</h1><p className="page-subtitle">{t(language,"matchLead")}</p></div></header><div className="tabs" role="tablist">{[["suggested","suggested"],["requests","requests"],["connections","connections"]].map(([id,key])=><button role="tab" aria-selected={tab===id} className={`tab ${tab===id?"active":""}`} key={id} onClick={()=>setTab(id)}>{t(language,key)}</button>)}</div>{tab==="suggested"&&<div className="card-grid">{matches.slice(0,6).map(match=><UserCard key={match.user.id} user={match.user} match={match} language={language} saved={state.favorites.includes(match.user.id)} onSave={save}/>)}</div>}{tab==="requests"&&<section><h2>{t(language,"incomingRequests")}</h2><EmptyState title={t(language,"noRequests")} body={t(language,"peerNote")}/><h2 style={{marginTop:28}}>{t(language,"sentRequests")}</h2>{state.sentRequests.length?<div className="request-list">{state.sentRequests.map(request=>{const user=getUserById(request.targetUserId);return <article className="request-row glass" key={request.id}><div className="card-top"><Avatar user={user}/><div><h3 className="user-name">{user?.name}</h3><p className="user-meta">{getSkillName(request.offeredSkillId,language)} ↔ {getSkillName(request.requestedSkillId,language)}</p></div></div><span className="match-badge">● {t(language,"pending")}</span></article>})}</div>:<EmptyState title={t(language,"noRequests")} body={t(language,"recommendedNote")} actionLabel={t(language,"discover")} onAction={()=>navigate("#/discover")}/>}</section>}{tab==="connections"&&<section>{state.connections.length?<div className="request-list">{state.connections.map(id=>{const user=getUserById(id);return <article className="request-row glass" key={id}><div className="card-top"><Avatar user={user}/><div><h3 className="user-name">{user?.name}</h3><p className="user-meta">{t(language,"connected")}</p></div></div><Button disabled variant="light">{t(language,"startChat")} · {t(language,"messagingSoon")}</Button></article>})}</div>:<EmptyState title={t(language,"noConnections")} body={t(language,"peerNote")}/>}</section>}</main>;
    }

    function CurrentProfilePage({ state, language, updateState }) {
      const [editing,setEditing]=React.useState(false); const [form,setForm]=React.useState(()=>cloneData(state.currentUser)); const [notice,setNotice]=React.useState(false);
      const cancel=()=>{setForm(cloneData(state.currentUser));setEditing(false);}; const save=event=>{event.preventDefault();updateState({...state,currentUser:form,editedSkills:form.skillsOffered});setNotice(true);setEditing(false);};
      if(editing)return <main className="page"><section className="onboarding-card glass"><h1 className="section-title">{t(language,"editProfile")}</h1><form className="form-grid" onSubmit={save}><label className="field"><span>{t(language,"nickname")}</span><input className="input" value={form.name} onChange={event=>setForm({...form,name:event.target.value})}/></label><label className="field"><span>{t(language,"city")}</span><input className="input" value={form.city} onChange={event=>setForm({...form,city:event.target.value})}/></label><label className="field span-2"><span>{t(language,"bio")}</span><textarea className="textarea" value={localized(form.bio,language)} onChange={event=>setForm({...form,bio:{...form.bio,[language]:event.target.value}})}/></label><div className="span-2"><h2>{t(language,"teachSection")}</h2><SkillEditor items={form.skillsOffered} onChange={items=>setForm({...form,skillsOffered:items})} language={language}/></div><div className="span-2"><h2>{t(language,"learnSection")}</h2><SkillEditor items={form.skillsWanted} onChange={items=>setForm({...form,skillsWanted:items})} language={language} wanted/></div><div className="button-row span-2"><Button type="button" variant="ghost" onClick={cancel}>{t(language,"cancel")}</Button><Button type="submit">{t(language,"saveChanges")}</Button></div></form></section></main>;
      const user=state.currentUser; return <main className="page">{notice&&<p className="notice" role="status">{t(language,"profileSaved")}</p>}<section className="profile-hero glass"><Avatar user={user} size="large"/><div><p className="eyebrow">{t(language,"memberSince")}</p><h1>{user.name}</h1><p className="muted">{t(language,"ageCity",{age:user.age,city:user.city})}</p><p>{localized(user.bio,language)}</p></div><div className="button-row"><Button onClick={()=>{setNotice(false);setEditing(true)}}>{t(language,"editProfile")}</Button><Button variant="ghost" onClick={resetDemo}>{t(language,"resetDemo")}</Button></div></section><div className="profile-columns"><ProfileSkillSection title={t(language,"teachSection")} items={user.skillsOffered} language={language}/><ProfileSkillSection title={t(language,"learnSection")} items={user.skillsWanted} language={language}/></div><p className="section-note" style={{marginTop:18}}>{t(language,"demoSafety")}</p></main>;
    }

    function NotFoundPage({ language }) { return <main className="page"><EmptyState title={t(language,"pageNotFound")} body={t(language,"notFoundBody")} actionLabel={t(language,"backHome")} onAction={()=>navigate("#/")}/></main>; }

    /* 11. ErrorBoundary */
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error("SkillSwap render error", error, info); }
      render() {
        return this.state.error
          ? <RecoveryScreen onReload={() => window.location.reload()} onReset={resetDemo} />
          : this.props.children;
      }
    }

    /* 12. App */
    function App() {
      const [state, setState] = React.useState(() => loadState());
      const route = useHashRoute();
      const updateState = React.useCallback(next => {
        setState(current => normalizeState(typeof next === "function" ? next(current) : next));
      }, []);
      const language = state.language;

      React.useEffect(() => {
        saveState(state);
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
      }, [state, language]);

      React.useEffect(() => {
        const redirect = guardRoute(route, state);
        if (redirect && window.location.hash !== redirect) window.location.hash = redirect;
      }, [route, state]);

      React.useEffect(() => { window.scrollTo({ top: 0, left: 0 }); }, [route.path]);

      const redirect = guardRoute(route, state);
      if (redirect) return null;

      const toggleLanguage = () => setState(current => ({ ...current, language: current.language === "zh" ? "en" : "zh" }));
      const demoLogin = () => { setState(current => loginAsDemoUser(current)); navigate("#/discover"); };
      const signup = () => {
        const newUser = {
          id: "local-user", name: "", age: 18, city: "", languages: ["zh"], avatar: "",
          bio: { zh: "", en: "" }, skillsOffered: [], skillsWanted: []
        };
        setState(current => normalizeState({ ...current, isAuthenticated: true, currentUser: newUser, onboardingCompleted: false, onboardingStep: "profile" }));
        navigate("#/onboarding/profile");
      };

      if (route.name === "landing") return <LandingPage language={language} onLanguage={toggleLanguage} onDemo={demoLogin}/>;

      let page;
      if (route.name === "login") page = <LoginPage language={language} onDemo={demoLogin}/>;
      else if (route.name === "signup") page = <SignupPage language={language} onSignup={signup}/>;
      else if (route.name === "onboarding-profile") page = <ProfileOnboardingPage state={state} language={language} updateState={updateState}/>;
      else if (route.name === "onboarding-share") page = <SkillOnboardingPage key="share-skills" state={state} language={language} updateState={updateState}/>;
      else if (route.name === "onboarding-learn") page = <SkillOnboardingPage key="learn-skills" state={state} language={language} updateState={updateState} wanted/>;
      else if (route.name === "onboarding-complete") page = <OnboardingCompletePage state={state} language={language} updateState={updateState}/>;
      else if (route.name === "discover") page = <DiscoverPage state={state} language={language} updateState={updateState}/>;
      else if (route.name === "search") page = <SearchPage route={route} state={state} language={language} updateState={updateState}/>;
      else if (route.name === "matches") page = <MatchesPage state={state} language={language} updateState={updateState}/>;
      else if (route.name === "profile") page = <CurrentProfilePage state={state} language={language} updateState={updateState}/>;
      else if (route.name === "person") page = <PersonProfilePage route={route} state={state} language={language} updateState={updateState}/>;
      else page = <NotFoundPage language={language}/>;

      const publicOrOnboarding = ["login","signup"].includes(route.name) || route.name.startsWith("onboarding-");
      return <AppShell language={language} routeName={route.name} onLanguage={toggleLanguage} showNavigation={state.isAuthenticated && state.onboardingCompleted && !publicOrOnboarding}>{page}</AppShell>;
    }

    /* 13. React createRoot entry point */
    if (window.React && window.ReactDOM && window.Babel) {
      ReactDOM.createRoot(document.getElementById("root")).render(
        <ErrorBoundary>{SELF_TEST_MODE ? <SelfTestReport /> : <App />}</ErrorBoundary>
      );
    }
  </script>
</body>
</html>
