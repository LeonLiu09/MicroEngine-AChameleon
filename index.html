<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e89bb1">
  <meta name="description" content="SkillSwap — 学你所爱，分享你所会。">
  <title>SkillSwap</title>
  <style>
    /* 1. Design tokens */
    :root {
      --ink: #181818; --paper: #fff9fa; --deep-rose: #b85f7d; --rose: #d97091;
      --soft-rose: #eba0b5; --blush: #f7dce3; --tag-cream: #f5dfe5; --glass: rgba(255,255,255,.58);
      --line: rgba(255,255,255,.66); --muted: rgba(24,24,24,.64); --focus: #6f2243;
      --danger: #7e1838; --success: #17633c; --shadow: 0 26px 80px rgba(77,28,48,.16);
      --font: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* 2. Reset / base */
    *, *::before, *::after { box-sizing: border-box; }
    html { color-scheme: light; scroll-behavior: smooth; }
    body {
      margin: 0; min-width: 320px; min-height: 100vh; overflow-x: hidden; color: var(--ink); font-family: var(--font);
      background:
        radial-gradient(circle at 8% 12%, rgba(255,249,250,.76), transparent 22%),
        radial-gradient(circle at 88% 18%, rgba(255,255,255,.48), transparent 28%),
        linear-gradient(145deg, #b75f7d 0%, #e99bb1 42%, #f5cbd5 72%, #d67e9a 100%);
      background-attachment: fixed;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .17;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
    }
    button, input, select, textarea { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { cursor: pointer; }
    img { display: block; max-width: 100%; }
    a { color: inherit; }
    h1, h2, h3, p { margin-top: 0; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid var(--focus); outline-offset: 3px;
    }
    #root { min-height: 100vh; position: relative; isolation: isolate; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

    /* 3. Failure-safe / generic */
    .static-fallback, .boot-shell, .recovery, .self-tests { width: min(680px, calc(100% - 32px)); margin: 0 auto; padding: 15vh 28px 36px; }
    .fallback-kicker, .eyebrow { margin: 0 0 12px; font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    .static-fallback h1, .boot-shell h1, .recovery h1 { margin: 0 0 16px; font-size: clamp(42px, 9vw, 76px); line-height: .94; letter-spacing: -.06em; font-weight: 500; }
    .panel, .glass { border: 1px solid var(--line); background: var(--glass); box-shadow: var(--shadow); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
    .panel { padding: 24px; border-radius: 28px; }
    .test-list { display: grid; gap: 10px; padding: 0; list-style: none; }
    .test-item { padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.7); }
    .test-item.pass { border-left: 5px solid var(--success); } .test-item.fail { border-left: 5px solid var(--danger); }
    .test-error { display: block; margin-top: 4px; font-size: 13px; }

    /* 4. App chrome */
    .app-shell { min-height: 100vh; padding: 18px 24px 56px; }
    .site-header {
      position: sticky; top: 14px; z-index: 30; width: min(1180px, 100%); min-height: 64px; margin: 0 auto 30px;
      padding: 10px 12px 10px 18px; display: flex; align-items: center; gap: 22px; border-radius: 22px;
    }
    .brand { border: 0; background: transparent; font-weight: 850; font-size: 21px; letter-spacing: -.04em; }
    .brand-dot { color: var(--deep-rose); }
    .top-nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .nav-link { min-height: 42px; padding: 10px 15px; border: 0; border-radius: 999px; background: transparent; color: var(--muted); font-weight: 700; }
    .nav-link.active { color: white; background: var(--ink); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .lang-toggle, .icon-btn { min-width: 44px; min-height: 44px; border: 1px solid rgba(24,24,24,.12); border-radius: 999px; background: rgba(255,255,255,.74); color: var(--ink); font-weight: 800; }
    .page { width: min(1180px, 100%); margin: 0 auto; }
    .page-head { margin: 0 0 30px; display: flex; align-items: end; justify-content: space-between; gap: 20px; }
    .page-title { margin: 0; max-width: 780px; font-size: clamp(42px, 7vw, 82px); font-weight: 500; line-height: .93; letter-spacing: -.065em; }
    .page-subtitle { max-width: 620px; margin: 14px 0 0; color: var(--muted); font-size: 17px; line-height: 1.65; }
    .section { margin-top: 60px; }
    .section-head { margin-bottom: 20px; display: flex; align-items: end; justify-content: space-between; gap: 16px; }
    .section-title { margin: 0; font-size: clamp(28px, 4vw, 44px); font-weight: 570; letter-spacing: -.045em; }
    .section-note { margin: 0; color: var(--muted); }

    /* 5. Buttons / form controls */
    .btn { min-height: 46px; padding: 11px 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: 999px; font-weight: 800; text-decoration: none; transition: transform .22s ease, box-shadow .22s ease, background .22s ease; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: var(--ink); color: white; box-shadow: 0 12px 28px rgba(24,24,24,.18); }
    .btn-light { background: rgba(255,255,255,.82); color: var(--ink); border-color: rgba(24,24,24,.08); }
    .btn-rose { background: var(--deep-rose); color: white; }
    .btn-ghost { background: transparent; color: var(--ink); border-color: rgba(24,24,24,.14); }
    .btn-small { min-height: 40px; padding: 8px 15px; font-size: 13px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    .button-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .field { display: grid; gap: 7px; }
    .field label, .field-label { font-size: 13px; font-weight: 800; }
    .input, .select, .textarea { width: 100%; min-height: 50px; padding: 13px 15px; border: 1px solid rgba(24,24,24,.12); border-radius: 17px; background: rgba(255,255,255,.82); color: var(--ink); }
    .textarea { min-height: 110px; resize: vertical; }
    .field-error, .form-error { margin: 0; color: var(--danger); font-size: 13px; font-weight: 700; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
    .span-2 { grid-column: 1 / -1; }
    .auth-form { display: grid; gap: 15px; }

    /* 6. Landing */
    .landing-shell { min-height: 100vh; padding: 18px 24px 48px; overflow: hidden; }
    .landing-nav { width: min(1180px,100%); min-height: 60px; margin: 0 auto 26px; display: flex; align-items: center; }
    .landing-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .hero-grid { width: min(1180px,100%); margin: 0 auto; display: grid; grid-template-columns: 1.1fr .9fr; gap: 18px; align-items: stretch; }
    .hero-copy { min-height: 530px; padding: clamp(28px,5vw,68px); border-radius: 32px; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
    .hero-copy::after { content: ""; position: absolute; width: 300px; height: 300px; right: -100px; bottom: -110px; border-radius: 50%; background: linear-gradient(145deg, rgba(255,255,255,.62), rgba(217,112,145,.52)); }
    .hero-title { position: relative; z-index: 1; margin: 0; max-width: 780px; font-size: clamp(58px,8.2vw,112px); line-height: .82; letter-spacing: -.085em; font-weight: 500; white-space: nowrap; }
    .hero-title span { display: block; margin-left: 15%; color: var(--deep-rose); }
    .hero-bottom { position: relative; z-index: 1; max-width: 600px; }
    .hero-lead { font-size: clamp(18px,2vw,23px); line-height: 1.45; }
    .hero-side { display: grid; grid-template-rows: 1fr auto; gap: 18px; }
    .gallery-card { min-height: 390px; padding: 22px; border-radius: 32px; background: var(--paper); overflow: hidden; position: relative; }
    .gallery-date { margin: 0; font-size: clamp(56px,7vw,92px); font-weight: 500; line-height: .78; letter-spacing: -.07em; }
    .gallery-date span { display: block; color: #aaa; font-weight: 350; }
    .gallery-orbit { position: absolute; width: 230px; height: 230px; right: -55px; bottom: 58px; border-radius: 50%; background: linear-gradient(140deg,#f6a0b5,#df6c91); }
    .avatar-stack { position: absolute; left: 24px; bottom: 24px; display: flex; }
    .avatar-stack .avatar { margin-left: -12px; border: 4px solid var(--paper); }
    .avatar-stack .avatar:first-child { margin-left: 0; }
    .black-card { min-height: 122px; padding: 22px; border-radius: 28px; background: var(--ink); color: white; display: flex; align-items: end; justify-content: space-between; }
    .black-card h2 { margin: 0; font-size: 30px; font-weight: 500; letter-spacing: -.04em; }
    .black-card p { margin: 4px 0 0; color: rgba(255,255,255,.55); }
    .community-stats { align-items: center; gap: 20px; }
    .stat-row { display: flex; align-items: end; gap: 14px; text-align: right; }
    .stat-item { display: grid; gap: 3px; }
    .stat-item strong { font-size: 22px; }
    .stat-item span { color: rgba(255,255,255,.62); font-size: 11px; white-space: nowrap; }
    .marquee-zone { width: min(1180px,100%); margin: 22px auto 0; display: grid; gap: 10px; }
    .marquee { overflow: hidden; border-radius: 999px; }
    .marquee-track { width: max-content; display: flex; gap: 10px; padding: 3px 0; animation: marquee 33s linear infinite; }
    .marquee.reverse .marquee-track { animation-duration: 40s; animation-direction: reverse; }
    .marquee-zone:hover .marquee-track, .marquee-zone:focus-within .marquee-track { animation-play-state: paused; }
    @keyframes marquee { to { transform: translateX(-50%); } }
    .skill-tag { min-height: 42px; padding: 10px 17px; border: 1px solid rgba(255,255,255,.82); border-radius: 999px; background: var(--tag-cream); color: #241d20; font-size: 13px; font-weight: 800; white-space: nowrap; }
    .skill-tag[data-tone="1"] { background: #f8e9ed; } .skill-tag[data-tone="2"] { background: #e9c1ce; }
    .skill-tag[data-tone="3"] { background: #fff7f2; } .skill-tag[data-tone="4"] { background: #d7a0b5; }
    button.skill-tag:hover { background: var(--ink); color: white; }

    /* 7. Auth / onboarding */
    .auth-layout { width: min(1040px,100%); min-height: calc(100vh - 150px); margin: 0 auto; display: grid; grid-template-columns: .92fr 1.08fr; gap: 18px; }
    .auth-art { padding: 36px; border-radius: 32px; background: var(--ink); color: white; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; position: relative; }
    .auth-art::after { content:""; width: 300px; height: 300px; position: absolute; right: -90px; bottom: 38px; border-radius: 50%; background: linear-gradient(150deg,#f3cbd6,#c96888); }
    .auth-art h1 { position: relative; z-index: 1; margin: 0; font-size: clamp(48px,7vw,84px); line-height: .9; letter-spacing: -.07em; font-weight: 500; }
    .auth-card { padding: clamp(26px,5vw,54px); border-radius: 32px; display: flex; flex-direction: column; justify-content: center; }
    .auth-card h1 { margin-bottom: 8px; font-size: clamp(40px,5vw,62px); letter-spacing: -.06em; font-weight: 500; }
    .muted { color: var(--muted); }
    .divider { margin: 20px 0; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; }
    .divider::before, .divider::after { content:""; height: 1px; flex: 1; background: rgba(24,24,24,.13); }
    .progress-wrap { margin-bottom: 28px; }
    .progress-meta { display:flex; justify-content:space-between; gap:12px; margin-bottom:8px; font-size:12px; font-weight:800; }
    .progress-bar { height: 8px; overflow: hidden; border-radius:999px; background:rgba(255,255,255,.48); }
    .progress-fill { height:100%; border-radius:inherit; background:var(--ink); transition:width .25s ease; }
    .onboarding-card { width:min(860px,100%); margin:0 auto; padding:clamp(24px,5vw,52px); border-radius:32px; }
    .skill-editor-list { display:grid; gap:14px; margin:20px 0; }
    .skill-editor { padding:16px; border-radius:22px; background:rgba(255,255,255,.58); border:1px solid rgba(24,24,24,.08); }
    .skill-editor-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
    .skill-editor .remove { margin-top:10px; }

    /* 8. Cards / discover */
    .search-hero { padding: 18px; border-radius: 25px; display: grid; grid-template-columns: 1fr auto; gap: 10px; }
    .search-input { width:100%; min-height:54px; padding:14px 18px; border:0; border-radius:18px; background:rgba(255,255,255,.84); font-size:17px; }
    .goal-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
    .card-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .user-card { min-width:0; min-height:410px; padding:18px; border-radius:26px; background:rgba(255,249,250,.88); display:flex; flex-direction:column; box-shadow:0 18px 55px rgba(77,28,48,.13); }
    .card-top { display:flex; align-items:center; gap:13px; }
    .avatar { width:60px; height:60px; flex:0 0 auto; border-radius:50%; overflow:hidden; background:linear-gradient(145deg,#f4c6d2,#b85f7d); color:white; display:grid; place-items:center; font-weight:850; }
    .avatar.large { width:112px; height:112px; font-size:30px; }
    .avatar img { width:100%; height:100%; object-fit:cover; }
    .user-name { margin:0 0 2px; font-size:21px; letter-spacing:-.03em; }
    .user-meta { margin:0; color:var(--muted); font-size:13px; }
    .user-bio { margin:16px 0; color:var(--muted); line-height:1.5; }
    .mini-heading { margin:0 0 7px; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
    .skill-pills { display:flex; flex-wrap:wrap; gap:6px; }
    .mini-pill { padding:7px 10px; border-radius:999px; background:var(--blush); font-size:12px; font-weight:750; }
    .match-line { margin-top:auto; padding-top:16px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .match-badge { display:inline-flex; align-items:center; gap:7px; min-height:34px; padding:7px 11px; border-radius:999px; background:var(--ink); color:white; font-size:12px; font-weight:850; }
    .card-actions { margin-top:13px; display:grid; grid-template-columns:auto 1fr; gap:8px; }
    .peer-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; }
    .peer-card { padding:18px; border-radius:24px; display:grid; grid-template-columns:auto 1fr; gap:13px; align-items:center; }
    .peer-card p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .demo-chip { padding:8px 12px; border:1px solid rgba(255,255,255,.26); border-radius:999px; font-size:11px; font-weight:800; }
    .trending-card { padding:22px; border-radius:28px; background:var(--ink); color:white; }
    .trending-card .section-head { align-items:center; }
    .trend-list { display:grid; gap:5px; margin-top:14px; }
    .trend-row { position:relative; width:100%; overflow:hidden; display:flex; justify-content:space-between; gap:12px; padding:10px 12px; border:0; border-radius:12px; background:rgba(255,255,255,.1); color:inherit; text-align:left; cursor:pointer; }
    .trend-row span { position:relative; z-index:1; font-size:13px; }
    .trend-row span:last-of-type { color:rgba(255,255,255,.72); }
    .trend-row i { position:absolute; inset:0 auto 0 0; background:rgba(242,166,186,.28); }

    /* 9. Search / profile / matches */
    .filter-bar { padding:16px; border-radius:24px; display:grid; grid-template-columns:2fr repeat(5,1fr) auto; gap:10px; }
    .filter-bar .input, .filter-bar .select { min-height:46px; }
    .result-count { margin:20px 0 12px; font-weight:800; }
    .search-starters { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .starter-card { min-height:170px; padding:20px; border-radius:24px; }
    .starter-card h2 { margin:0 0 14px; font-size:20px; }
    button.mini-pill { border:0; color:var(--ink); cursor:pointer; }
    .search-result-card { display:grid; grid-template-rows:auto auto auto 1fr; }
    .result-card-footer { align-self:end; margin-top:auto; padding-top:16px; }
    .rating-line { margin:10px 0 0; color:var(--muted); font-size:12px; line-height:1.45; }
    .match-badge.teaches { background:var(--deep-rose); }
    .match-badge.filtered { background:#67535c; }
    .contact-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .contact-card { min-width:0; padding:18px; border-radius:24px; display:grid; gap:14px; }
    .contact-main { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; }
    .contact-main h3 { margin:0 0 3px; font-size:20px; }
    .contact-main p { margin:0; color:var(--muted); font-size:13px; }
    .contact-status { max-width:150px; padding:6px 9px; border-radius:999px; background:var(--blush); color:var(--ink); font-size:11px; font-weight:800; text-align:center; }
    .contact-skills { display:grid; gap:6px; color:var(--muted); font-size:13px; }
    .contact-details { justify-self:start; }
    .profile-hero { padding:clamp(24px,5vw,48px); border-radius:32px; display:grid; grid-template-columns:auto 1fr auto; gap:24px; align-items:center; }
    .profile-hero h1 { margin:0 0 6px; font-size:clamp(38px,6vw,66px); font-weight:500; letter-spacing:-.06em; }
    .profile-columns { margin-top:18px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .profile-section { padding:24px; border-radius:26px; }
    .profile-skill { padding:14px 0; border-top:1px solid rgba(24,24,24,.1); }
    .profile-skill:first-of-type { border-top:0; }
    .profile-skill h3 { margin:0 0 4px; }
    .profile-details { margin-top:18px; padding:24px; border-radius:26px; display:grid; grid-template-columns:1fr 1.2fr; gap:22px; }
    .profile-details h2 { margin-top:0; }
    .profile-details dl { margin:0; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .profile-details dl div { border-top:1px solid rgba(24,24,24,.1); padding-top:10px; }
    .profile-details dt { color:var(--muted); font-size:12px; }
    .profile-details dd { margin:4px 0 0; font-weight:750; }
    .profile-details .rating-line { grid-column:1/-1; margin:0; }
    .why-card { margin-top:18px; padding:24px; border-radius:26px; background:var(--ink); color:white; }
    .why-list { display:grid; gap:10px; padding:0; list-style:none; }
    .why-list li { padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.1); }
    .request-list { display:grid; gap:12px; }
    .request-row { padding:17px; border-radius:22px; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    .empty { padding:44px 24px; border-radius:28px; text-align:center; }
    .empty-icon { width:58px; height:58px; margin:0 auto 14px; border-radius:50%; display:grid; place-items:center; background:var(--blush); font-size:24px; }

    /* 10. Modal / toasts */
    .modal-backdrop { position:fixed; inset:0; z-index:60; padding:22px; display:grid; place-items:center; background:rgba(24,15,19,.44); backdrop-filter:blur(8px); }
    .modal { width:min(580px,100%); max-height:calc(100vh - 44px); overflow:auto; padding:26px; border-radius:28px; background:var(--paper); box-shadow:0 35px 100px rgba(24,15,19,.35); }
    .modal-head { display:flex; align-items:start; justify-content:space-between; gap:14px; }
    .modal-head h2 { margin:0; font-size:31px; letter-spacing:-.04em; }
    .modal-form { display:grid; gap:14px; margin-top:20px; }
    .notice { padding:12px 14px; border-radius:15px; background:#e0f2e7; color:#124d30; font-size:13px; font-weight:750; }
    .bottom-nav { display:none; }

    /* 11. Responsive */
    @media (max-width: 1024px) {
      .card-grid { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .filter-bar { grid-template-columns:2fr repeat(2,1fr); }
      .filter-bar > :nth-child(n+4) { grid-row:2; }
      .search-starters { grid-template-columns:1fr 1fr; }
      .hero-title { font-size:clamp(62px,10vw,102px); }
    }
    @media (max-width: 767px) {
      body { background-attachment:scroll; }
      .app-shell, .landing-shell { padding:12px 14px calc(92px + env(safe-area-inset-bottom)); }
      .site-header { position:relative; top:0; margin-bottom:22px; min-height:56px; padding:8px 10px 8px 14px; }
      .top-nav { display:none; } .header-actions { margin-left:auto; }
      .hero-grid, .auth-layout { grid-template-columns:1fr; }
      .hero-copy { min-height:520px; padding:28px 22px; }
      .hero-title { white-space: normal; font-size: clamp(54px,15vw,78px); }
      .hero-title span { margin-left:0; }
      .hero-side { grid-template-columns:1fr 1fr; grid-template-rows:auto; }
      .gallery-card { min-height:310px; } .black-card { min-height:310px; align-items:flex-end; }
      .community-stats { align-items:center; }
      .page-head, .section-head { align-items:start; flex-direction:column; }
      .page-title { font-size:clamp(46px,16vw,72px); }
      .section { margin-top:46px; }
      .card-grid, .peer-grid, .contact-grid, .profile-columns, .profile-details { grid-template-columns:1fr; }
      .search-starters { grid-template-columns:1fr; }
      .user-card { min-height:0; }
      .filter-bar, .form-grid, .skill-editor-grid { grid-template-columns:1fr; }
      .filter-bar > :nth-child(n), .span-2 { grid-column:auto; grid-row:auto; }
      .profile-hero { grid-template-columns:auto 1fr; }
      .profile-hero > .button-row { grid-column:1/-1; }
      .auth-art { min-height:230px; } .auth-art::after { width:190px; height:190px; }
      .auth-card { min-height:500px; }
      .search-hero { grid-template-columns:1fr; }
      .bottom-nav { position:fixed; z-index:45; left:10px; right:10px; bottom:calc(10px + env(safe-area-inset-bottom)); padding:7px; display:grid; grid-template-columns:repeat(5,1fr); border-radius:22px; }
      .bottom-link { min-height:54px; padding:6px 3px; border:0; border-radius:16px; background:transparent; color:var(--muted); display:grid; place-items:center; gap:1px; font-size:10px; font-weight:800; }
      .bottom-link span:first-child { font-size:18px; }
      .bottom-link.active { background:var(--ink); color:white; }
      .modal-backdrop { padding:10px; align-items:end; }
      .modal { width:100%; max-height:88vh; border-radius:26px 26px 14px 14px; }
      .avatar-picker .btn { min-height:44px; }
    }
    @media (max-width: 520px) {
      .hero-side { grid-template-columns:1fr; }
      .gallery-card { min-height:350px; } .black-card { min-height:130px; }
      .community-stats { align-items:flex-start; flex-direction:column; }
      .stat-row { width:100%; justify-content:space-between; text-align:left; }
      .landing-nav { margin-bottom:14px; }
      .hero-title span { margin-left:7%; }
      .button-row .btn { flex:1; }
      .profile-hero { grid-template-columns:1fr; text-align:center; }
      .profile-hero .avatar { margin:auto; }
      .profile-hero .button-row { justify-content:center; }
      .request-row { align-items:start; flex-direction:column; }
    }
    /* 12. Chat */
    .chat-list { display:grid; gap:10px; }
    .chat-list-item { display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:16px 18px; border-radius:22px; cursor:pointer; transition:background .2s; border:1px solid transparent; }
    .chat-list-item:hover { background:rgba(255,255,255,.5); border-color:var(--line); }
    .chat-list-item .chat-preview { min-width:0; }
    .chat-list-item .chat-preview h3 { margin:0 0 4px; font-size:17px; }
    .chat-list-item .chat-preview p { margin:0; color:var(--muted); font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .chat-list-item .chat-time { color:var(--muted); font-size:12px; white-space:nowrap; }
    .chat-unread { min-width:20px; height:20px; padding:0 6px; border-radius:999px; background:var(--deep-rose); color:white; font-size:11px; font-weight:800; display:grid; place-items:center; }
    .chat-room { display:flex; flex-direction:column; height:calc(100vh - 200px); min-height:420px; }
    .chat-room-header { display:flex; align-items:center; gap:12px; padding:14px 18px; border-radius:22px; margin-bottom:14px; }
    .chat-room-header h2 { margin:0; font-size:18px; }
    .chat-room-header p { margin:0; color:var(--muted); font-size:13px; }
    .chat-messages { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:18px; border-radius:22px; background:rgba(255,255,255,.4); }
    .chat-bubble { max-width:72%; padding:11px 15px; border-radius:18px; font-size:15px; line-height:1.4; word-break:break-word; }
    .chat-bubble.sent { align-self:flex-end; background:var(--ink); color:white; border-bottom-right-radius:5px; }
    .chat-bubble.received { align-self:flex-start; background:rgba(255,255,255,.88); border-bottom-left-radius:5px; }
    .chat-bubble-time { font-size:11px; opacity:.6; margin-top:4px; }
    .chat-input-area { display:flex; align-items:center; gap:8px; padding:12px; border-radius:22px; margin-top:14px; }
    .chat-input-area .chat-text-input { flex:1; min-height:46px; padding:12px 16px; border:0; border-radius:999px; background:rgba(255,255,255,.88); font-size:15px; }
    .chat-action-btn { min-width:44px; min-height:44px; border:1px solid rgba(24,24,24,.12); border-radius:50%; background:rgba(255,255,255,.74); font-size:18px; display:grid; place-items:center; cursor:pointer; flex-shrink:0; }
    .chat-action-btn:hover { background:var(--blush); }
    .chat-send-btn { min-width:46px; min-height:46px; border:0; border-radius:50%; background:var(--ink); color:white; font-size:18px; display:grid; place-items:center; cursor:pointer; flex-shrink:0; }
    .chat-send-btn:disabled { opacity:.4; cursor:not-allowed; }
    .emoji-picker { display:grid; grid-template-columns:repeat(8,1fr); gap:4px; padding:12px; border-radius:18px; background:rgba(255,255,255,.92); margin-bottom:8px; max-height:200px; overflow-y:auto; }
    .emoji-btn { min-width:36px; min-height:36px; border:0; border-radius:8px; background:transparent; font-size:22px; cursor:pointer; }
    .emoji-btn:hover { background:var(--blush); }

    /* 13. Skill test */
    .test-container { width:min(680px,100%); margin:0 auto; }
    .test-intro { padding:36px; border-radius:28px; text-align:center; }
    .test-intro h2 { font-size:28px; margin:0 0 12px; }
    .test-intro p { color:var(--muted); line-height:1.6; margin:0 0 24px; }
    .test-progress-bar { height:6px; border-radius:999px; background:rgba(255,255,255,.5); overflow:hidden; margin-bottom:24px; }
    .test-progress-fill { height:100%; background:var(--ink); border-radius:inherit; transition:width .3s ease; }
    .test-question-card { padding:32px; border-radius:28px; }
    .test-question-card h2 { font-size:22px; margin:0 0 8px; line-height:1.4; }
    .test-question-meta { color:var(--muted); font-size:13px; margin:0 0 24px; }
    .test-options { display:grid; gap:12px; }
    .test-option { width:100%; padding:16px 20px; border:2px solid rgba(24,24,24,.1); border-radius:18px; background:rgba(255,255,255,.7); text-align:left; font-size:15px; font-weight:600; cursor:pointer; transition:all .2s; color:var(--ink); }
    .test-option:hover { border-color:var(--deep-rose); background:rgba(255,255,255,.9); }
    .test-option.selected { border-color:var(--ink); background:var(--ink); color:white; }
    .test-option.correct { border-color:var(--success); background:#e0f2e7; color:var(--success); }
    .test-option.wrong { border-color:var(--danger); background:#fce8ed; color:var(--danger); }
    .test-option:disabled { cursor:default; }
    .test-result { padding:36px; border-radius:28px; text-align:center; }
    .test-result-badge { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; border-radius:999px; background:var(--ink); color:white; font-size:16px; font-weight:800; margin:0 0 16px; }
    .test-result h2 { font-size:32px; margin:0 0 8px; }
    .test-result p { color:var(--muted); margin:0 0 24px; line-height:1.6; }
    .skill-badge-verified { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; background:#e0f2e7; color:var(--success); font-size:11px; font-weight:800; }
    .skill-badge-self { display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:999px; background:var(--blush); color:var(--deep-rose); font-size:11px; font-weight:800; }
    .test-recommend { padding:14px 18px; border-radius:16px; background:rgba(232,155,177,.15); border:1px solid rgba(184,95,125,.3); margin:16px 0; }
    .test-recommend p { margin:0; font-size:14px; line-height:1.5; }

    @media (max-width: 767px) {
      .chat-room { height:calc(100vh - 160px); }
      .chat-bubble { max-width:85%; }
      .emoji-picker { grid-template-columns:repeat(6,1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior:auto; }
      *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
      .marquee { overflow:visible; }
      .marquee-track { width:auto; flex-wrap:wrap; transform:none !important; animation:none !important; }
      .marquee-track [data-duplicate="true"] { display:none; }
    }
  </style>

    function legacyLocation(user={}) {
      const legacy=(user.city||"").toLocaleLowerCase();
      for (const country of COUNTRIES) {
        const city=country.cities.find(item => item.en.toLocaleLowerCase()===legacy || item.zh===user.city);
        if (city) return {countryId:country.id,cityId:city.id};
      }
      return {countryId:"cn",cityId:"tianjin"};
    }

    function normalizeUser(user={}) {
      const fallback=legacyLocation(user);
      return {
        ...cloneData(user),
        countryId:user.countryId||fallback.countryId,
        cityId:user.cityId||fallback.cityId,
        interests:Array.isArray(user.interests)?user.interests.filter(item=>typeof item==="string"):[],
        likes:Number.isFinite(user.likes)?user.likes:0,
        publishedAt:user.publishedAt||"2026-08-01T00:00:00.000Z",
        availability:Array.isArray(user.availability)?user.availability:[],
        meetingModes:Array.isArray(user.meetingModes)?user.meetingModes:["public-place"],
        publicLocations:Array.isArray(user.publicLocations)?user.publicLocations:[],
        reliability:Number.isFinite(user.reliability)?user.reliability:100,
        memberSince:user.memberSince||"2026-08-01T00:00:00.000Z",
        avatarDataUrl:typeof user.avatarDataUrl==="string"?user.avatarDataUrl:""
      };

    function createInitialState(){return {version:STATE_VERSION,language:DEFAULT_LANGUAGE,isAuthenticated:false,currentUser:null,onboardingCompleted:false,onboardingStep:"profile",favorites:[],sentRequests:[],connections:[],conversations:{},skillAssessments:{},editedSkills:[],recentSearches:[],notificationSettings:cloneData(DEFAULT_NOTIFICATIONS),privacySettings:cloneData(DEFAULT_PRIVACY),feedbackEntries:[],session:{loggedIn:false}};}
    function normalizeState(value){
      const base=createInitialState(); if(!value||typeof value!=="object")return base;
      const loggedIn=value.session?.loggedIn===true||value.isAuthenticated===true;
      const currentUser=value.currentUser&&typeof value.currentUser==="object"?normalizeUser(value.currentUser):null;
      const currentUserId=currentUser?.id||"";
      const favorites=Array.isArray(value.favorites)?value.favorites.filter(item=>typeof item==="string"&&item!==currentUserId):[];
      const sentRequests=Array.isArray(value.sentRequests)?value.sentRequests.filter(item=>item&&typeof item==="object"&&item.targetUserId!==currentUserId):[];
      return {...base,version:STATE_VERSION,language:["zh","en"].includes(value.language)?value.language:base.language,isAuthenticated:loggedIn,currentUser,onboardingCompleted:value.onboardingCompleted===true,onboardingStep:["profile","share","learn","complete"].includes(value.onboardingStep)?value.onboardingStep:base.onboardingStep,favorites,sentRequests,connections:Array.isArray(value.connections)?value.connections.filter(item=>typeof item==="string"):[],conversations:value.conversations&&typeof value.conversations==="object"?cloneData(value.conversations):{},skillAssessments:value.skillAssessments&&typeof value.skillAssessments==="object"?cloneData(value.skillAssessments):{},editedSkills:Array.isArray(value.editedSkills)?cloneData(value.editedSkills):[],recentSearches:Array.isArray(value.recentSearches)?[...new Set(value.recentSearches.filter(item=>typeof item==="string"))].slice(0,5):[],notificationSettings:{...base.notificationSettings,...Object.fromEntries(Object.entries(value.notificationSettings||{}).filter(([,item])=>typeof item==="boolean"))},privacySettings:{...base.privacySettings,...value.privacySettings},feedbackEntries:Array.isArray(value.feedbackEntries)?value.feedbackEntries.filter(item=>item&&typeof item==="object"):[],session:{loggedIn}};
    }

    function loadState(storage = window.localStorage) {
      try {
        const raw = storage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        const parsed = JSON.parse(raw);
        if (parsed.version !== STATE_VERSION) return createInitialState();
        return normalizeState(parsed);
      } catch (error) {
        console.warn("SkillSwap state recovery", error);
        return createInitialState();
      }
    }

    function saveState(state, storage = window.localStorage) {
      try {
        storage.setItem(STORAGE_KEY, JSON.stringify(normalizeState(state)));
        return true;
      } catch (error) {
        console.warn("SkillSwap state save failed", error);
        return false;
      }
    }

    function loginAsDemoUser(baseState = createInitialState()) {

    function updateSettingsState(state,section,value){
      if(section==="notifications")return normalizeState({...state,notificationSettings:{...state.notificationSettings,...value}});
      if(section==="privacy")return normalizeState({...state,privacySettings:{...state.privacySettings,...value}});
      if(section==="profile"||section==="skills"||section==="availability")return normalizeState({...state,currentUser:{...state.currentUser,...value}});
      if(section==="feedback")return normalizeState({...state,feedbackEntries:[...state.feedbackEntries,value]});
      return normalizeState(state);
    }

    const AVATAR_TYPES=Object.freeze(["image/jpeg","image/png","image/webp"]);
    const AVATAR_MAX_BYTES=5*1024*1024;
    function validateAvatarFile(file){
      if(!file||!AVATAR_TYPES.includes(file.type))return "type";
      if(file.size>AVATAR_MAX_BYTES)return "size";
      return "";
    }
    function resizeAvatar(file,documentRef=document){
      return new Promise((resolve,reject)=>{
        let reader; try{reader=new FileReader();}catch(error){reject(error);return;}
        reader.onerror=()=>reject(new Error("read"));
        reader.onload=()=>{
          let image; try{image=new Image();}catch(error){reject(error);return;}
          image.onerror=()=>reject(new Error("decode"));
          image.onload=()=>{
            try{const canvas=documentRef.createElement("canvas"); canvas.width=256; canvas.height=256;
            const context=canvas.getContext("2d"); const side=Math.min(image.width,image.height); if(!context||!side)throw new Error("canvas");
            context.drawImage(image,(image.width-side)/2,(image.height-side)/2,side,side,0,0,256,256);
            resolve(canvas.toDataURL("image/jpeg",.86));}catch(error){reject(error);}
          };
          try{image.src=reader.result;}catch(error){reject(error);}
        };
        try{reader.readAsDataURL(file);}catch(error){reject(error);}
      });
    }

    function logoutState(state){return normalizeState({...state,isAuthenticated:false,session:{...state.session,loggedIn:false}});}

    function clearDemoStorage(storage = window.localStorage) {

    function resetDemo() {

    /* 5. Router */
    const ROUTES = Object.freeze({
      "#/": "landing",
      "#/login": "login",
      "#/signup": "signup",
      "#/onboarding/profile": "onboarding-profile",
      "#/onboarding/share": "onboarding-share",
      "#/onboarding/learn": "onboarding-learn",
      "#/onboarding/complete": "onboarding-complete",
      "#/discover": "discover",
      "#/search": "search",
      "#/matches": "matches",
      "#/chat": "chat",
      "#/skill-test": "skill-test",
      "#/settings": "settings",
      "#/profile": "legacy-profile"
    });

    function parseHash(hash = window.location.hash || "#/") {
      const raw = hash.startsWith("#") ? hash : `#${hash}`;
      const [pathPart, queryPart = ""] = raw.split("?");
      const path = pathPart || "#/";
      const query = Object.fromEntries(new URLSearchParams(queryPart).entries());
      const personMatch = path.match(/^#\/people\/([^/?#]+)$/);
      if (personMatch) {
        return {
          name: "person",
          path,
          params: { id: decodeURIComponent(personMatch[1]) },
          query,
          isKnown: true
        };
      }
      const settingsMatch = path.match(/^#\/settings\/([^/?#]+)$/);
      if (settingsMatch) return { name:"settings-section", path, params:{section:decodeURIComponent(settingsMatch[1])}, query, isKnown:true };
      const chatMatch = path.match(/^#\/chat\/([^/?#]+)$/);
      if (chatMatch) return { name:"chat-room", path, params:{userId:decodeURIComponent(chatMatch[1])}, query, isKnown:true };
      const skillTestMatch = path.match(/^#\/skill-test\/([^/?#]+)$/);
      if (skillTestMatch) return { name:"skill-test-skill", path, params:{skillId:decodeURIComponent(skillTestMatch[1])}, query, isKnown:true };
      const name = ROUTES[path] || "not-found";
      return { name, path, params: {}, query, isKnown: name !== "not-found" };
    }

    function buildHash(path, query = {}) {
      const normalized = path.startsWith("#")
        ? path
        : `#${path.startsWith("/") ? path : `/${path}`}`;
      const params = new URLSearchParams();
      Object.entries(query).forEach(([key, value]) => {
        if (value !== "" && value != null) params.set(key, String(value));
      });
      const queryString = params.toString();
      return queryString ? `${normalized}?${queryString}` : normalized;
    }

    function navigate(path, query = {}) {
      window.location.hash = buildHash(path, query);
    }

    function guardRoute(route, state) {
      const publicRoutes = new Set(["landing", "login", "signup"]);
      const onboardingRoutes = new Set([
        "onboarding-profile", "onboarding-share", "onboarding-learn", "onboarding-complete"
      ]);
      const appRoutes = new Set(["discover", "search", "matches", "chat", "chat-room", "skill-test", "skill-test-skill", "settings", "settings-section", "legacy-profile", "person"]);

      if (publicRoutes.has(route.name)) {
        if (state.isAuthenticated && state.onboardingCompleted && ["login", "signup"].includes(route.name)) {
          return "#/discover";
        }
        return null;
      }
      if (onboardingRoutes.has(route.name)) {
        if (!state.isAuthenticated) return "#/signup";
        if (state.onboardingCompleted) return "#/discover";
        return null;
      }
      if (appRoutes.has(route.name)) {
        if (!state.isAuthenticated) return "#/login";
        if (!state.onboardingCompleted) {
          const step = ["profile", "share", "learn"].includes(state.onboardingStep)
            ? state.onboardingStep
            : "profile";
          return `#/onboarding/${step}`;
        }
      }
      return null;
    }

    function useHashRoute() {
      const [route, setRoute] = React.useState(() => parseHash());
      React.useEffect(() => {
        const handleChange = () => setRoute(parseHash());
        window.addEventListener("hashchange", handleChange);
        return () => window.removeEventListener("hashchange", handleChange);
      }, []);
      return route;
    }

    /* 6. Matching logic */
    function getSkillById(skillId) {
      return SKILLS.find(skill => skill.id === skillId) || null;
    }

    function getUserById(userId, currentUser = null) {
      if (currentUser?.id === userId) return currentUser;
      if (userId === DEMO_USER.id) return DEMO_USER;
      return MOCK_USERS.find(user => user.id === userId) || null;
    }

    function getSkillName(skillId, language = DEFAULT_LANGUAGE) {
      const skill = getSkillById(skillId);
      return skill ? (skill[language] || skill.en) : skillId;
    }

    function getInitials(name = "") {
      return name.trim().split(/\s+/).filter(Boolean).slice(0, 2).map(part => part[0]).join("").toUpperCase();
    }

    function getLevelRank(level) {
      const rank = SKILL_LEVELS.indexOf(level);
      return rank < 0 ? 0 : rank;
    }

    function scoreComplementaryMatch(currentUser, candidate) {
      const teachable = candidate.skillsOffered.filter(offered =>
        currentUser.skillsWanted.some(wanted => wanted.skillId === offered.skillId)
      );
      if (!teachable.length) {
        return { user: candidate, score: 0, reciprocal: false, reasons: [] };
      }

      const reciprocalPairs = [];
      candidate.skillsWanted.forEach(wanted => {
        const offered = currentUser.skillsOffered.find(item => item.skillId === wanted.skillId);
        if (offered) reciprocalPairs.push({ offered, wanted });
      });
      const reciprocal = reciprocalPairs.length > 0;
      const sharedLanguage = candidate.languages.some(language => currentUser.languages.includes(language));
      const sameCity = candidate.city.toLowerCase() === currentUser.city.toLowerCase();
      const levelFit = teachable.some(offered => {
        const wanted = currentUser.skillsWanted.find(item => item.skillId === offered.skillId);
        return wanted && getLevelRank(offered.level) >= getLevelRank(wanted.level);
      });
      const categoryFit = teachable.some(offered => {
        const skill = getSkillById(offered.skillId);
        return skill && currentUser.skillsOffered.some(item => getSkillById(item.skillId)?.category === skill.category);
      });

      const reasons = teachable.map(offered => ({ type: "can-teach", skillId: offered.skillId }));
      reciprocalPairs.forEach(pair => reasons.push({
        type: "reciprocal",
        skillId: pair.wanted.skillId,
        reciprocalSkillId: teachable[0].skillId
      }));

      const score = Math.min(99,
        55 +
        (reciprocal ? 25 : 0) +
        (sharedLanguage ? 7 : 0) +
        (levelFit ? 7 : 0) +
        (sameCity ? 4 : 0) +
        (categoryFit ? 1 : 0)
      );
      return { user: candidate, score, reciprocal, reasons };
    }

    function findComplementaryMatches(currentUser, users = MOCK_USERS) {
      return users
        .map(user => scoreComplementaryMatch(currentUser, user))
        .filter(match => match.score > 0)
        .sort((a, b) => b.score - a.score || a.user.id.localeCompare(b.user.id));
    }

    function findPeerBuddies(currentUser, users = MOCK_USERS) {
      const currentSkills = [...currentUser.skillsOffered, ...currentUser.skillsWanted];
      return users
        .map(user => {
          const shared = [...user.skillsOffered, ...user.skillsWanted].filter(candidateSkill =>
            currentSkills.some(currentSkill =>
              currentSkill.skillId === candidateSkill.skillId && currentSkill.level === candidateSkill.level
            )
          );
          const sharedLanguage = user.languages.some(language => currentUser.languages.includes(language));
          return {
            user,
            score: shared.length && sharedLanguage ? 80 : 0,
            sharedSkillIds: [...new Set(shared.map(item => item.skillId))]
          };
        })
        .filter(match => match.score > 0)
        .sort((a, b) => b.score - a.score || a.user.id.localeCompare(b.user.id));
    }

    function locationLabel(user, language) {
      const country=getCountryById(user?.countryId);
      const city=country?.cities.find(item=>item.id===user?.cityId);
      return [country?.[language],city?.[language]].filter(Boolean).join(" · ");
    }

    function sortUsers(users, sort="newest") {
      return [...users].sort((a,b) => sort==="liked"
        ? (b.likes-a.likes)||Date.parse(b.publishedAt)-Date.parse(a.publishedAt)||a.id.localeCompare(b.id)
        : Date.parse(b.publishedAt)-Date.parse(a.publishedAt)||a.id.localeCompare(b.id));
    }

    function formatPublishedAt(iso, language, now=new Date("2026-08-16T12:00:00.000Z")) {
      const days=Math.max(0,Math.floor((now-Date.parse(iso))/86400000));
      if(days===0)return language==="zh"?"今天":"Today";
      if(days<7)return language==="zh"?`${days} 天前`:`${days} days ago`;
      return new Intl.DateTimeFormat(language==="zh"?"zh-CN":"en-US",{year:"numeric",month:"short",day:"numeric"}).format(new Date(iso));
    }

    function hasActiveSearchFilters(filters={}) {
      return [filters.q,filters.level,filters.country,filters.city,filters.lang].some(value=>String(value||"").trim());
    }

    function normalizeSearchFilters(query={}) {
      const country=getCountryById(query.country)?.id || "";
      const requestedCity=country ? String(query.city||"") : "";
      const city=getCitiesForCountry(country).some(item=>item.id===requestedCity) ? requestedCity : "";
      return {q:query.q||"",level:query.level||"",country,city,lang:query.lang||"",sort:["newest","liked"].includes(query.sort)?query.sort:"newest"};
    }

    function rememberSearch(list,value){
      const clean=String(value||"").trim();
      if(!clean)return list.slice(0,5);
      return [clean,...list.filter(item=>item.toLocaleLowerCase()!==clean.toLocaleLowerCase())].slice(0,5);
    }

    function relationshipSummary(currentUser,user,language){
      const match=scoreComplementaryMatch(currentUser,user);
      if(match.reciprocal)return {type:"reciprocal",label:`${t(language,"twoWay")} · ${match.score}%`};
      const offered=user.skillsOffered.find(item=>currentUser.skillsWanted.some(wanted=>wanted.skillId===item.skillId));
      if(offered)return {type:"teaches",label:t(language,"canTeachSkill",{skill:getSkillName(offered.skillId,language)})};
      return {type:"filtered",label:t(language,"matchesFilters")};
    }

    function uniqueUsers(users){return [...new Map(users.filter(Boolean).map(user=>[user.id,user])).values()];}
    function buildMatchGroups(state){
      const selfId=state.currentUser?.id;
      return {
        complementary:uniqueUsers(findComplementaryMatches(state.currentUser).map(match=>match.user)).filter(user=>user.id!==selfId),
        favorites:uniqueUsers(state.favorites.map(getUserById)).filter(user=>user.id!==selfId),
        requests:uniqueUsers(state.sentRequests.map(request=>getUserById(request.targetUserId))).filter(user=>user.id!==selfId)
      };
    }

    function filterUsers(users, filters = {}, language = DEFAULT_LANGUAGE) {
      const query = (filters.q || "").trim().toLocaleLowerCase();
      const matchingSkillIds = query ? SKILLS.filter(skill =>
        [skill.id, skill.zh, skill.en].some(value => value.toLocaleLowerCase().includes(query))
      ).map(skill => skill.id) : [];
      return users.filter(user => {
        const searchableSkills = user.skillsOffered
          .flatMap(item => {
            const skill = getSkillById(item.skillId);
            return skill ? [skill.id, skill.zh, skill.en] : [item.skillId];
          });
        const haystack = [
          user.name,
          user.city,
          locationLabel(user,language),
          user.bio?.[language],
          user.bio?.zh,
          user.bio?.en,
          ...(user.interests||[]).map(interest=>profileLabel("interests",interest,language)),
          ...searchableSkills
        ].filter(Boolean).join(" ").toLocaleLowerCase();
        const allSkills = [...user.skillsOffered, ...user.skillsWanted];
        const queryMatches = !query || (matchingSkillIds.length
          ? user.skillsOffered.some(item => matchingSkillIds.includes(item.skillId))
          : haystack.includes(query));
        const levelMatches = !filters.level || allSkills.some(item => item.level === filters.level);
        const countryMatches = !filters.country || user.countryId === filters.country;
        const cityMatches = !filters.city || user.cityId === filters.city;
        const languageMatches = !filters.lang || user.languages.includes(filters.lang);
        return queryMatches && levelMatches && countryMatches && cityMatches && languageMatches;
      });
    }

    /* 7. Utilities */
    function validateSignup(email, password, confirmation) {
      const errors = [];
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email || "")) errors.push("email");
      if ((password || "").length < 8) errors.push("password");
      if (password !== confirmation) errors.push("confirmation");
      return errors;
    }

    function validateProfile(profile) {
      const errors = [];
      if (!(profile?.name || "").trim()) errors.push("name");
      if (!(profile?.city || "").trim()) errors.push("city");
      return errors;
    }

    function validateSkillList(items) {
      const errors = [];
      if (!Array.isArray(items) || items.length === 0) return ["required"];
      const ids = items.map(item => item?.skillId).filter(Boolean);
      if (ids.length !== items.length) errors.push("skill");
      if (new Set(ids).size !== ids.length) errors.push("duplicate");
      return errors;
    }

    function toggleFavorite(favorites, userId) {
      return favorites.includes(userId)
        ? favorites.filter(id => id !== userId)
        : [...favorites, userId];
    }

    function isSelfProfile(currentUser, profile) {
      return Boolean(currentUser?.id && profile?.id && currentUser.id === profile.id);
    }

    function createSwapRequest(requests, targetUserId, offeredSkillId, requestedSkillId, now = new Date(), meetingPolicy = "flexible") {
      const duplicate = requests.find(request =>
        request.targetUserId === targetUserId &&
        request.offeredSkillId === offeredSkillId &&
        request.requestedSkillId === requestedSkillId &&
        request.status === "connected"
      );
      if (duplicate) return { requests: [...requests], request: duplicate, created: false };
      const request = {
        id: `request-${targetUserId}-${offeredSkillId}-${requestedSkillId}`,
        targetUserId,
        offeredSkillId,
        requestedSkillId,
        status: "connected",
        createdAt: now.toISOString(), meetingPolicy
      };
      return { requests: [...requests, request], request, created: true };
    }

    function localized(value, language) {
      return typeof value === "string" ? value : (value?.[language] || value?.en || "");
    }

    /* 8. Self tests */
    const SELF_TEST_MODE = new URLSearchParams(window.location.search).get("selftest") === "1";
    const TEST_CASES = [];
    function test(name, run) { TEST_CASES.push({ name, run }); }
    function assert(condition, message) { if (!condition) throw new Error(message); }

    test("storage key is stable", () => {
      assert(STORAGE_KEY === "skillswap-mvp-v1", "Unexpected storage key");
    });

    test("initial language is Chinese", () => {
      assert(DEFAULT_LANGUAGE === "zh", "Initial language must be zh");

      assert(state.version === 1, "Wrong state version");
      assert(state.language === "zh", "Wrong initial state language");
      assert(state.isAuthenticated === false, "Fresh state must be logged out");

      assert(loadState(storage).version === 1, "Invalid JSON must recover");

    test("old storage versions recover", () => {
      const storage = {
        getItem: () => JSON.stringify({ version: 0, isAuthenticated: true }),
        setItem() {},
        removeItem() {}
      };
      assert(loadState(storage).isAuthenticated === false, "Old version must reset");
    });

    test("persisted self targets are removed from state and match groups", () => {
      const state = normalizeState({
        ...createInitialState(), version: STATE_VERSION, isAuthenticated: true, currentUser: cloneData(DEMO_USER),
        favorites: [DEMO_USER.id, "alice-01"],
        sentRequests: [{ targetUserId: DEMO_USER.id }, { targetUserId: "alice-01" }]
      });
      const groups = buildMatchGroups(state);
      assert(!state.favorites.includes(DEMO_USER.id), "Normalized favorites retained the current user");
      assert(!state.sentRequests.some(request => request.targetUserId === DEMO_USER.id), "Normalized requests retained the current user");
      assert(!Object.values(groups).flat().some(user => user.id === DEMO_USER.id), "A match group retained the current user");
    });

    /* 9. Reusable UI components */
    function Button({ children, variant = "primary", small = false, className = "", ...props }) {
      return <button className={`btn btn-${variant} ${small ? "btn-small" : ""} ${className}`} {...props}>{children}</button>;
    }

    function Avatar({ user, size = "normal" }) {
      const [failed, setFailed] = React.useState(false);
      const label = user?.name || "SkillSwap";
      const source = user?.avatarDataUrl || user?.avatar;
      React.useEffect(() => setFailed(false), [source]);
      return (
        <div className={`avatar ${size === "large" ? "large" : ""}`} aria-label={label}>
          {!failed && source
            ? <img src={source} alt="" onError={() => setFailed(true)} />
            : <span aria-hidden="true">{getInitials(label) || "SS"}</span>}
        </div>
      );
    }

    function AvatarPicker({user,language,onSave}){
      const inputRef=React.useRef(null); const token=React.useRef(0); const [pendingDataUrl,setPendingDataUrl]=React.useState(""); const [error,setError]=React.useState(""); const [processing,setProcessing]=React.useState(false);
      const clear=()=>{token.current++;setPendingDataUrl("");setError("");setProcessing(false);if(inputRef.current)inputRef.current.value="";}; React.useEffect(()=>()=>{token.current++;},[]);
      const choose=async event=>{
        const file=event.target.files?.[0]; if(!file)return;
        const request=++token.current;
        const validation=validateAvatarFile(file);
        if(validation){setError(t(language,validation==="type"?"avatarTypeError":"avatarSizeError"));setPendingDataUrl("");setProcessing(false);return;}
        setError("");setProcessing(true);
        try{const data=await resizeAvatar(file);if(request===token.current)setPendingDataUrl(data);}
        catch(error){if(request===token.current){setPendingDataUrl("");setError(t(language,"avatarProcessError"));}}
        finally{if(request===token.current)setProcessing(false);}
      };
      const save=()=>{if(!pendingDataUrl)return;onSave(pendingDataUrl);clear();};
      const preview=pendingDataUrl?{...user,avatarDataUrl:pendingDataUrl}:user;
      return <section className="avatar-picker" aria-busy={processing}><Avatar user={preview} size="large"/><label className="field"><span>{t(language,"changeAvatar")}</span><input ref={inputRef} className="input" type="file" accept={AVATAR_TYPES.join(",")} onChange={choose}/></label>{error&&<p className="form-error" role="alert">{error}</p>}{processing&&<p className="muted" role="status" aria-live="polite">{language==="zh"?"正在处理头像…":"Processing avatar…"}</p>}<div className="button-row"><Button type="button" small variant="light" disabled={!pendingDataUrl||processing} onClick={save}>{t(language,"saveChanges")}</Button><Button type="button" small variant="ghost" onClick={clear}>{t(language,"cancel")}</Button></div></section>;
    }

    function SkillTag({ skillId, language, onClick, duplicate = false, tone }) {
      const skill = getSkillById(skillId);
      const className = `skill-tag ${skill?.category === "technology" ? "tech" : skill?.category || ""}`;
      const content = getSkillName(skillId, language);
      return onClick
        ? <button type="button" className={className} onClick={onClick} data-duplicate={duplicate || undefined} data-tone={tone} tabIndex={duplicate ? -1 : 0} aria-hidden={duplicate || undefined}>{content}</button>
        : <span className={className} data-duplicate={duplicate || undefined} data-tone={tone} aria-hidden={duplicate || undefined}>{content}</span>;
    }

    function SkillMarquee({ language, interactive = false }) {
      return (
        <div className="marquee-zone" aria-label={t(language, "socialGallery")}>
          {MARQUEE_ROWS.map((row, rowIndex) => (
            <div className={`marquee ${rowIndex ? "reverse" : ""}`} key={rowIndex}>
              <div className="marquee-track">
                {[...row, ...row].map((skillId, index) => (
                  <SkillTag
                    key={`${rowIndex}-${skillId}-${index}`}
                    skillId={skillId}
                    language={language}
                    duplicate={index >= row.length}
                    tone={(index%4)+1}
                    onClick={interactive && index < row.length ? () => navigate("#/search", { q: skillId }) : null}
                  />
                ))}
              </div>
            </div>
          ))}
        </div>
      );
    }

    function Modal({ title, children, onClose, language=DEFAULT_LANGUAGE }) {
      const dialogRef = React.useRef(null);
      const previousFocus = React.useRef(document.activeElement);
      React.useEffect(() => {
        const dialog = dialogRef.current;
        dialog?.focus();
        const handleKey = event => {
          if (event.key === "Escape") onClose();
          if (event.key === "Tab" && dialog) {
            const focusable = [...dialog.querySelectorAll("button,input,select,textarea,[tabindex]:not([tabindex='-1'])")].filter(item=>!item.disabled);
            if (!focusable.length) return;
            const first = focusable[0], last = focusable[focusable.length-1];
            if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
            else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
          }
        };
        document.addEventListener("keydown",handleKey);
        return () => { document.removeEventListener("keydown",handleKey); previousFocus.current?.focus?.(); };
      }, [onClose]);
      return <div className="modal-backdrop" onMouseDown={event=>{if(event.target===event.currentTarget)onClose();}}><section className="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabIndex="-1" ref={dialogRef}><div className="modal-head"><h2 id="modal-title">{title}</h2><button type="button" className="icon-btn" onClick={onClose} aria-label={t(language,"closeDialog")}>×</button></div>{children}</section></div>;

    /* 14. Chat feature */
    const EMOJI_SET = Object.freeze(["😀","😂","😊","😍","🤔","👍","👏","🙏","💪","🎉","❤️","✨","🔥","✅","🤝","📚","🎵","📸","💻","🎨","🍳","🏸","⭐","🥳","😅","🤗","👀","💯","🎯","☕"]);
    const CHAT_REPLIES = Object.freeze({ zh:["好的！","收到～","听起来不错！","我们可以约个时间细聊","没问题！","哈哈，可以呀","我也是这么想的","那太好了！","方便的时候告诉我你的时间～","期待我们的交换！"], en:["Sounds good!","Got it!","Great idea!","We can schedule a time to chat","No problem!","Haha, sure!","I was thinking the same","That's awesome!","Let me know your availability~","Looking forward to our swap!"] });

    function appendChatMessage(state, userId, message) {
      const conversation = state.conversations?.[userId] || { messages: [] };
      const nextConversation = { messages: [...conversation.messages, message], lastMessage: message.text, lastMessageAt: message.at };
      return { ...state, conversations: { ...state.conversations, [userId]: nextConversation } };
    }
    function formatChatTime(iso, language) {
      if (!iso) return "";
      const date = new Date(iso);
      const now = new Date();
      const sameDay = date.toDateString() === now.toDateString();
      const time = date.toLocaleTimeString(language === "zh" ? "zh-CN" : "en-US", { hour: "2-digit", minute: "2-digit" });
      return sameDay ? time : date.toLocaleDateString(language === "zh" ? "zh-CN" : "en-US", { month: "short", day: "numeric" });
    }

    function ChatListPage({ state, language }) {
      const items = state.connections.map(id => ({ user: getUserById(id, state.currentUser), conversation: state.conversations?.[id] })).filter(item => item.user);
      return <main className="page"><header className="page-head"><div><p className="eyebrow">SKILLSWAP CHAT</p><h1 className="page-title">{t(language,"chatTitle")}</h1><p className="page-subtitle">{t(language,"chatEmptySub")}</p></div></header>{items.length?<div className="chat-list">{items.map(({user,conversation})=><button type="button" className="chat-list-item glass" key={user.id} onClick={()=>navigate(`#/chat/${user.id}`)}><Avatar user={user}/><div className="chat-preview"><h3>{user.name}</h3><p>{conversation?.lastMessage||t(language,"chatEmptySub")}</p></div><span className="chat-time">{formatChatTime(conversation?.lastMessageAt,language)}</span></button>)}</div>:<EmptyState title={t(language,"noConversations")} body={t(language,"chatEmpty")} actionLabel={t(language,"discover")} onAction={()=>navigate("#/discover")}/>}</main>;
    }

    function ChatRoomPage({ route, state, language, updateState }) {
      const user = getUserById(route.params.userId, state.currentUser);
      const [text, setText] = React.useState("");
      const [showEmoji, setShowEmoji] = React.useState(false);
      const [toast, setToast] = React.useState("");
      const messagesEndRef = React.useRef(null);
      const conversation = state.conversations?.[route.params.userId];
      if (!user) return <main className="page"><EmptyState title={t(language,"userNotFound")} body={t(language,"userNotFoundBody")} actionLabel={t(language,"back")} onAction={()=>navigate("#/chat")}/></main>;
      const showToast = message => { setToast(message); window.setTimeout(()=>setToast(""), 1800); };
      const send = () => {
        const trimmed = text.trim();
        if (!trimmed) return;
        const message = { from: state.currentUser.id, text: trimmed, at: new Date().toISOString() };
        updateState(current => appendChatMessage(current, user.id, message));
        setText(""); setShowEmoji(false);
        const replyText = CHAT_REPLIES[language][Math.floor(Math.random()*CHAT_REPLIES[language].length)];
        window.setTimeout(()=>{ updateState(current => appendChatMessage(current, user.id, { from: user.id, text: replyText, at: new Date().toISOString() })); }, 1200);
      };
      React.useEffect(()=>{ messagesEndRef.current?.scrollIntoView({ behavior:"smooth" }); },[conversation?.messages?.length]);
      return <main className="page"><div className="button-row" style={{marginBottom:14}}><Button variant="light" small onClick={()=>navigate("#/chat")}>← {t(language,"chatTitle")}</Button></div><div className="chat-room">
        <div className="chat-room-header glass"><Avatar user={user}/><div><h2>{user.name}</h2><p>{t(language,"connectedChat")}</p></div></div>
        <div className="chat-messages" aria-live="polite">{(conversation?.messages||[]).map((message,index)=><div key={index} className={`chat-bubble ${message.from===state.currentUser.id?"sent":"received"}`}>{message.text}<div className="chat-bubble-time">{formatChatTime(message.at,language)}</div></div>)}<div ref={messagesEndRef}/></div>
        {toast&&<p className="notice" role="status" style={{marginTop:10}}>{t(language,"comingSoon")}: {toast}</p>}
        {showEmoji&&<div className="emoji-picker">{EMOJI_SET.map(emoji=><button type="button" className="emoji-btn" key={emoji} onClick={()=>setText(current=>current+emoji)}>{emoji}</button>)}</div>}
        <div className="chat-input-area glass">
          <button type="button" className="chat-action-btn" aria-label={t(language,"videoCall")} title={t(language,"videoCall")} onClick={()=>showToast(t(language,"videoCall"))}>📹</button>
          <button type="button" className="chat-action-btn" aria-label={t(language,"takePhoto")} title={t(language,"takePhoto")} onClick={()=>showToast(t(language,"takePhoto"))}>📷</button>
          <button type="button" className="chat-action-btn" aria-label={t(language,"sendImage")} title={t(language,"sendImage")} onClick={()=>showToast(t(language,"sendImage"))}>🖼️</button>
          <button type="button" className="chat-action-btn" aria-label={t(language,"emoji")} title={t(language,"emoji")} onClick={()=>setShowEmoji(current=>!current)}>😊</button>
          <input className="chat-text-input" value={text} placeholder={t(language,"chatPlaceholder")} onChange={event=>setText(event.target.value)} onKeyDown={event=>{if(event.key==="Enter")send();}} aria-label={t(language,"chatPlaceholder")}/>
          <button type="button" className="chat-send-btn" onClick={send} disabled={!text.trim()} aria-label={t(language,"sendMessage")}>➤</button>
        </div>
      </div></main>;
    }

    /* 15. Adaptive skill test */
    const TEST_QUESTION_COUNT = 10;
    function SkillTestSelectPage({ state, language }) {
      const testableSkills = [...new Set([...state.currentUser.skillsOffered.map(item=>item.skillId), ...state.currentUser.skillsWanted.map(item=>item.skillId)])].filter(id => SKILL_TEST_COVERED.includes(id));
      return <main className="page"><div className="test-container"><header className="page-head"><div><p className="eyebrow">SKILLSWAP ASSESSMENT</p><h1 className="page-title">{t(language,"skillTestTitle")}</h1><p className="page-subtitle">{t(language,"skillTestIntro")}</p></div></header>
      <section className="test-intro glass"><h2>{t(language,"skillTestSelectSkill")}</h2>{testableSkills.length?<div className="skill-pills" style={{justifyContent:"center"}}>{testableSkills.map(skillId=><button type="button" className="mini-pill" key={skillId} onClick={()=>navigate(`#/skill-test/${skillId}`)}>{getSkillName(skillId,language)}{state.skillAssessments?.[skillId]&&" ✓"} →</button>)}</div>:<p className="muted">{t(language,"selectSkillToTest")}</p>}
      {Object.keys(state.skillAssessments||{}).length>0&&<div style={{marginTop:20}}>{Object.entries(state.skillAssessments).map(([skillId,assessment])=><p key={skillId} className="rating-line"><span className="skill-badge-verified">✓ {getSkillName(skillId,language)} · {levelLabel(assessment.level,language)} · {t(language,"skillTestResultScore",{score:assessment.score})}</span></p>)}</div>}</section></div></main>;
    }

    function SkillTestRunPage({ route, state, language, updateState }) {
      const skillId = route.params.skillId;
      const [history, setHistory] = React.useState([]);
      const [levelIndex, setLevelIndex] = React.useState(1);
      const [current, setCurrent] = React.useState(null);
      const [selected, setSelected] = React.useState(null);
      const [phase, setPhase] = React.useState("quiz");
      const usedRef = React.useRef([]);
      const askedRef = React.useRef(0);
      const startLevel = state.currentUser.skillsOffered.find(item=>item.skillId===skillId)?.level || "beginner";
      const startLevelIndex = React.useMemo(()=>Math.max(0, SKILL_LEVELS.indexOf(startLevel) - 1), []);

      const loadQuestion = nextIndex => {
        const question = pickQuestion(skillId, SKILL_LEVELS[nextIndex], usedRef.current);
        if (question) usedRef.current = [...usedRef.current, question.id];
        setCurrent(question);
        setSelected(null);
      };
      React.useEffect(()=>{ setLevelIndex(startLevelIndex); loadQuestion(startLevelIndex); }, [skillId]);

      if (!SKILL_TEST_COVERED.includes(skillId)) return <main className="page"><div className="test-container"><EmptyState title={t(language,"selectSkillToTest")} body={t(language,"skillTestSelectSkill")} actionLabel={t(language,"skillTestBack")} onAction={()=>navigate("#/skill-test")}/></div></main>;

      const answered = history.length;
      const choose = optionIndex => {
        if (selected !== null || !current) return;
        const isCorrect = optionIndex === current.answer;
        setSelected(optionIndex);
        setHistory(historyItems => [...historyItems, { correct: isCorrect, level: SKILL_LEVELS[levelIndex] }]);
        askedRef.current += 1;
      };
      const next = () => {
        if (askedRef.current >= TEST_QUESTION_COUNT) {
          const correctCount = history.filter(item=>item.correct).length;
          const finalIndex = correctCount === 0 ? 0 : Math.max(...history.filter(item=>item.correct).map(item=>SKILL_LEVELS.indexOf(item.level)));
          const assessment = { level: SKILL_LEVELS[finalIndex], score: Math.round(correctCount/TEST_QUESTION_COUNT*100), testedAt: new Date().toISOString(), questionCount: TEST_QUESTION_COUNT };
          updateState(currentState => ({ ...currentState, skillAssessments: { ...(currentState.skillAssessments||{}), [skillId]: assessment } }));
          setPhase("result");
          return;
        }
        const lastCorrect = history[history.length-1]?.correct;
        const nextIndex = lastCorrect ? Math.min(levelIndex+1, SKILL_LEVELS.length-1) : Math.max(levelIndex-1, 0);
        setLevelIndex(nextIndex);
        loadQuestion(nextIndex);
      };

      if (phase === "result") {
        const correctCount = history.filter(item=>item.correct).length;
        const finalIndex = correctCount === 0 ? 0 : Math.max(...history.filter(item=>item.correct).map(item=>SKILL_LEVELS.indexOf(item.level)));
        return <main className="page"><div className="test-container"><section className="test-result glass"><span className="test-result-badge">✓ {getSkillName(skillId,language)} · {levelLabel(SKILL_LEVELS[finalIndex],language)}</span><h2>{t(language,"skillTestResult")}</h2><p>{t(language,"skillTestResultScore",{score:Math.round(correctCount/TEST_QUESTION_COUNT*100)})}</p><p>{t(language,"skillTestResultDesc")}</p><div className="button-row" style={{justifyContent:"center"}}><Button onClick={()=>{setHistory([]);usedRef.current=[];askedRef.current=0;setPhase("quiz");setLevelIndex(startLevelIndex);loadQuestion(startLevelIndex);}}>{t(language,"skillTestRetake")}</Button><Button variant="light" onClick={()=>{navigate("#/skill-test");}}>{t(language,"skillTestBack")}</Button></div></section></div></main>;
      }

      return <main className="page"><div className="test-container"><div className="button-row" style={{marginBottom:14}}><Button variant="light" small onClick={()=>navigate("#/skill-test")}>← {t(language,"skillTestBack")}</Button></div>
        <div className="test-progress-bar" aria-label={`${answered}/${TEST_QUESTION_COUNT}`}><div className="test-progress-fill" style={{width:`${answered/TEST_QUESTION_COUNT*100}%`}}/></div>
        {current ? <section className="test-question-card glass"><p className="test-question-meta">{t(language,"skillTestQuestion",{current:answered+1,total:TEST_QUESTION_COUNT})} · {t(language,"skillTestLevel",{level:levelLabel(SKILL_LEVELS[levelIndex],language)})} · {getSkillName(skillId,language)}</p><h2>{localized(current.q,language)}</h2><div className="test-options">{current.options.map((option,index)=><button type="button" key={index} className={`test-option ${selected===null?"":index===current.answer?"correct":selected===index?"wrong":""}`} onClick={()=>choose(index)} disabled={selected!==null}>{localized(option,language)}</button>)}</div>{selected!==null&&<div className="button-row" style={{marginTop:20}}><Button onClick={next}>{answered+1>=TEST_QUESTION_COUNT?t(language,"skillTestSubmit"):t(language,"skillTestNext")}</Button></div>}</section> : <section className="test-question-card glass"><p>{t(language,"selectSkillToTest")}</p></section>}
      </div></main>;
    }

    /* 11. ErrorBoundary */
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { error: null };
      }
      static getDerivedStateFromError(error) { return { error }; }
      componentDidCatch(error, info) { console.error("SkillSwap render error", error, info); }
      render() {
        return this.state.error
          ? <RecoveryScreen onReload={() => window.location.reload()} onReset={resetDemo} />
          : this.props.children;
      }
    }

    /* 12. App */
    function App() {
      const [state, setState] = React.useState(() => loadState());
      const route = useHashRoute();
      const updateState = React.useCallback(next => {
        setState(current => normalizeState(typeof next === "function" ? next(current) : next));
      }, []);
      const language = state.language;

      React.useEffect(() => {
        saveState(state);
        document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
      }, [state, language]);

      React.useEffect(() => {
        if (route.name === "legacy-profile") { window.location.hash = "#/settings"; return; }
        const redirect = guardRoute(route, state);
        if (redirect && window.location.hash !== redirect) window.location.hash = redirect;
      }, [route, state]);

      React.useEffect(() => { window.scrollTo({ top: 0, left: 0 }); }, [route.path]);

      const redirect = guardRoute(route, state);
      if (redirect) return null;

      const toggleLanguage = () => setState(current => ({ ...current, language: current.language === "zh" ? "en" : "zh" }));
      const demoLogin = () => { setState(current => loginAsDemoUser(current)); navigate("#/discover"); };
      const signup = () => {
        const newUser = {
          id: "local-user", name: "", age: 18, city: "", languages: ["zh"], avatar: "",
          bio: { zh: "", en: "" }, skillsOffered: [], skillsWanted: []
        };
        setState(current => normalizeState({ ...current, isAuthenticated: true, currentUser: newUser, onboardingCompleted: false, onboardingStep: "profile" }));
        navigate("#/onboarding/profile");
      };

      if (route.name === "landing") return <LandingPage language={language} onLanguage={toggleLanguage} onDemo={demoLogin}/>;

      let page;
      if (route.name === "login") page = <LoginPage language={language} onDemo={demoLogin}/>;
      else if (route.name === "signup") page = <SignupPage language={language} onSignup={signup}/>;
      else if (route.name === "onboarding-profile") page = <ProfileOnboardingPage state={state} language={language} updateState={updateState}/>;
      else if (route.name === "onboarding-share") page = <SkillOnboardingPage key="share-skills" state={state} language={language} updateState={updateState}/>;
      else if (route.name === "onboarding-learn") page = <SkillOnboardingPage key="learn-skills" state={state} language={language} updateState={updateState} wanted/>;
      else if (route.name === "onboarding-complete") page = <OnboardingCompletePage state={state} language={language} updateState={updateState}/>;
      else if (route.name === "discover") page = <DiscoverPage state={state} language={language} updateState={updateState}/>;
      else if (route.name === "search") page = <SearchPage route={route} state={state} language={language} updateState={updateState}/>;
      else if (route.name === "matches") page = <MatchesPage state={state} language={language} updateState={updateState}/>;
      else if (route.name === "chat") page = <ChatListPage state={state} language={language}/>;
      else if (route.name === "chat-room") page = <ChatRoomPage route={route} state={state} language={language} updateState={updateState}/>;
      else if (route.name === "skill-test") page = <SkillTestSelectPage state={state} language={language}/>;
      else if (route.name === "skill-test-skill") page = <SkillTestRunPage route={route} state={state} language={language} updateState={updateState}/>;
      else if (route.name === "settings") page = <SettingsHome route={route} state={state} language={language} updateState={updateState}/>;
      else if (route.name === "settings-section") page = <SettingsSectionPage route={route} state={state} language={language} updateState={updateState}/>;
      else if (route.name === "person") page = <PersonProfilePage route={route} state={state} language={language} updateState={updateState}/>;
      else page = <NotFoundPage language={language}/>;

      const publicOrOnboarding = ["login","signup"].includes(route.name) || route.name.startsWith("onboarding-");
      return <AppShell language={language} routeName={route.name} onLanguage={toggleLanguage} showNavigation={state.isAuthenticated && state.onboardingCompleted && !publicOrOnboarding}>{page}</AppShell>;
    }

    /* 13. React createRoot entry point */
    if (window.React && window.ReactDOM && window.Babel) {
      ReactDOM.createRoot(document.getElementById("root")).render(
        <ErrorBoundary>{SELF_TEST_MODE ? <SelfTestReport /> : <App />}</ErrorBoundary>
      );
    }
  </script>
</body>
</html>
